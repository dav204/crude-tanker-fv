# graph.yaml — THE declared automation graph (2026-09-13, owner: "ok let's do that").
#
# Every node that runs without a hand — launchd jobs, the lanes inside their wrappers, the desktop
# app's scheduled agent tasks, the governor's tasks, and the human/external nodes they touch — with
# what it reads, what it writes, what triggers it, and who commits its tracked writes. Edges are
# DERIVED (a node that writes a path another node reads), never hand-drawn. Rendered into
# OPERATING.md by `python -m crude_tanker_fv.graph render --write`; checked by
# `python -m crude_tanker_fv.graph check` and tests/test_graph.py:
#   R1 ids unique, kinds/repos valid; R2 every referenced id exists;
#   R3 every drift-list path is some node's declared write;
#   R4 a producer-repo node that writes a TRACKED path not on the drift list must name who commits
#      it (`commits: self | <node id>`) — an uncommitted tracked write is "non-drift dirt" and it
#      freezes auto-land, holds auto-push, starves price-refresh and flips the sentinel to META-MODE
#      (the 2026-09-12 Saturday freeze: weekly_report_*.md had no committer);
#   R5 every com.crude-tanker-fv.* plist and every crude-fv-* scheduled task has a node;
#   R6 automation commits of the last 30 days (matched by commit_subject_prefix) touch only the
#      declared writes of their node — an undeclared writer fails the build.
# Paths are repo-relative globs; `**` = any depth. `external:` names a thing outside both repos.
# Clock facts (verified 2026-09-13): the machine is America/New_York, but launchd fires every
# StartCalendarInterval hour +3h from the plist value (state/automation_runs.log: plist 07:00 ->
# 14:00Z, 08:00 -> 15:00Z, 08:15 -> 15:15Z, 09:00 -> 16:00Z, 18:30 -> 01:30Z). `runs` below records
# the OBSERVED wall-clock; the plist value is in parentheses. Dated 2026-09-17: the runs log sits at
# +4h (Eastern) through the 08-16 shutdown and +7h (Pacific) from the 08-17 02:49 boot on, with
# /etc/localtime relinked to New_York on 08-24 — launchd's calendar monitor keeps the zone it booted
# in, so the next reboot (or the Nov 1 DST change) moves every job again and R7 fires. Every
# launchd wrapper exits 0 as skipped-paused while a PAUSE file exists at the repo root, and writes
# state/heartbeat/<job> on EVERY exit (skips included) — the sentinel's liveness check reads only
# those heartbeats.
version: 1
repo: crude-tanker-fv
kinds: [launchd, lane, scheduled-task, script, human, external]
tree_drift_only_required_by: [price-refresh, sentinel-checks, auto-land, auto-push, regen]
# R7: launchd fires each job at its plist hour plus this many hours to UTC (observed 2026-09-13:
# plist 08:15 -> 15:15Z). A plist reload, a reboot in another zone, or the DST change moves
# every job at once; the check fails until the ordering assumptions are re-verified and this
# value is updated. A slot the Mac slept through fires ONCE at wake instead — one job or several,
# seconds apart — so an off-slot run is a NOTE (`graph check` prints it, the suite stays green)
# until the first hour-bearing sibling runs: on its slot = catch-up, off its slot = shift, and only
# then does R7 fail (2026-09-18; re-verified 2026-09-17: still 7).
launchd_utc_offset_hours: 7
# Scheduled tasks that fired once and are disabled in the app; they keep their folder, so R5
# skips them by name (a re-enabled one must get a node).
retired_tasks:
  - portfolio-monday-premarket-check    # one-shot 2026-06-29 08:30: staged the Q2 sells as IBKR drafts
  - portfolio-monday-open-fill-check    # one-shot 2026-06-29 09:45: reported the fills

nodes:

  # ---------------------------------------------------------------- launchd (no app, no LLM)
  - id: edgar-poll
    kind: launchd
    repo: crude-tanker-fv
    plist: com.crude-tanker-fv.edgar-poll
    entry: scripts/edgar_poll_cron.sh
    runs: hourly at :20 (the minute is unaffected by the launchd +3h hour offset)
    triggers: [clock]
    requires: [no PAUSE file, network:sec.gov resolvable]
    reads: [inputs/data_sources.yaml, inputs/earnings_calendar.yaml, external:EDGAR, external:HKEX, external:MFN (Oslo NewsWeb mirror)]
    writes: [state/edgar_manifest.jsonl, state/edgar_poll.json, state/hkex_poll.json, state/newsweb_poll.json, inputs/filings/**,
             state/edgar_poll.log, state/edgar_poll.err, state/heartbeat/edgar-poll, state/automation_runs.log]
    commits: none
    on_failure: "rc in state/automation_runs.log; sentinel FETCH-FAILED (digest; pages after 2 runs inside an earnings window); DNS unresolvable -> skipped-no-network rc 0 with a FRESH heartbeat"
    notes: "coverage from data_sources.yaml (sec_edgar / hkex_stockid / mfn_slug keys), cadence from earnings_calendar.yaml — it never reads the watchlist; inputs/filings/* is gitignored except _manifest.json, which commit-drift promotes from state/edgar_manifest.jsonl (the poller never writes the tracked snapshot)"

  - id: rocketchat-ingest
    kind: launchd
    repo: crude-tanker-fv
    plist: com.crude-tanker-fv.rocketchat-ingest
    entry: scripts/ingest_rocketchat_cron.sh
    runs: 10:00 America/New_York = 14:00 UTC (plist 07:00; launchd +3h)
    triggers: [clock]
    requires: [no PAUSE file, env:~/.config/crude-tanker-fv.env, external:tesseract on PATH, network:rc.seekingalpha.com resolvable]
    reads: [external:Rocket.Chat, inputs/rocketchat_sources.yaml, inputs/research_pareto/**, inputs/research_pareto_other/**, inputs/ffa_drybulk/**,
            inputs/market_data/transactions/_scan_state.json]
    writes: [state/rocketchat_ingest.json, state/arrivals.jsonl, inputs/research_pareto/**/*.pdf, inputs/research_pareto/**/_quarantine/*.reason,
             inputs/ffa_drybulk/**, inputs/research_pareto/_manifest.json, inputs/market_data/transactions/_scan_state.json,
             outputs/sp_print_candidates.md, outputs/ffa_ocr_queue.md, state/ffa_ocr_state.json, state/ffa_ocr_curves.json, state/ffa_scratch/**,
             state/rocketchat_ingest.log, state/rocketchat_ingest.err, state/heartbeat/rocketchat-ingest, state/automation_runs.log]
    commits: commit-drift
    notes: "chain: ingest_rocketchat -> pareto_archive --build-manifest -> sp_scan -> ffa_ocr; the tracked writes are drift-list paths staged by commit-drift — EXCEPT the latent _quarantine/*.reason (tracked, non-drift, written by arrivals.quarantine on the first malformed Pareto PDF; commit-drift does NOT stage it). gitignored 2026-09-13 (inputs/research_pareto*/**/_quarantine/ — visible on disk, never tracked, so it can no longer freeze the lane)"

  - id: price-refresh
    kind: launchd
    repo: crude-tanker-fv
    plist: com.crude-tanker-fv.price-refresh
    entry: scripts/price_refresh_cron.sh
    runs: 21:30 America/New_York = 01:30 UTC next day (plist 18:30; launchd +3h)
    triggers: [clock]
    requires: [tree drift-only, no PAUSE file, network:query1.finance.yahoo.com resolvable]
    reads: [inputs/watchlist.yaml, inputs/market_data/prices_daily.yaml, scripts/drift_files.txt, external:Yahoo chart API]
    writes: [inputs/market_data/prices_daily.yaml, state/price_refresh.log, state/price_refresh.err, state/heartbeat/price-refresh, state/automation_runs.log]
    commits: commit-drift
    on_failure: "skips on non-drift dirt (the 7/04 lesson); DNS unresolvable -> skipped-no-network rc 0 with a FRESH heartbeat (the 8/17-8/25 seven-night stand-downs); sentinel PRICE-BASIS / STALE-STATIC on the digest"
    notes: "carries forward the prior vintage for names whose fetch fails; the OPERATIVE committer since 8/13 has been human-owner-chat ('Price vintage ... absorbed as its own commit', 9x) — either absorbs the vintage ALONE before a regen (CLAUDE.md price-basis rule)"

  - id: news-pull
    kind: launchd
    repo: crude-tanker-fv
    plist: com.crude-tanker-fv.news-pull
    entry: scripts/news_pull_cron.sh
    runs: Saturday 11:00 America/New_York = 15:00 UTC (plist 08:00; launchd +3h)
    triggers: [clock]
    requires: [no PAUSE file, env:~/.config/crude-tanker-fv.env, external:tesseract on PATH, network:sec.gov resolvable (a host this chain never fetches)]
    reads: [external:Rocket.Chat, inputs/rocketchat_sources.yaml, inputs/research_pareto/**, inputs/research_pareto_other/**, inputs/ffa_drybulk/**,
            inputs/market_data/transactions/_scan_state.json, state/ffa_ocr_state.json]
    writes: [state/rocketchat_ingest.json, state/arrivals.jsonl, inputs/research_pareto/**/*.pdf, inputs/research_pareto/**/_quarantine/*.reason,
             inputs/ffa_drybulk/**, inputs/research_pareto/_manifest.json, inputs/market_data/transactions/_scan_state.json,
             outputs/sp_print_candidates.md, outputs/ffa_ocr_queue.md, state/ffa_ocr_state.json, state/ffa_ocr_curves.json, state/ffa_scratch/**,
             state/news_pull.log, state/news_pull.err, state/heartbeat/news-pull, state/automation_runs.log]
    commits: commit-drift
    notes: "misnamed: the SCANNER chain (RC incremental -> pareto manifest [full rebuild, also walks research_pareto_other] -> sp_scan -> ffa_ocr -> ffa_ocr --staleness) — the Saturday twin of rocketchat-ingest, same writes, same _quarantine/*.reason write (gitignored 2026-09-13); the news DIGEST is written by the scheduled task weekly-news-pull"

  - id: harvester
    kind: launchd
    repo: crude-tanker-fv
    plist: com.crude-tanker-fv.harvester
    entry: scripts/harvester_cron.sh
    runs: Saturday 12:00 America/New_York = 16:00 UTC (plist 09:00; launchd +3h)
    triggers: [clock]
    requires: [venv:.venv310, no PAUSE file, network:www.hellenicshippingnews.com resolvable]
    reads: [external:broker archive sites, shipping_harvester/**]
    writes: [shipping_harvester/data/**, state/harvester_cron.log, state/harvester_cron.err, state/heartbeat/harvester, state/automation_runs.log]
    commits: none
    notes: "the vendored shipping_harvester on .venv310, run from cwd shipping_harvester/ (DATA_ROOT is cwd-relative); its data dir is gitignored; it never calls sp_scan — the scanner paths belong to rocketchat-ingest / news-pull"

  - id: sentinel
    kind: launchd
    repo: crude-tanker-fv
    plist: com.crude-tanker-fv.sentinel
    entry: scripts/sentinel_cron.sh
    runs: "11:15 America/New_York = 15:15 UTC (plist 08:15; launchd +3h — state/sentinel_cron.log '=== [sentinel] 2026-09-12 11:15:05'); the five lanes inherit this"
    triggers: [clock]
    requires: [no PAUSE file at repo root, "env:~/.config/crude-tanker-fv.env (optional: absent -> NOTIFY-UNCONFIGURED, ping skipped)"]
    reads: []
    writes: [state/sentinel_cron.log, state/sentinel_cron.err, state/heartbeat/sentinel, state/automation_runs.log]
    commits: none
    notes: "the wrapper; its work is the five lanes below, in this order: sentinel-checks -> weekly-report -> commit-outputs -> auto-land -> auto-push. PAUSE skips ALL five before the sentinel runs — a paused sentinel never pings, so healthchecks alerts after grace"

  # ---------------------------------------------------------------- lanes inside the sentinel wrapper
  - id: sentinel-checks
    kind: lane
    repo: crude-tanker-fv
    entry: src/crude_tanker_fv/sentinel.py
    runs: every sentinel run
    triggers: [sentinel]
    requires: [tree drift-only]
    reads: [inputs/**, outputs/**, state/**, inputs/notify.yaml, inputs/forks.yaml, inputs/reweight_triggers.yaml, inputs/earnings_calendar.yaml,
            inputs/agent_duties.yaml, inputs/rocketchat_sources.yaml, state/edgar_manifest.jsonl, state/filings_triaged.json, state/drill_armed,
            state/heartbeat/*, state/reauth/*.json, scripts/drift_files.txt, scripts/com.crude-tanker-fv.*.plist,
            shipping_harvester/data/manifest.jsonl, governance:monitor/log.md]
    writes: [state/sentinel_state.json, state/sentinel.log, state/ping_status.json, state/notify_sent.log, state/notify_down.log, state/reauth/*.json]
    emits: ["email digest (daily, unconditional)", "email PAGE (owner-action tags; FETCH-FAILED promoted to PAGE inside an earnings window)",
            "email PAGE (escalated) on page_after_consecutive streaks",
            "healthchecks ping (withheld while state/drill_armed exists or a required send failed; skipped when CRUDE_FV_HEALTHCHECK_URL is unset)"]
    commits: none
    notes: "META-MODE on non-drift dirt: reports the dirty tree instead of the checks; page-once keys live INSIDE state/sentinel_state.json; check 6 (liveness) reads state/heartbeat/<job> per committed plist; governance:monitor/log.md is followed via inputs/agent_duties.yaml artifact_path"

  - id: weekly-report
    kind: lane
    repo: crude-tanker-fv
    entry: src/crude_tanker_fv/weekly_report.py
    runs: every sentinel run; writes only when a Saturday report is owed (is_due)
    triggers: [sentinel-checks]
    reads: [outputs/**, inputs/**, state/**, outputs/book_scorecard.json, outputs/book_scorecard.md, inputs/reweight_triggers.yaml, inputs/earnings_calendar.yaml,
            baselines/reconcile_baseline.yaml, decisions/*_log.md, decisions/*_shadow_build_*.md, RATIFY_LOG.md, scripts/drift_files.txt,
            scripts/com.crude-tanker-fv.*.plist, shipping_harvester/data/manifest.jsonl, governance:monitor/log.md]
    writes: [outputs/weekly_report_*.md, state/notify_sent.log, state/notify_down.log, state/reauth/smtp.json]
    emits: [email WEEKLY]
    commits: commit-outputs
    notes: "inherits sentinel-checks' whole read set via sentinel.collect_flags() and auto-land's via promote.evaluate_price_absorb() (baseline, last_run.json, decision logs); a failed --send returns rc 1 which rides the cron note"

  - id: commit-outputs
    kind: lane
    repo: crude-tanker-fv
    entry: scripts/sentinel_cron.sh
    runs: every sentinel run, after weekly-report
    triggers: [weekly-report]
    reads: [outputs/weekly_report_*.md, outputs/news_digest_*.md]
    writes: []
    commits: self
    commit_subject_prefix: "outputs: weekly report / news digest"
    notes: "added 2026-09-12 after the Saturday freeze; commits the run's own tracked products so auto-land sees a drift-only tree"

  - id: price-leg
    kind: lane
    repo: crude-tanker-fv
    entry: scripts/sentinel_cron.sh
    runs: every sentinel run, after commit-outputs and BEFORE auto-land
    triggers: [commit-outputs]
    requires: [venv, a book quarter in state/last_run.json]
    reads: [inputs/market_data/prices_daily.yaml, scripts/drift_files.txt, scripts/regen.sh,
            outputs/book_scorecard.json, state/last_run.json, baselines/reconcile_baseline.yaml]
    writes: [inputs/market_data/prices_daily.yaml, outputs/**, decisions/*_log.md, state/regen.out,
             state/annotate.out, state/commit_drift.out, state/regen_hygiene.out, state/last_run.json]
    commits: self
    commit_subject_prefix: ["Price vintage", "Regen (price leg) —"]
    on_failure: "rc rides the cron note; a surface whose stamp != HEAD or whose hygiene guard is RED is left UNCOMMITTED and dirty, never reverted (no-unilateral-revert)"
    notes: "added 2026-09-15 — the nightly price refresh wrote a determinant and NOTHING regenerated behind it, so auto-land's (e) could never pass and the anchor sat frozen 9/12-9/15. Order is load-bearing: price vintage committed ALONE (price-basis rule) -> residual drift via commit-drift -> regen only when a determinant actually moved -> annotate the pure-price rows -> commit the surface + logs. A 900s watchdog is this lane's dead-man because the healthchecks ping already fired in the sentinel lane above."

  - id: annotate
    kind: script
    repo: crude-tanker-fv
    entry: src/crude_tanker_fv/annotate.py
    runs: inside the price-leg lane (or on demand from a chat)
    triggers: [price-leg, human-owner-chat]
    reads: [baselines/reconcile_baseline.yaml, state/last_run.json, outputs/book_scorecard.json,
            inputs/market_data/prices_daily.yaml, decisions/*_log.md]
    writes: [decisions/*_log.md]
    commits: price-leg
    notes: "deterministic price attribution ONLY: it may say the tape moved and the valuation did not, and refuses everything else with the reason named — a fair-value move, a flip toward BUY (that is the buyflip fork's), a NAV or re-read breach, a changed price basis, a determinant other than the price vintage moving, or a cent-rounding budget too coarse to tell a tape move from a curve move. A refusal leaves the row UNEXPLAINED and freezes auto-land on (a), which is the design working. tests/test_annotate.py"

  - id: auto-land
    kind: lane
    repo: crude-tanker-fv
    entry: src/crude_tanker_fv/promote.py
    runs: every sentinel run, after the price-leg lane
    triggers: [price-leg]
    requires: [tree drift-only, state/last_run.json < 24h, 0 UNEXPLAINED, every moved row annotated since ratified_at, no flip toward BUY, committed surface current for HEAD]
    reads: [baselines/reconcile_baseline.yaml, decisions/*_log.md, outputs/book_scorecard.json, state/last_run.json, scripts/drift_files.txt, PLAN.md]
    writes: [baselines/reconcile_baseline.yaml, RATIFY_LOG.md]
    commits: self
    commit_subject_prefix: "baseline: auto-land"
    on_failure: "FREEZE rc 1 rides the cron note; NOTHING TO LAND rc 0 on a quiet gate"
    notes: "(e) also freezes on any COMMIT touching src/** or inputs/** (archive dirs excluded) between the surface stamp and HEAD — a history read, not a working-tree read; lands via scripts/ratify_baseline.sh, which greps PLAN.md for a stale pending-marker"

  - id: auto-push
    kind: lane
    repo: crude-tanker-fv
    entry: scripts/auto_push.sh
    runs: every sentinel run, last
    triggers: [auto-land]
    requires: [tree drift-only, drift gate 0 UNEXPLAINED, unpushed commits exist (an absent origin/main ref reads as nothing to push), network + keychain for git push]
    reads: [scripts/drift_files.txt, baselines/reconcile_baseline.yaml, state/last_run.json, decisions/*_log.md]
    writes: []
    emits: [git push origin main]
    commits: none
    notes: "the 0 UNEXPLAINED hold runs drift_gate, so the baseline, last_run.json and the decision logs are reads"

  - id: commit-drift
    kind: script
    repo: crude-tanker-fv
    entry: scripts/commit_drift.sh
    runs: on demand from a chat (drift-list files are routine dirt; nothing schedules this)
    triggers: [human-owner-chat]
    reads: [scripts/drift_files.txt, state/edgar_manifest.jsonl]
    writes: [inputs/filings/_manifest.json]
    commits: self
    commit_subject_prefix: "chore(automation): flush data/output drift"
    notes: "promotes state/edgar_manifest.jsonl to the tracked inputs/filings/_manifest.json, then stages exactly the drift list; the price vintage is otherwise absorbed by a chat commit before a regen (CLAUDE.md price-basis rule)"

  - id: regen
    kind: script
    repo: crude-tanker-fv
    entry: scripts/regen.sh
    runs: on demand from a chat, after any determinant change
    triggers: [human-owner-chat]
    requires: ["src/ and inputs/ clean of modified+untracked paths — drift-list paths under inputs/ INCLUDED (regen.sh:16; commit the price vintage via commit-drift first, CLAUDE.md price-basis rule); dirt outside src/ and inputs/ is ignored"]
    reads: [inputs/**, src/**, scripts/*_weight_*.py, tests/test_outputs_hygiene.py]
    writes: [outputs/**, decisions/*_log.md, state/last_run.json, state/read_flag_state.json]
    commits: human-owner-chat
    notes: "sidecars if scenario_inputs.yaml is newer than the family sidecar -> pipeline -> hygiene guard; the chat commits the surface; outputs/refresh_checklist.md is NOT written here (see preflight)"

  - id: preflight
    kind: script
    repo: crude-tanker-fv
    entry: src/crude_tanker_fv/refresh.py
    runs: on demand from a chat (the report-day preflight), and as step 1 of crude-fv-results-shadow-build
    triggers: [human-owner-chat, crude-fv-results-shadow-build]
    reads: [inputs/watchlist.yaml, inputs/market_data/**, inputs/earnings_calendar.yaml, inputs/reweight_triggers.yaml, inputs/data_sources.yaml,
            inputs/balance_sheets/*.yaml, inputs/fleet_manifests/*.yaml]
    writes: [outputs/refresh_checklist.md]
    commits: commit-drift
    notes: "python -m crude_tanker_fv.refresh — the ONLY writer of the drift-list path outputs/refresh_checklist.md (the pipeline never writes it); absorbed by commit-drift"

  # ---------------------------------------------------------------- scheduled agent tasks (desktop app open)
  - id: crude-fv-filings-triage
    kind: scheduled-task
    repo: crude-tanker-fv
    runs: daily 11:45 (app display zone)
    triggers: [clock]
    requires: [app open]
    reads: [state/edgar_manifest.jsonl, state/filings_triaged.json, inputs/filings/**, decisions/filings_triage_log.md, CLAUDE.md, WORKFLOWS.md, external:EDGAR/MFN/NewsWeb]
    writes: [decisions/filings_triage_log.md, PLAN.md, decisions/*_log.md, state/filings_triaged.json]
    commits: self
    commit_subject_prefix: "filings triage"
    emits: [report in the app; OWNER ACTION NEEDED line only for an `owner` disposition]

  - id: crude-fv-results-shadow-build
    kind: scheduled-task
    repo: crude-tanker-fv
    runs: daily 12:15 (app display zone)
    triggers: [clock]
    requires: [app open, git worktree of HEAD in /tmp (transient), external:issuer/EDGAR web, no concurrent committing task]
    reads: [inputs/earnings_calendar.yaml, inputs/watchlist.yaml, inputs/market_data/**, state/edgar_manifest.jsonl, decisions/filings_triage_log.md,
            inputs/filings/**, inputs/research_issuer/**, inputs/balance_sheets/*.yaml, inputs/balance_sheets/*.yaml.draft,
            inputs/fleet_manifests/*.yaml, inputs/fleet_manifests/*.yaml.draft, decisions/*_packet_*.md, decisions/*_release_check_*.md,
            decisions/*_prereg_*.md, outputs/book_scorecard.json, CLAUDE.md, WORKFLOWS.md]
    writes: [inputs/balance_sheets/*.yaml.draft, inputs/fleet_manifests/*.yaml.draft, decisions/*_shadow_build_*.md, PLAN.md, outputs/refresh_checklist.md]
    commits: self
    commit_subject_prefix: "shadow build"
    notes: "values the drafts in a throwaway worktree of HEAD via scripts/shadow_regen.sh — against HEAD's COMMITTED inputs (an unabsorbed price vintage is not in the shadow); never the live pair (CLAUDE.md drafts-only rule). outputs/refresh_checklist.md is a drift-list path regenerated by step 1's refresh call (absorbed by commit-drift, never by this task's commit). On app-open catch-up it runs concurrently with filings-triage, which also commits (9/12: 14:07:54 vs 14:07:57)"

  - id: crude-fv-mb-weekly-harvest
    kind: scheduled-task
    repo: crude-tanker-fv
    runs: Saturday 08:30 (app display zone)
    triggers: [clock]
    requires: [app open, external:Gmail connector, external:cdn.flxml.eu (https; allowlisted via data_sources.yaml)]
    reads: [external:Gmail (from:mbshipbrokers.com), inputs/research_mb/**/*.pdf, inputs/data_sources.yaml, inputs/**, outputs/**, state/**]
    writes: [inputs/research_mb/**/*.pdf]
    commits: none
    notes: "PDFs ignored only by the blanket *.pdf rule (.gitignore:28); no research_mb manifest exists; mb_harvest.py copies only %PDF-validated bytes so nothing trackable can land. Clears the sentinel's STALE-INPUT mb:* flags — but step 5 runs the sentinel bare (read-only), and on a non-drift-dirty tree it reports META-MODE, not the mb flags"

  - id: crude-fv-weekly-news-pull
    kind: scheduled-task
    repo: crude-tanker-fv
    runs: Saturday 09:00 (app display zone)
    triggers: [clock]
    requires: [app open BEFORE the 11:15 EDT sentinel (a later app-open catch-up fire leaves the digest as non-drift dirt until the next sentinel)]
    reads: [inputs/watchlist.yaml, inputs/archive_gaps.yaml, inputs/data_sources.yaml, src/crude_tanker_fv/reconcile.py, decisions/*_log.md,
            state/edgar_manifest.jsonl, inputs/filings/**, inputs/research_pareto/**, outputs/news_digest_*.md, external:issuer feeds + trade press]
    writes: [outputs/news_digest_*.md]
    commits: commit-outputs
    notes: "its ONLY write is the dated digest; commit-outputs commits it at the NEXT sentinel run (15:15Z / 11:15 EDT) — a late fire leaves it ~21h as non-drift dirt (9/12: written 14:11, hand-committed 14:14, 1e9d758). Fires 09:00 EDT, BEFORE the launchd scanner chain (15:00Z / 11:00 EDT), so the research_pareto manifest it reads is last week's — move the task to >=11:30 EDT or accept"

  - id: crude-fv-pinggap-drill-arm
    kind: scheduled-task
    repo: crude-tanker-fv
    one_shot: true
    runs: one-shot 2026-09-12 09:05 (fired 14:07 EDT)
    triggers: [clock]
    requires: [app open, same-day SENT ping in state/ping_status.json, same-day job=sentinel line in state/automation_runs.log]
    reads: [state/ping_status.json, state/automation_runs.log, decisions/healthchecks_pinggap_drill_2026-09-06.md]
    writes: [state/drill_armed, decisions/healthchecks_pinggap_drill_2026-09-06.md]
    commits: human-owner-chat
    notes: "wrote its doc line without committing (committed by hand 9/12); the restore task commits its own"

  - id: crude-fv-pinggap-drill-restore
    kind: scheduled-task
    repo: crude-tanker-fv
    one_shot: true
    runs: one-shot 2026-09-14 18:45 (moved from 15:20 — the page is due ~17:15)
    triggers: [clock]
    requires: [app open, external:Gmail connector]
    reads: [external:Gmail (from:healthchecks.io), state/ping_status.json, state/automation_runs.log, decisions/healthchecks_pinggap_drill_2026-09-06.md]
    writes: [decisions/healthchecks_pinggap_drill_2026-09-06.md, state/drill_armed]
    commits: self
    commit_subject_prefix: "drill:"
    notes: "state/drill_armed is REMOVED (rm, allowlisted) — the write that un-withholds the ping; the drill doc is a read-modify-write (fills '## Drill log' and the 'Page received (actual)' blank)"

  - id: crude-fv-fork-executor
    kind: scheduled-task
    repo: crude-tanker-fv
    runs: daily 12:45 app-display-zone (fires 12:47; installed by the owner 2026-09-14)
    triggers: [clock]
    requires: [app open, tree drift-only]
    reads: [inputs/forks.yaml, decisions/**, inputs/**, outputs/book_scorecard.json, baselines/reconcile_baseline.yaml,
            state/ffa_ocr_curves.json, scripts/drift_files.txt]
    writes: [inputs/**, decisions/*_log.md, PLAN.md, outputs/**, state/fork_page.md, state/last_run.json]
    emits: [email PAGE on a halted fork (band miss / test red / unsettled source)]
    commits: self
    commit_subject_prefix: "fork-exec"
    notes: "silence executes the recommendation (policy 2026-09-10) — until this exists the executing agent is a chat; bounded authority: exact edits per the fork's doc, regen.sh, full suite, gate, predicted-band check, annotate, commit; never ratifies (the morning auto-land does, from the annotations)"

  - id: ffa-promote
    kind: script
    repo: crude-tanker-fv
    entry: src/crude_tanker_fv/ffa_promote.py
    runs: on demand (the fork executor's step 0, or a chat)
    triggers: [crude-fv-fork-executor, human-owner-chat]
    reads: [state/ffa_ocr_curves.json, inputs/market_data/ffa_forward_curve.yaml, inputs/market_data/twelve_month_tc.yaml,
            inputs/market_data/historical_tce_means.yaml]
    writes: [inputs/market_data/ffa_forward_curve.yaml, inputs/market_data/twelve_month_tc.yaml, decisions/ffa_promotion_*.md]
    commits: crude-fv-fork-executor
    notes: "the ruled straddling construction ONLY (owner 2026-09-02 Q-1/Q-2/Q-3/Q-7); FREEZES on a flagged parse, an unruled panel shape, a stale or already-committed print, or a cycle-BAND crossing; Handy-Bulk's 12M rides the MB weekly and is never touched; allow-tier since the 2026-09-13 permission change; tests/test_ffa_promote.py pins it against the ratified 2026-09-01 promote"

  - id: rebase
    kind: script
    repo: crude-tanker-fv
    entry: src/crude_tanker_fv/rebase.py
    runs: on demand (a fork execution, a report-day refresh, or a chat)
    triggers: [crude-fv-fork-executor, human-owner-chat]
    reads: [inputs/watchlist.yaml, inputs/market_data/prices_daily.yaml]
    writes: [inputs/watchlist.yaml, inputs/watchlist_rebase_*.yaml.draft]
    commits: crude-fv-fork-executor
    notes: "anchor-preserving pair rebase (implied broker NAV + EPS basis carried; price / pnav / fwd_pe from ONE vintage; textual edit, comments kept); allow-tier since the owner's 2026-09-13 permission change; tests/test_rebase.py"

  # ---------------------------------------------------------------- the governor (sibling repo)
  - id: portfolio-weekly-monitor
    kind: scheduled-task
    repo: portfolio-governance
    runs: Friday 17:00 (app display zone)
    triggers: [clock]
    requires: [app open, external:IBKR connector, external:web search, "env:~/.config/portfolio-governance.env (ping URL; unset = PING-SKIPPED)",
               "env:~/.config/crude-tanker-fv.env + producer .venv (notify.sh execs crude_tanker_fv.notify from the producer repo)"]
    reads: [outputs/book_scorecard.json, RATIFY_LOG.md, external:IBKR account, external:web search, governance:CADENCE.md, governance:holdings/*.md,
            governance:funnels/register.md, governance:reviews/*.md]
    writes: [governance:monitor/log.md, governance:monitor/outbox/*-monitor.md]
    emits: [email PAGE or digest via governance:monitor/notify.sh, healthchecks ping via governance:monitor/ping.sh]
    commits: self
    notes: "commits its own run line + outbox file since 2026-09-13 (git -C allowlisted); pages PRODUCER DID NOT LAND when the scorecard is older than 72h; the seam: reads the producer's committed scorecard (schema major 2) and flags a tier/label/FV change on a holding; its only owner-facing channel is the producer's interpreter + SMTP creds — a broken producer venv or env turns every governor page into MAIL:FAILED"

  - id: portfolio-quarterly-review-kickoff
    kind: scheduled-task
    repo: portfolio-governance
    runs: 26th of Mar/Jun/Sep/Dec 09:00 (app display zone)
    triggers: [clock]
    requires: [app open, external:IBKR connector, external:web search, "env:~/.config/crude-tanker-fv.env + producer .venv (notify.sh)"]
    reads: [external:IBKR account, external:web search, governance:CADENCE.md, governance:HOLDING_THESIS.md, governance:holdings/*.md, governance:reviews/*.md]
    writes: [governance:monitor/outbox/*-quarterly-kickoff.md]
    emits: [email PAGE with the review pack]
    commits: self
    notes: "commits its outbox file since 2026-09-13 (git -C allowlisted); recommends a fresh FV pull for crude-tanker-fv-governed names but does not read the scorecard itself"

  # ---------------------------------------------------------------- human + external nodes
  - id: human-owner-chat
    kind: human
    repo: both
    runs: when a page names an action, or at will
    triggers: [email PAGE, email WEEKLY, healthchecks alert, email GitHub issue 'sentinel' (sentinel-lite)]
    reads: [external:inbox]
    writes: [inputs/**, inputs/watchlist.yaml, inputs/market_data/transactions/**, inputs/market_data/ffa_forward_curve.yaml, inputs/forks.yaml,
             .claude/settings.json, decisions/*_log.md, PLAN.md, PAUSE,
             governance:holdings/*.md, governance:reviews/*.md, governance:CADENCE.md, governance:funnels/register.md, governance:preregs/*.md,
             governance:orders/*.md, governance:monitor/log.md]
    commits: self
    notes: "exclusive-writer set = the three ask-tier files + the permission file; the rest are the owner's sitting writes (decision-log annotation is auto-land's unfreeze; card stamps are the seam's other half). PAUSE at repo root silences all six launchd jobs at once — including the sentinel's heartbeat/digest/ping, so healthchecks alerts after grace. A chat inside the repo for the work, never in ~/Projects"

  - id: human-ratify
    kind: human
    repo: crude-tanker-fv
    entry: scripts/ratify_baseline.sh
    runs: owner-run, on an explained move auto-land cannot take (a flip toward BUY, an unannotated row)
    triggers: [human-owner-chat]
    requires: [state/last_run.json from the run being ratified (drift_gate exits 2 if absent; a stale one ratifies stale numbers)]
    reads: [state/last_run.json, PLAN.md]
    writes: [baselines/reconcile_baseline.yaml, RATIFY_LOG.md]
    commits: self
    notes: "drift_gate --ratify overwrites the baseline from state/last_run.json without reading the old one"

  - id: sentinel-lite
    kind: external
    repo: crude-tanker-fv
    entry: .github/workflows/sentinel-lite.yml
    runs: daily 12:45 UTC (GitHub Actions, against pushed main)
    triggers: [clock]
    requires: [external:GitHub Actions, secret SENTINEL_LITE_HC_URL (unset 2026-09-12 = ping skipped)]
    reads: [inputs/**, outputs/**, inputs/filings/_manifest.json]
    writes: []
    emits: [GitHub issue 'sentinel' (owner email via GitHub notifications), healthchecks ping (own check)]
    commits: none
    notes: "runs sentinel --pure on the pushed tree — state/ is gitignored, so its FILING checks see the commit-drift-promoted manifest only; coverage lags to the last push"

  - id: healthchecks
    kind: external
    repo: both
    runs: "dead-man timer (producer: period 1d + grace 30h, 7/13 record; governor: spec cron 0 17 * * 5 America/New_York + grace ~6h per analysis/2026-08-09 postmortem — dashboard state UNRECORDED; last governor ping 9/11 WITHHELD, ping.sh midnight-straddle)"
    triggers: [sentinel-checks, portfolio-weekly-monitor, sentinel-lite]
    reads: [external:ping]
    writes: []
    emits: [email alert by ABSENCE of the ping]
    commits: none
