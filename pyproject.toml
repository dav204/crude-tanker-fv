[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crude-tanker-fv"
version = "0.1.0"
description = "Independent fair value estimator for crude tanker equities (NAV + dividend-strip blend)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
# The REAL dependency surface (audit N-1, 2026-07-14): the engine is deliberately
# pandas-free (stdlib + yaml is why it clean-clones onto any stack). pypdf = filing/
# PDF paths; pillow = ffa_ocr; requests = rocketchat_api. CI installs `-e .[dev]`
# so this list and the CI environment can never diverge again (single source).
dependencies = [
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # PINNED 2026-08-11: an unpinned ruff let CI's version drift ahead of local —
    # new defaults exploded 8 real violations into 461 phantom ones and CI sat RED
    # for 10+ runs unnoticed. "Hold the line" requires the ruler not to move; bump
    # this pin DELIBERATELY (fix new findings in the same commit).
    "ruff==0.15.21",
]

[project.scripts]
crude-tanker-fv = "crude_tanker_fv.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# audit N-6 (2026-07-14): the 37 auto-fixable violations were fixed; the 20 legacy
# remainders (9 E741 ambiguous names, 7 E701/E702 one-liners, 4 F841 unused vars —
# all cosmetic, in working valuation code) are accepted-as-is rather than churned.
# CI now runs `ruff check` so NEW violations cannot accumulate; delete an ignore
# here when its class is cleaned up.
ignore = ["E741", "E701", "E702", "F841"]

# 2026-08-11: the family-diagnostic scripts bootstrap BOOK_QUARTER (and sys.path)
# BEFORE importing the package — that order is the point (the 8/08 quarter-roll
# conversion). E402 is structural there, not sloppiness.
[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
