# Earnings calendar — next-report dates per watchlist ticker.
# Read by the refresh preflight (refresh.check_earnings_calendar): flags names
# whose report is OUT but whose target-quarter balance sheet is missing, and
# names reporting within the next 14 days.
#
# Maintained by hand; the weekly /news-pull digest flags newly-announced dates
# (US issuers typically announce 1-3 weeks ahead). status: confirmed = company
# financial calendar or dated announcement; expected = cadence-derived window
# (Q1-2026 + Q2-2025 reporting dates). Swept + verified 2026-06-11.
#
# Notable cadence facts: TEN reports Q2 in SEPTEMBER (H1 reporter), not
# August. FLNG's calendar slot is Aug-28 but the 2025 release came a week
# early (Aug-20) — expect the announced date to move up. FRO/NAT/TRMD/HAFN
# are late-August reporters; the early cluster is Jul-28 → Aug-6.

