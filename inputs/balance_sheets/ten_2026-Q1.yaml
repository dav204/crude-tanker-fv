lease_liabilities: 0

# Newbuild orderbook (19 vessels per data kit, contract value $2,403M total):
#   - Advances paid through Q1 2026: ~$400M (Dec 2025 20-F $301.9M + Q1 net
#     drawdowns; estimate between 20-F $301.9M and data kit May $430M).
#   - All 19 NBs treated as **delivered-value = contract-price** (DP2 shuttle
#     per METHODOLOGY §11.6 — no observable resale market; conventional
#     non-shuttle NBs per the conservative read of §3.1 in the current rate
#     environment — no material hot-market markup vs Korean/Chinese yard
#     contract prices). Net NAV from NB program = advances paid only.
# Convention: `newbuild_capex_commitments` is set to 0 (the remaining future
# obligation will buy delivered vessels of equal value; net NAV impact zero
# vs holding the advances at cost). `newbuild_advances_paid` carries the full
# paid-to-date balance as a positive NAV asset. Equivalent to the FRO-style
# "list NBs in fleet at delivered value, subtract remaining commitment"
# convention when delivered = contract, but simpler since we don't need to
# track NB vessels in the fleet manifest (and no Shuttle vessel class exists
# to put them on a curve).
newbuild_capex_commitments: 0
newbuild_advances_paid: 400000000

