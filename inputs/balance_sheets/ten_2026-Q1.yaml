#     = $136,503K
#   minus current other liabilities (payables $42,676 + related $3,170 +
#     dividends payable $15,064 + accrued $68,117 + unearned $17,273 +
#     financial instruments $1,987) = $148,287K
#   plus non-current other assets (LT investments $25,233 + deferred charges
