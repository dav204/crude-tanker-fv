# §15 governance: DECLINE the haircut (governance_discount_pct = 0), carry with the
# related-party fee load as the headline tripwire. SB is Hajioannou-controlled (~47.5%
# via Vorini Holdings; sole voting power) and the three Managers (Safety Management
# Overseas / Safe Bulkers Management / Monaco) are family-controlled — €950/day per
# vessel + €5.0M/yr Monaco fee ≈ $22M/yr ≈ ~1.5% of GAV ($1,420M). That fee load is the
# HIGHEST of the declined §15 names (vs CMBT ~0.2%, GSL), but it is ~market-rate full
# ship-management (not an external-manager promote / incentive-on-NAV), dividends are
# pari-passu (common + preferred paid pro-rata), and SB's discount-to-NAV is sector-wide
# (all dry-bulk names trade <1x), not governance-specific extraction. Held un-haircut for
# v1 consistency with the other 3 dry-bulk validators (SBLK/GNK/CMDB, all un-haircut).
# Tripwires (any one re-opens the haircut): the €950/day fee rising or moving off a
# market basis; above-market related-party vessel drop-downs without independent fairness;
# common-dividend suspension while the family is paid; control crossing to a structural
# squeeze-out. Full screen in decisions/sb_log.md.
governance_discount_pct: 0.0
