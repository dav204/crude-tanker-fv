# working_capital_net = operating-WC FLOOR + the TORM stake (§11.5). Two components:
#
#   1. OPERATING working capital — POOL-GROSS-UP-PENDING conservative FLOOR. The balance-sheet-literal
#      operating WC is $335.9M (receivables 670,185 + inventories 85,684 − payables 419,987), BUT Hafnia
#      runs the world's largest product-tanker POOL, so the $670M receivables carry custodial pass-through
#      gross-up (revenue collected on behalf of OTHER pool owners — not a NAV-economic asset). The 6-K does
#      NOT break out pool vs own-account receivables/payables, so a clean net is not computable. Per the
#      owner (2026-07-01): reject the gross $335.9M; book the conservative floor ≈ the clean own-account
#      INVENTORY 85,684 (pool-grossed receivables/payables netted to ~0). [ESTIMATE] floor ~$85.7M —
#      pool-gross-up-pending; resolves if a filing discloses the pool net. This keeps HAFN PROVISIONAL on WC.
#
#   2. TORM 13.97% stake at $277.2M — Hafnia's OWN lower-of-market-or-cost NAV basis (Q1-2026 6-K press
#      release: NAV computed using "the lower of the market value or purchase price of the Torm investment").
#      NOT $395.0M market / $408.5M IFRS fair value — the issuer's own NAV-method basis preserves comparability
#      to Hafnia's $8.09 NAV/sh (a marketable equity stake in NAV takes the issuer's disclosed method, not
#      fair value). Derived: market $395.0M − Q1 unrealized FV gain $117.8M. Level-3 non-TORM ($13.55M) excluded.
#
#   Total working_capital_net = 85.684 + 277.2 = 362.884 ($m).
working_capital_net: 362884000

