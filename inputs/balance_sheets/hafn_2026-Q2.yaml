# working_capital_net = operating-WC FLOOR + TORM stake − 50% JV external debt (§11.5).
#
#   1. OPERATING WC — POOL-GROSS-UP-PENDING conservative FLOOR (unchanged convention;
#      the Q2 filing AGAIN discloses no pool vs own-account receivables split).
#      BS-literal operating WC = receivables 607,246 + inventories 109,754 − payables
#      410,051 = 306,949 — REJECTED for the custodial gross-up (owner 2026-07-01);
#      floor = own-account INVENTORY 109,754. [ESTIMATE] floor — pool-gross-up-pending.
#
#   2. TORM 13.97% stake at $277.2M — the issuer's lower-of-market-or-purchase-price
#      NAV basis, HELD BY DERIVATION: Q2 prints the method (net-LTV definition) but no
#      figure; market $369.0M at 6/30 (Level-1 369,272), no H1 purchases (CF disposals
#      105 only) → lower-of = the Q1-derived purchase price ≈ $277.2M stands.
#
#   3. JV EXTERNAL DEBT, 50% share = −197,750. NEW LEG (2026-08-31 refresh): the Q2
#      fleet correction puts the 16 JV hulls on-curve at 50% hull-equivalents (see
#      the manifest — the Q1 cohort manifest had carried them at 100% with NO JV
#      debt, contradicted by the Q2 footnotes), so the JV's external facilities net
#      against them: Note 7 per-facility table, Vista 4 facilities $239.1M + Ecomar
#      4 French tax leases $156.4M = $395.5M at 100% → 50% = $197.75M. Shareholder
#      loans cancel algebraically (both partners lend pro-rata: Hafnia's receivable
#      = its share of the JV's shareholder-loan liability), so the group's JV claim
#      = 50% x (hulls at curve − external debt) — this construction. H&A carries
#      zero facilities at 6/30 (both repaid/terminated 30-Jun).
#
#   Total working_capital_net = 109.754 + 277.200 − 197.750 = 189.204 ($M).
working_capital_net: 189204000

