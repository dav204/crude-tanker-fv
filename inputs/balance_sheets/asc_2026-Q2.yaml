# working_capital_net = OPERATING working capital + the OFF-CURVE chemical-Handy sleeve (§11.5).
#
#   1. OPERATING working capital (ex-cash, ex-debt, ex-operating-lease):
#        Current assets ex-cash = 124,186 − 48,138 = 76,048
#          (= AR 55,028 net of $1.3M allowance + Prepaid 4,757 + Advances & deposits 2,297
#             + Inventories 13,966)
#        Current liabilities ex-current-lease = 22,796 − 502 = 22,294
#          (= AP 5,519 + Accrued 12,965 + Deferred revenue 3,810)
#        Operating WC = 76,048 − 22,294 = +53,754 ($k).   [Q1: +46,584]
#
#   2. OFF-CURVE CHEMICAL-HANDY sleeve — 4 × 25,217 DWT stainless Fukuoka chemical tankers
#      (Chippewa/Chinook/Cheyenne/Cherokee, 2015; §11.5 gap — no clean 25k-stainless resale
#      curve). Carrying-value floor carried forward from Q1 ($73,100) less one quarter of
#      straight-line depreciation on the same cited basis (cost $29.5M, 25-yr life, ~$3.6M
#      residual ⇒ ~$1.036M/hull/yr × 0.25 × 4 hulls = $1,036) → +72,064 ($k).
#      Basis: carrying-value-floor · §11.5 structural, NOT resale-uniform (unchanged).
#
#   Total working_capital_net = 53,754 + 72,064 = 125,818 ($k).
working_capital_net: 125818000

