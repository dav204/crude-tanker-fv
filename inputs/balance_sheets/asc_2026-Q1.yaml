#
# Figures avoid double-counting against the NAV formula, which adds cash and
# subtracts total_debt/leases SEPARATELY. So working_capital_net below excludes
# cash, the current portion of the operating lease, and held-for-sale.
ticker: ASC
quarter: 2026-Q1

cash_and_equivalents: 47214000        # BS face "Cash and cash equivalents" (2026-03-31)

# working_capital_net = OPERATING working capital + the OFF-CURVE chemical-Handy sleeve (§11.5).
#
#   1. OPERATING working capital (ex-cash, ex-HFS, ex-debt, ex-operating-lease):
#        Current assets ex-cash ex-HFS = 146,185 − 47,214 − 22,944 = 76,027
#          (= AR 52,780 + Prepaid 4,660 + Advances&deposits 5,548 + Inventories 13,039)
#        Current liabilities ex-current-lease = 30,028 − 585 = 29,443
#          (= AP 12,249 + Accrued 15,742 + Deferred revenue 1,452; NO current debt portion)
#        Operating WC = 76,027 − 29,443 = +46,584 ($k).
#      (The 585 current operating-lease is subtracted once, via lease_liabilities below.)
#
#   2. OFF-CURVE CHEMICAL-HANDY sleeve — 4 × 25,217 DWT stainless Fukuoka (Japan) chemical
#      tankers (Chippewa/Chinook/Cheyenne/Cherokee, 2015; §11.5 gap — no clean 25k-stainless
#      resale curve, a 38k product curve would over-value). Marked at CARRYING VALUE as a
#      conservative floor, cited to the 20-F (acc 0001104659-26-024690) "24 of 25 vessels'
#      market values exceeded carrying value" → worth ≥ carrying. Reconstructed from cited
#      inputs: cost $29.5M each (2013 order 6-K, acc 0000919574-13-005339: $118.0M / 4) −
#      straight-line dep (25-yr life, $400/LWT residual ≈ $3.6M; 20-F policy) over ~10.4–11.2
#      yrs since delivery ≈ $18.3M/hull → +73,100 ($k). Base-vessel only (excl capitalized
#      drydock) → conservative. Basis: carrying-value-floor · §11.5 structural, NOT resale-uniform.
#
#   Total working_capital_net = 46,584 + 73,100 = 119,684 ($k).
working_capital_net: 119684000

