# Net interest-bearing debt (NIBD) per Q1 release.
# Gross debt = cash + NIBD = 196 + 893.6 = ~$1,090M.
# Bank vs lease split not separately disclosed in press release; ~$300-400M of
# the gross is estimated IFRS 16 vessel lease liabilities. Tool treats total
# interest-bearing debt as one line. [ESTIMATE — refresh with Q1 PDF detail.]
total_debt: 1089600000

# Lease liabilities: TORM materially REDUCED sale-leaseback exposure in 2025 by
# exercising purchase options on 14 leaseback vessels. Only 2 vessels under SLB
