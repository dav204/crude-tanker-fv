# Torm Plc (TRMD) balance sheet snapshot — METHODOLOGY §4.2, §11.5
# Source: Torm Q1 2026 6-K (filed 2026-05-08); balance sheet as of 2026-03-31. USD.
#
# Figures reconciled to avoid double-counting against the NAV formula
# (which adds cash and subtracts total_debt SEPARATELY). working_capital_net
# excludes cash and excludes the current portion of debt.
ticker: TRMD
quarter: 2026-Q1

# Cash + restricted cash (Q1 2026 press release).
cash_and_equivalents: 196000000

# working_capital_net composition (§11.5):
