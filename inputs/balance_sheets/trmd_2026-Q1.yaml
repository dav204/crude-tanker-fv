#      call, Q1 saw a +$30M WC build (elevated bunker inventory + 45-50 day DSO
#      on March bookings). Management flagged the build as transitory.
#      Normalised operating WC for a ~$300M/quarter revenue shipping company
#      is in the $50-80M range. With the Q1 build, current operating WC is
#      estimated ~$110M.
#      → +110,000 ($k).
#
#      [ESTIMATE — replace with the operating WC line from the Q1 2026 interim
#       report PDF (s202.q4cdn.com/126069760/files/doc_financials/2026/q1/) when
#       available. Could be off by ±$30M.]
