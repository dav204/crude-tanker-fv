#   2. No held-for-sale at 2026-03-31. TORM Maren (2008 LR2) already delivered
#      to buyer in Q1; not on books at quarter end. Sale price not disclosed
#      but ~$30-34M based on May 2025 comparable (would feed §9.9 LR2/Aframax
