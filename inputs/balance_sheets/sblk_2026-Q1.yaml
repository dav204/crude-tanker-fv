# Star Bulk Carriers (NASDAQ:SBLK) balance sheet — METHODOLOGY.md §4.2
# Source: Q1 2026 6-K, Consolidated Statement of Financial Position at
# 2026-03-31 (ex99-1.htm filed 2026-05-20, accession 0000950157-26-000639).
# BS columns presented as Dec 31 2025 | March 31 2026 (right column used).
# All figures in USD.
#
# Reconciliation discipline (per DHT example): working_capital_net EXCLUDES
# cash and EXCLUDES current portion of debt — the NAV formula adds cash and
# subtracts total_debt separately. Lease financing (sale-leaseback / charter-in
# RoU liability) is INCLUDED in total_debt to avoid the ECO-style double-count
# flagged in CLAUDE.md.
ticker: SBLK
quarter: 2026-Q1

cash_and_equivalents: 397042000      # "Cash and cash equivalents"
# Restricted cash 10,775 current + 1,615 non-current = 12,390 ($k). v1 treatment:
# NOT added to cash (restricted; not freely available for NAV-style payout).

# Working capital net (non-cash, non-debt):
# Current assets ex-cash: Trade AR 77,999 + Inventories 62,721 + prepaid 13,620
#   + due-from-managers 2 + due-from-related 34 + derivative-asset 145
#   + other current (incl 1,456 investment in debt security) 31,866 = 186,387
# Current non-debt liabilities: AP 50,233 + due-to-managers 16,394 + due-to-
#   related 2,461 + accrued 46,525 + derivative-liability 2,633 + deferred-
#   revenue 21,563 + other 2,000 = 141,809
# Net working capital = 186,387 - 141,809 = 44,578 ($k)
# Note: operating lease liability current (28,701) is in total_debt below,
# not working capital — charter-in RoU treatment.
working_capital_net: 44578000

# Total interest-bearing debt + lease financing:
# Long-term bank loans current portion 170,674 + non-current (net of unamortized
#   issuance costs of 4,893) 763,776 = 934,450 face + 4,893 unamortized = 939,343
# Lease financing ST 2,731 + LT 9,151 = 11,882 (net of unamortized 10)
# Total = 939,343 + 11,892 = 951,235 ($k) face value
# Using NET-of-issuance-costs values per statement-of-financial-position:
#   170,674 + 763,776 + 2,731 + 9,151 = 946,332 ($k)
total_debt: 946332000

# Operating lease liabilities (charter-in vessels + office). Current 28,701
# + non-current 121,134 = 149,835 ($k). Methodology treatment: subtract from
# NAV like debt. The matching RoU asset of 149,835 is NOT added to NAV —
# those vessels aren't owned and don't appear in fleet_manifests.
lease_liabilities: 149835000

# Newbuilding commitments — 8 × 82,000 dwt Kamsarmax (Qingdao 5 + Hengli 3 hulls).
# §9.6 on-curve delivered-less-commitment (standardized 2026-06-30; the prior version
# booked these fields WITHOUT the on-curve delivered value, leaving SBLK commitment-net
# −$95.6M). The 8 hulls are now on the curve at age-0 delivered PV (see sblk.yaml NB rows);
# this REMAINING commitment is subtracted and advances → 0 (sunk into the on-curve value).
# Q1 6-K Note 6 (exact): "the total aggregate REMAINING contracted price, including scrubber
# installation costs, for the eight vessels under construction was $195,556" ($k) — REMAINING,
# not total (prior comment mislabeled it); deliveries Q2-Q4 2026. See NB pre-reg + sblk_log.
newbuild_capex_commitments: 195556000

# Advances → 0: the $99,999k paid is embedded in the on-curve delivered value (BRUT/§9.6).
newbuild_advances_paid: 0

# Diluted shares outstanding — weighted-average diluted from the Q1 2026
# income statement (METHODOLOGY §4.2 convention). Basic at March 31 =
# 111,530,926; weighted-avg basic = 111,309,335; weighted-avg diluted =
# 117,431,435. Difference (~6.1M) = dilutive stock awards + RSUs.
diluted_shares_outstanding: 117431435

# Preferred shares: none issued or outstanding (Note 10).
preferred_equity: 0

# DP2 shuttle off-curve contracted book (METHODOLOGY §11.6): N/A.
shuttle_contracted_book: 0

# §15 governance / structural-NAV-trap discount: 0.0 — SBLK is a widely-held
# US-listed pure-play with a clear dividend-return policy and no controlled-FPI
# / related-party overhang. Methodology haircut not applicable.
governance_discount_pct: 0.0
