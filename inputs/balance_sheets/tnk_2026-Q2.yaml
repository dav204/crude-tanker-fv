# ("Advances on newbuilding contracts" 33,412) → remaining $156.6M.
# §9.6 on-curve: the 2 NBs are valued on the curve at age-0 delivered-market PV in
# tnk.yaml and advances → 0 (sunk into the on-curve delivered value).
newbuild_capex_commitments: 156600000
newbuild_advances_paid: 0

diluted_shares_outstanding: 34680112    # common shares outstanding at 2026-06-30
