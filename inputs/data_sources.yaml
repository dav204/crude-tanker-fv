# Per-ticker IR data sources for the quarterly refresh workflow
# (METHODOLOGY §8). Consumed by `src/crude_tanker_fv/refresh.py` to populate
# the IR-URL playbook in `outputs/refresh_checklist.md`.
#
# Also carries a small number of NON-TICKER market-data sources under a
# special "_market_data_sources" key (refresh.py ignores it for per-ticker
# checklists; the refresh checklist's market-data section references them).
#
# Schema per ticker:
#   ir_home:           the company's investor-relations landing page
#   press_releases:    archive page where quarterly earnings releases are posted
#   sec_edgar:         SEC EDGAR filer page (6-K / 20-F / 10-Q / 10-K archive).
#                      Where the company is a foreign private issuer (FPI) the
#                      key filing is the 6-K with the quarterly press release
#                      as an exhibit; US issuers (TNK, INSW) file 10-Q.
#   fleet_page:        public fleet list if maintained; otherwise null
#   reporting_pattern: one-line plain-English description of typical Q-end
#                      release timing. Used by refresh.py to phrase the
#                      "have they reported yet?" question.
#   notes:             optional free-text. Useful for non-obvious refresh
#                      quirks (CCEC's NB delivery cadence, FLNG's TC backlog
#                      table page, etc.).

# Non-ticker market-data sources used at refresh time for rate-input
# cross-checks. The refresh checklist references these but the IR-URL
# playbook code path ignores entries whose key starts with "_".
_market_data_sources:
  vie_market_rates_and_trends:
    label: VIE Live Analytics Platform — Market Rates & Trends tab
    url: https://docs.google.com/spreadsheets/d/1gRGAetncvYO_iI_DAxTxO_Exx7z6YS4KOKD4pY3IVMs/edit?gid=1944362638
    auth_required: Google account with VIE research-subscriber access
    cadence: weekly snapshots + per-quarter forward/historical panel; refresh at quarter-end
    fields_available:
      - Weekly rate-level plus W/W M/M Y/Y per class (BDI BDTI BCTI plus per-class breakdown)
      - Per-quarter Live Est rate per class (Q2-26 currently; prior quarters as historical)
      - Vs. 10y Avg delta per class — back-compute VIE-implied long-run means
    feeds:
      - inputs/market_data/spot_tce.yaml (VIE Q2-26 Live Est = QTD spot average)
      - inputs/market_data/twelve_month_tc.yaml (forward-quarter columns)
      - inputs/market_data/historical_tce_means.yaml (back-computed from "Vs 10y Avg")
    diagnostic: outputs/vie_market_rates_xref.md
    notes: |
      Quarter-to-date "Live Est" is what VIE estimates fixtures have averaged
      thus far into the quarter (NOT a forward 12M TC). Treat as a multi-week
      spot proxy. The "Vs. 10y Avg" column is the highest-value cell —
      lets us cross-check our historical_tce_means.yaml directly. Our 10y
      means run +14% to +58% above VIE-implied across classes; LNG +53%
      gap is a deliberate spike-inclusive choice (METHODOLOGY note in
      historical_tce_means.yaml LNGC comment). DO NOT bulk-update without
      explicit methodology decision on which base period / outlier handling
      is preferred per class.
#
# Verification status: URLs marked [VERIFIED] were fetched during data
# collection (ASC and STNG, 2026-06-01). Others use canonical IR-endpoint
# patterns and are likely correct but UNVERIFIED — refresh.py treats them
# as starting points, not authoritative. Update / fix as you encounter
# broken links.

