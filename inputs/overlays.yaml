# Overlay ledger — curated source (METHODOLOGY §16).
#
# One row per ACTIVE qualitative overlay that sits between pipeline FV and
# the actionable view. §15 governance haircuts are NOT listed here — they
# auto-populate into the rendered ledger from balance_sheets/*.yaml
# governance_discount_pct (the YAML that actually drives the pipeline).
#
# direction: up = tool FV understates the actionable view; down = overstates.
# magnitude: a rough number/range when defensible, else "qualitative".
# scope: name-level rows use the ticker; sector-wide rows use the sector key.

