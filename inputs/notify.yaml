# Notification routing (WO2 §3.1, 2026-07-03) — email-only, owner-only.
#
# Secrets NEVER live here: SMTP creds + the recipient are env vars
# (CRUDE_FV_SMTP_HOST / PORT / USER / PASS / TO) in ~/.config/crude-tanker-fv.env
# (chmod 600), sourced by the cron wrappers. Nothing ever posts to Rocket.Chat
# or any group channel — RC stays read-only ingest.
#
# Change-control: every tag lands with a route entry AND a fixture test; an
# UNKNOWN tag routes to PAGE (fail loud, never silent).
subject_prefix: "[crude-fv]"
routes:
  page:            # immediate email
    - TRIGGER-DUE
    - SURFACE-INCOHERENT
    - FILING-LANDED       # AMENDED marker travels in the flag body
    - FILING-OVERDUE
    - DIRTY-TOO-LONG
  digest:          # one daily status email — sent on OK days too (the
                   # unconditional send is what makes notifier death detectable)
    - STALE-INPUT
    - SIDECAR-STALE
    - PRICE-BASIS
    - NOTIFY-UNCONFIGURED
    - UNINGESTED-PRINTS
    - TRIGGER-EVIDENCE
    - CALENDAR-UNSEEDED
    - EARNINGS-DUE
    - STALE-BALANCE-SHEET  # report out, sheet pending — the reconciliation
                           # queue's daily reminder (the LANDED page already fired)
    - FETCH-FAILED        # override below: pages at 2 consecutive; promoted to
                          # PAGE immediately inside an open earnings window
    - FLEET-TRANSACTION   # unreviewed S&P candidates (ack: sp_scan --mark-reviewed)
    - DISK-PRESSURE
    - AGENT-TASK-DUE      # a recurring duty with no plist/heartbeat is overdue
                          # (8c). Escalates like any digest tag — the nag IS the
                          # interim control until the duty gets scheduled.
    - ARCHIVE-GAP         # a hole BEHIND the feed head (8b). Digest, not page:
                          # it is historical, not an outage — but it does not
                          # self-heal, so the escalation is what forces the
                          # backfill-or-accept decision.
  record_only:     # state log only, never mailed (delivery failure can't
                   # page through the channel that failed — the healthchecks
                   # ping-withhold is its pager)
    - NOTIFY-DOWN
escalate_after: 3  # a DIGEST tag present N consecutive runs pages ONCE (0.3)
escalate_after_overrides:
  FETCH-FAILED: 2  # a fetch layer down two days running is already an incident
