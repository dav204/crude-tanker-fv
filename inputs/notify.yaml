# Notification routing (WO2 §3.1, 2026-07-03; re-cut 2026-09-02 Stage 0) — email-only,
# owner-only.
#
# Secrets NEVER live here: SMTP creds + the recipient are env vars
# (CRUDE_FV_SMTP_HOST / PORT / USER / PASS / TO) in ~/.config/crude-tanker-fv.env
# (chmod 600), sourced by the cron wrappers. Nothing ever posts to Rocket.Chat
# or any group channel — RC stays read-only ingest.
#
# Change-control: every tag lands with a route entry AND a fixture test
# (tests/test_notify.py derives the live tag set from sentinel.py itself, so an
# unrouted new tag reds the suite); an UNKNOWN tag routes to PAGE (fail loud,
# never silent).
#
# Four routes (2026-09-02, prune ledger rows 20-32 / autopilot §4.2, owner Q-9):
#   page        every run while present — the dinner test
#   page_once   the FIRST sighting of a key pages; repeats ride the digest.
#               August measured 94 FILING-LANDED page instances for 52 filings
#               (48h window = every arrival twice) and 50 EARNINGS-* pages that
#               were not even in this table. Keys: notify.page_once_key.
#   digest      the daily digest line (sent on OK days too — its absence is the tell)
#   record_only state log only, never mailed
subject_prefix: "[crude-fv]"
routes:
  # A PAGE means the OWNER's action is needed and the line says what (owner ruling 2026-09-11:
  # "a page email indicates that action is needed from me ... the email isn't clear whether
  # action will be taken by you or me"). Agent-class work — filings triage, earnings sweeps,
  # unreadable-filing recovery, watchlist pair rebases — rides the DIGEST: the daily agent
  # task picks it up; nothing there asks the owner for anything.
  page:
    - SURFACE-INCOHERENT    # OWNER: a guard contradicted the surface — the agent halts until read
    - FILING-OVERDUE        # OWNER: the issuer has not filed past its window — chase or hold the sheet
  page_once:
    - TRIGGER-DUE           # OWNER observable due; key = tag + label + event (DUE/FIRED/BREACHED + date); day-2 repeat → digest
    - FORK-OPENED           # OWNER (optional): a fork just opened — object before execute_after, else it runs
                            # (2026-09-16: the page moved from the window's CLOSE to its OPENING; at close
                            # only a chat could stop it and the executor now runs it, so close = digest)
    - DIRTY-TOO-LONG        # OWNER/AGENT: the tree has been mid-surgery for days; key = tag
    - REAUTH-NEEDED         # OWNER: re-authenticate the named surface; key = surface; clears on success
    - TASK-PARKED           # OWNER: an unattended run is blocked on a permission prompt only he can answer;
                            # key = tag + pid-N, so each parked session pages once and then rides the digest
                            # (2026-09-20: three sat unnoticed for up to two days, one of them the weekly governor)
  digest:
    - FILING-LANDED         # AGENT-class since 2026-09-11 (was page_once): the daily triage task
                            # dispositions + acks each arrival (filings ack); acked rows drop out
    - FILING-UNREADABLE     # AGENT-class since 2026-09-11 (was page): page-image recovery is agent work
    - FORK-EXECUTABLE       # AGENT-class since 2026-09-16 (was page_once): the window closed — the daily
                            # executor runs it; a needs_code fork says "a chat lands it" and stays here
    - STALE-STATIC          # AGENT-class since 2026-09-11 (was page_once): rebased as a fork (CMDB 9/10)
    - EARNINGS-UNCONFIRMED  # AGENT-class since 2026-09-11 (was page_once per the 2026-07-21 directive,
                            # superseded by the 2026-09-11 ruling): the date sweep is the agent's
    - EARNINGS-SWEEP-STALE  # AGENT-class since 2026-09-11 (was page_once at >7d): the agent runs the sweep
    - STALE-INPUT
    - SIDECAR-STALE
    - PRICE-BASIS
    - NOTIFY-UNCONFIGURED
    - UNINGESTED-PRINTS
    - CALENDAR-UNSEEDED
    - EARNINGS-DUE
    - STALE-BALANCE-SHEET   # report out, sheet pending — the reconciliation
                            # queue's daily reminder (the LANDED page already fired)
    - FETCH-FAILED          # threshold below: pages at 2 consecutive; promoted to
                            # PAGE immediately inside an open earnings window
    - FLEET-TRANSACTION     # unreviewed S&P candidates (ack: sp_scan --mark-reviewed)
    - AGENT-TASK-DUE        # a recurring duty with no plist/heartbeat is overdue
    - ARCHIVE-GAP           # a hole BEHIND the feed head — historical, not an outage,
                            # but it does not self-heal
  record_only:              # never mailed (delivery failure can't page through the
                            # channel that failed — the healthchecks ping-withhold is its pager)
    - NOTIFY-DOWN
# Only tags listed here escalate from the digest to a one-time page after N
# consecutive runs (2026-09-02, F10: the generic every-tag streak paged always-on
# tags — STALE-INPUT, EARNINGS-DUE — and nothing that mattered).
page_after_consecutive:
  FETCH-FAILED: 2           # a fetch layer down two days running is already an incident
