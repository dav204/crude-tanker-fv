# Genco Shipping & Trading dividend policy — METHODOLOGY §4.3
# Source: Q1 2026 10-Q "Dividends" section (filed 2026-05-06).
#
# Stated policy (formulaic, GNK's "value strategy"):
#   Operating cash flow
#   Less: voluntary quarterly reserve (Board discretion; anticipated to be
#         based on future quarterly debt repayments and interest expense)
#   = Cash flow distributable as dividends
#
# Q2 2026 declared (May 6, 2026): $0.35/share. Q1 2026 diluted EPS was $0.21
# ($9,309k / 44.41M shares) — the cash-flow formula pays THROUGH earnings
# because D&A ($21.0M/qtr) adds back to operating cash flow before the
# reserve. Through-cycle, the formula approximates a full distribution of
# earnings after maintenance/deleveraging reserve.
#
# v1 methodology characterisation: variable, ~100% of net income equivalent,
# no fixed base, no floor (GNK paid token $0.15/qtr dividends through the
# 2023 trough — the reserve flexes rather than the policy suspending).
ticker: GNK
policy_type: variable
payout_ratio: 1.00            # cash-flow formula ≈ full NI distribution through-cycle
base_dividend_per_share: 0    # no fixed base
floor: 0                      # no contractual floor (reserve flexes instead)
