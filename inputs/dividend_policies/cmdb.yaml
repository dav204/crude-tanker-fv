# Costamare Bulkers dividend policy — METHODOLOGY §4.3
# Source: Q1 2026 6-K (zero dividend mentions) + FY2025 20-F Item 8
# "Common Stock Dividend Policy" (board discretion; none paid).
#
# CMDB pays NO common dividend and runs NO buyback: recently-spun growth/
# build-out phase, accumulated deficit (-$27.4M at Mar-31-2026), capital
# directed to fleet renewal (Astros purchase, charter-in platform).
# Modeled as variable with payout 0 — the strip contributes only terminal
# NAV, no interim distributions. Same shape as CCEC's zero-incremental
# treatment. REVISIT if the board initiates a payout (a natural catalyst
# given the net-cash balance sheet — flagged in decisions/cmdb_log.md).
ticker: CMDB
policy_type: variable
payout_ratio: 0.0             # no common distributions in build-out phase
base_dividend_per_share: 0
floor: 0
