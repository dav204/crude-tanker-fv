# Rocket.Chat ingest sources.
#
# Each entry describes one ingestion lane in the Value Investor's Edge channel.
#   kind: file  →  download every matching attachment to dest_dir/YYYY/MM/<date>_<name>
#   kind: text  →  parse the message with `parser` and upsert into dest_file (CSV)
#
# Edit this file to add a new contributor — no code change required.

host: https://rc.seekingalpha.com
group: value-investor-s-edge

# Cadence keys (WO2 1.2) — read by the sentinel's source-silence check:
#   expect_cadence: business-daily | daily | weekly (documentation + default
#     silence threshold: 2 business days / 3 days / 10 days)
#   silence_days: explicit calendar-day override of that default
#   single_sender: the feed rides ONE person's posting habit — carried into
#     the flag text so the digest says what actually broke.
sources:
  - name: pareto_research
    kind: file
    sender: Immo.Schroeder
    accept: [pdf]
    dest_dir: inputs/research_pareto
    expect_cadence: business-daily
    # silence_days: business-daily default (2 business days). The Jul/Aug summer
    # override (14d, owner intel 2026-07-12) was DROPPED 2026-09-02 per its own
    # "REVISIT ~Sep-1" note — the daily resumed 8/07; the lane had been muted 11
    # extra days (prune ledger 2026-09-02 row 67).
    single_sender: true

  - name: ffa_drybulk
    kind: file
    senders: [Joeri.van.der.Sman, Chris.Palun]
                       # DATED 2026-07-24 (owner intel 7/23 + channel inspect): Chris.Palun
                       # took over posting the daily FFA widget screenshots ~7/19-20 —
                       # identical Cape/Pmax/Smax panel layout (ffa_ocr-parseable); his
                       # posts also carry a capesize-index TEXT line, which the
                       # baltic_indexes lane parses separately (he is a sender there too).
                       # Joeri.van.der.Sman quiet since 7/18 — kept for a resumption.
                       # The 7/22 STALE-INPUT was a SENDER CHANGE, not a quiet channel;
                       # single_sender retired with the assumption it encoded.
    accept: [image]
    dest_dir: inputs/ffa_drybulk
    expect_cadence: business-daily
    silence_days: 3

  # baltic_indexes (text lane, John.Pace/Chris.Palun/Big_P) and baltic_capesize_table
  # (CPLazos PNGs) RETIRED 2026-09-02 (prune ledger rows 4-5, owner F14): no consumer —
  # normal_rates.py refuses index points by contract (§18.5a), README called the CSV
  # "deliberately unconsumed", the PNG lane had crashed 8/28 and wedged 7/24-27. The
  # 769-row inputs/market_data/baltic_indexes_daily.csv stays FROZEN in git; the seed
  # PNGs stay on disk (gitignored). Re-add a lane here only with a ruled consumer.
