# Rocket.Chat ingest sources.
#
# Each entry describes one ingestion lane in the Value Investor's Edge channel.
#   kind: file  →  download every matching attachment to dest_dir/YYYY/MM/<date>_<name>
#   kind: text  →  parse the message with `parser` and upsert into dest_file (CSV)
#
# Edit this file to add a new contributor — no code change required.

host: https://rc.seekingalpha.com
group: value-investor-s-edge

# Cadence keys (WO2 1.2) — read by the sentinel's source-silence check:
#   expect_cadence: business-daily | daily | weekly (documentation + default
#     silence threshold: 2 business days / 3 days / 10 days)
#   silence_days: explicit calendar-day override of that default
#   single_sender: the feed rides ONE person's posting habit — carried into
#     the flag text so the digest says what actually broke.
sources:
  - name: pareto_research
    kind: file
    sender: Immo.Schroeder
    accept: [pdf]
    dest_dir: inputs/research_pareto
    expect_cadence: business-daily
    silence_days: 14   # SUMMER OVERRIDE (owner intel via RC channel, 2026-07-12):
                       # Pareto does not print the Shipping Daily on a daily basis
                       # in Jul/Aug — silence is seasonal, not a broken lane (the
                       # FFA image lane from the same channel kept flowing). Prices
                       # are NOT gated on this feed (live Yahoo daily, 24/24);
                       # consensus PAIRS age against the 42d threshold as usual.
                       # REVISIT ~Sep-1: drop back to the business-daily default.
    single_sender: true

  - name: ffa_drybulk
    kind: file
    sender: Joeri.van.der.Sman
    accept: [image]
    dest_dir: inputs/ffa_drybulk
    expect_cadence: business-daily
    silence_days: 3
    single_sender: true

  - name: baltic_indexes
    kind: text
    senders: [John.Pace, Chris.Palun]
    parser: baltic_indexes
    dest_file: inputs/market_data/baltic_indexes_daily.csv
    expect_cadence: business-daily
    silence_days: 3
    # When multiple senders post for the same date, higher priority wins.
    priority:
      John.Pace: 2
      Chris.Palun: 1
