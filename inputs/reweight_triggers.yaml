# Scenario-weight re-evaluation triggers — METHODOLOGY §13.3, operationalized.
#
# WHY A FILE: §13.3's prose trigger ("the MoU signs") fired Jun-17-2026 and sat
# unnoticed for 15 days (external audit F-2 + review 2026-07-02). Prose cannot
# page anyone; the refresh preflight (refresh.check_reweight_triggers) reads
# THIS file and surfaces any due/overdue/fired trigger on every run.
#
# Fields per trigger: sector | due (date the observable must be checked; null =
# standing event-watch, reviewed at every refresh) | observable (what to look
# at, with sources) | action (what a firing obliges) | status | added.
# Statuses: armed (watching) / fired (observed — reweight decision now OWED,
# stays red until resolved) / done (decision recorded; point to the decisions/
# note and re-arm or retire) / retired (superseded). Date every status change.

