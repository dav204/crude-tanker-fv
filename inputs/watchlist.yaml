# Watchlist: current prices and analyst target prices — METHODOLOGY.md section 7
# Feeds the per-company report header, the implied-breakeven solve (3.3), and
# the watchlist roll-up. Prices + consensus_pnav: Pareto Securities Shipping
# Daily, 4 JUN 2026 (matched price + P/NAV from the same report so broker NAV
# = price / P/NAV recovers Pareto's own NAV estimate).
# NOTE: Pareto does NOT publish a P/NAV for NAT, ASC, or CCEC (shown as "-" in
# the report's P/NAV column) — those three keep APPROX consensus_pnav and remain
# genuinely unanchored to a broker NAV. All other names are real Pareto prints.
# Entries without an analyst_target are skipped by the loader until modeled.
#
# PRICES ARE VINTAGE ANCHORS, NOT LIVE QUOTES (since 2026-06-10). The pipeline
# CLI values names at the LIVE close from inputs/market_data/prices_daily.yaml
# (auto-fetched daily, com.crude-tanker-fv.price-refresh launchd job;
# loaders.load_watchlist live_prices=True). current_price here is the price
# PAIRED WITH consensus_pnav / consensus_fwd_pe from the same Pareto vintage —
# update them TOGETHER when refreshing from a new daily, never the price alone
# (broker NAV = price/pnav would silently drift; see the TEN $44 incident,
# decisions/ten_log.md 2026-06-10). Reconcile + consensus-EPS read this static.
#
# consensus_pnav = the broker/consensus Price/NAV (Pareto). broker NAV = price /
# consensus_pnav — the implied broker vessel-mark NAV. The broker-NAV sensitivity
# (marks.py / pipeline.run_broker_sweep) solves the uniform vessel-value premium k
# that lifts the tool NAV to this broker NAV, then re-values at tool / midpoint /
# broker marks. The tool-vs-broker spread shows how much of a name's cheapness or
# richness is genuine vs a NAV-mark choice (small for validated pure-plays).
#
# sector: which scenario set to value the name through (METHODOLOGY §11). Default
# `crude` if omitted. `lng` routes the name through sectors.lng in
# inputs/scenario_inputs.yaml (LNG glut-cycle scenarios). Future sectors: product,
# dry_bulk.
