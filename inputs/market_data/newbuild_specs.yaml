    remaining contracted price, including scrubber installation costs, for the eight vessels
    under construction" (newbuild-specific). eco via §3.1 post-2014 build rule (2026 delivery);
    the filing is silent on NB efficiency, so eco rests on the build-year rule, not an explicit
    claim. Adversarially verified vs the live 6-K 2026-06-30 (could not overturn).

