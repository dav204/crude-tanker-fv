  Ctr-Large:            # reference ~6,000 TEU (MB sizes 5,500/6,500)
    # SOFTEST-VALIDATED MARKS IN THE BOOK (§11.8.5): MB's only large-size
    # 2nd-hand assessments are WB designs (5,000WB $63.5M / 6,700WB $75.0M),
    # which price ABOVE the conventional 5,400 NB ($63.0M China) — boom
    # inversion. 10yr below = WB pair interpolated to 6,000 (~$69M) less a
    # ~12% WB-design premium adjustment (JUDGMENT, documented; keeps the
    # curve monotonic). Re-derive before trusting any large-heavy name
    # (DAC/CMRE warning, §11.8.5).
    dwt: 75000
    newbuild: 63000000          # MB 5,400 TEU China
    five_year_benchmark: 59500000
    ten_year_benchmark: 56000000
    scrap_25yr: 10000000          # ~22,000 LDT ESTIMATE
