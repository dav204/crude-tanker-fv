  # dwt-scaled (METHODOLOGY §11.7.x): anchors are at the 180k STANDARD-Capesize
  # baseline; per-vessel value scales by dwt/180000, so a 210k Newcastlemax marks
  # ~1.17x a 180k Capesize (same $/dwt, size only). The 5yr/10yr are overridden by
  # the dwt-normalized transaction fit (cape.yaml). newbuild/scrap re-based to a
  # clean 180k Capesize (NMax newbuild scales to ~$86M; confirm vs an NMax-NB quote).
  Cape:
    dwt: 180000
    dwt_scaled: true
    newbuild: 81500000           # prompt resale (Thread 1; was 74M CONTRACT-basis), = prompt_resale.Cape
    five_year_benchmark: 62000000
    ten_year_benchmark: 45000000
    scrap_25yr: 13000000
    scrubber_premium: 2500000
    eco_premium_pct: 0.05
  # dwt-scaled (§11.7.x): anchors at the 82k Kamsarmax baseline; a 76k Panamax
  # marks ~0.93x, an 84k Kamsarmax ~1.02x. Sample is Kamsarmax-dominated so the
  # anchors are already ~baseline; the fit dwt-normalizes prints (pana.yaml).
  Pana:
    dwt: 82000
    dwt_scaled: true
    newbuild: 46000000           # prompt resale (Thread 1; was 38M CONTRACT-basis), = prompt_resale.Pana
    five_year_benchmark: 32000000
    ten_year_benchmark: 24000000
    scrap_25yr: 7500000
    scrubber_premium: 2000000
    eco_premium_pct: 0.05
  # Post-Panamax (§11.7.10, split 2026-06-29). FLAT (dwt_scaled: false): the old
  # wide-beam 2000s "post-panamax" design — and SB's 85-95.8k cohort — trades at a
  # per-tonne DISCOUNT to modern Kamsarmax, NOT a 1.17x premium, so it must NOT scale
  # up off the 82k Pana baseline. Anchored on the Pareto SBLK NAV table (2026-04-29):
  # 7 units, 96k avg dwt, 15.3yr avg age -> $19.0M/vessel (a broker VALUE mark, not an
  # S&P print — none exists in the archive; CMDB/GSL broker-anchor fallback). The
  # 10yr->25yr leg interpolates ~$19.6M at 15.3yr (matches the mark) vs the ~$22M the
  # dwt-scaled Pana curve gave a 95.8k/16yr hull. Young PPMX (Climate/Troodos) sit near
  # the Kamsarmax level; the discount bites on the old/large hulls.
  Post-Panamax:
    dwt: 90000
    dwt_scaled: false
    newbuild: 46000000           # prompt resale (Thread 1; was 38.5M), = prompt_resale.Post-Panamax (= Kamsarmax resale)
    five_year_benchmark: 34000000
    ten_year_benchmark: 26000000
    scrap_25yr: 8000000
    scrubber_premium: 2000000
    eco_premium_pct: 0.05
  # dwt-scaled (§11.7.x): anchors at the 62k baseline; a 56k Supramax marks
  # ~0.90x, a 64k Ultramax ~1.03x. The fit dwt-normalizes prints (supra_ultra.yaml).
  Supra-Ultra:
    dwt: 62000
    dwt_scaled: true
    newbuild: 43000000           # prompt resale (Thread 1; was 38M CONTRACT-basis), = prompt_resale.Supra-Ultra
