# Aframax secondhand sale prints — METHODOLOGY.md sections 3.1, 9.9
# 13 publicly-disclosed transactions, Jan 2025 - Jun 2026, used by the
# transaction-anchor solver (transactions.py) to recalibrate the 5yr and 10yr
# Aframax curve anchors. Newbuild + old-age legs are NOT touched.
#
# Mix: ages 7, 8, 10 (×3), 11, 14, 15 (×3), 16, 17 (×3) — covers both anchor
# regions (solver weights by age proximity + recency, ~15mo half-life). LR2-hull
# prints flagged (clean coatings carry a modest premium over crude Aframax;
# dirty-trading LR2 hulls price to THIS curve per the STI Condotti bifurcation
# note below).
#
# Sources: SEC 6-K filings (Performance Shipping PSHG), Q1 2026 earnings release
# (Teekay Tankers TNK), trade-press summaries (Riviera, Splash247, TradeWinds),
# Pareto Shipping Daily archive, MB Shipbrokers Tanker Weekly.
