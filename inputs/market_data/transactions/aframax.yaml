  # NEW 2026-06-04: STI Condotti (Nov 2014 build, age 11 in Feb 2026) sold by
  # Scorpio (STI) for excess of $70M per Compass Maritime weekly. Reported as
  # "Aframax / LR2" — i.e., a Hyundai Samho eco scrubber LR2-class hull
  # whose current-cycle pricing is being marked as Aframax (consistent with
  # §14.6.1 LR2 cargo-switching: when LR2s defect to dirty Aframax trade
  # they value to the Aframax curve, not the clean-LR2 curve). Compare to
  # STI Goal/Gallantry in lr2.yaml — both 2014-2016 builds, both eco scrubber,
  # but STI Goal/Gallantry sold at $52.3M (LR2-clean-mode) vs STI Condotti
  # $70M (Aframax/dirty-mode) — the empirical bifurcation between trading
  # modes within the LR2 class.
  - date: 2026-02-15
    vessel_age_at_sale: 11
    sale_price_usd_m: 70.0
    source: Compass Maritime weekly report — sale of STI Condotti
    quality_flag: standard
    notes: Hyundai Samho-built Nov 2014; 109,999 DWT; eco design + scrubber-fitted. Reported by Scorpio as Aframax/LR2 — flagged here as Aframax-trading-mode LR2. Sits modestly above existing 10yr Aframax anchor at age 11 — confirms the Aframax-trading-mode LR2 prices to the Aframax curve, not the clean-LR2 curve.
