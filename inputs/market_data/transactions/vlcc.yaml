# VLCC (~300,000 DWT crude tanker) secondhand sale prints — METHODOLOGY 3.1, 9.9
# Used by the transaction-anchor solver (transactions.py) to recalibrate the
# 5yr and 10yr VLCC curve anchors. Newbuild + old-age legs are NOT touched.
#
# CALIBRATION CHECK (existing curve at relevant ages):
#   age 4 curve  ≈ $145.4M  vs $125.0M chatter  (Hyundai Samho 2× 2022)
#   age 5 curve  =  $138.0M vs $112.0M (CSSC Liaoning, incl T/C strip)
#   age 10 curve =  $111.0M vs $103.9M (FRO 8-VLCC en bloc 2015-16 avg)
#   age 13 curve =   $93.2M vs  $84.5M (Teekay Singapore Spirit)
#   age 14 curve =   $87.3M vs  $89.0M (CMB.TECH Ingrid + Ilma, 2012)
# Pattern: curve runs HIGH at the 5yr leg (-15-20% vs prints) and modestly
# high at the 10-14yr leg (-3-10%). Implies the broker resale level we use
# for the existing curve sits above 2026 transaction reality at the modern
# end — consistent with the cooler VLCC market vs the hotter Suezmax/Aframax
# market reflected in the existing prints (Sinokor's VLCC buying campaign
# absorbed a glut of mid-age tonnage at +10-15% over broker market, but most
# named arm's-length deals settled BELOW the curve).
#
# SOURCES: Frontline (FRO) Q1 2026 ER (8-VLCC disposal); Teekay (TNK) Q1
# 2026 ER (VLCC-sector exit); CMB.TECH press release; Compass Maritime
# weekly reports; Splash247 / Hellenic Shipping News S&P columns;
# Marine Log. Raw worksheet at inputs/market_data/transactions/raw/
# product_tanker_transactions_2026.xlsx (Crude Tanker Deals sheet).
#
# OUT-OF-FIT REFERENCE — the Sinokor 2026 VLCC buying campaign (~35 of 45
# sector S&P volume in early 2026, ~$2.5bn+ aggregate, mostly 2010-2016
# builds, avg ~12yo, reported at +10-15% over prior broker quotes) is
# EXCLUDED from the fit on DATA-QUALITY grounds only: no per-vessel
# age/price disclosure exists, and splitting the aggregate into synthetic
# per-vessel rows would be invention (CLAUDE.md 2026-06-09 no-back-solve
# rule). NOT excluded as a "distortion" — owner decision 2026-06-09:
# Sinokor is the dominant buyer in the VLCC S&P market and its bid IS the
# market. Its price level already enters the fit through named
# Sinokor-side deals (Ingrid/Ilma $89M each, the 2007 Dalian at $47M).
# PROMOTE individual campaign vessels into the fit as soon as per-vessel
# prints surface (TradeWinds periodically itemizes them).
