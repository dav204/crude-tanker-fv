#   - 5-yr node EMPTY: age-5 is EXTRAPOLATED through the 9-17 cluster —
#     fitted $92.3M, spanning $89.7-95.9M across exclusion cuts. FLAGGED
#     WIDE. Cross-checks: age-5/NB parity = 0.79 (= the VLCC curve's
