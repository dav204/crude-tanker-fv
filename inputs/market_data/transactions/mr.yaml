    notes: outside [3,17] window. CS Fujairah / CS Rotterdam — built Jan/Mar 2026 Chengxi Shipyard (no scrubber). Price includes balance of 12-15mo T/C; pure-vessel price is marginally below if T/C strip premium backed out. LANDS ON our NB anchor exactly — validates age-0 calibration.
