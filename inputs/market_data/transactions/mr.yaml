    quality_flag: standard
    notes: 2-vessel package — STI Brooklyn / Black Hawk (2015-built MR, scrubber-fitted). $70M aggregate ($35M/vessel).
  # ---- OUT-OF-WINDOW (documentation only; ages outside [3,17], silently excluded by solver) ----
  - date: 2026-02-15
