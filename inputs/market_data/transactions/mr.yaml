    vessel_age_at_sale: 12
    sale_price_usd_m: 32.0
    source: Scorpio Tankers (STNG) press release Nov 2025; closing Q1 2026
    quality_flag: standard
    notes: 4-vessel package — STI Battery / Venere / Milwaukee / Yorkville (2014-built MR, scrubber-fitted). $128M aggregate ($32M/vessel).
