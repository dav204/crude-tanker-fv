# Suezmax secondhand sale prints — METHODOLOGY.md sections 3.1, 9.9
# Used by the transaction-anchor solver (transactions.py) to recalibrate the
# 5yr and 10yr Suezmax curve anchors. Newbuild + old-age legs are NOT touched.
#
# PRIMARY ANCHOR: the 2009-built (age 17) Suezmax disposed by Teekay Tankers
# in May 2026 for $53.5M is the only firm, disclosed, arm's-length print at
# the right-edge of the [3,17] mid-age window — anchors the right side of the
# regression. The existing curve gives ~$48.7M at age 17, so this print sits
# ~10% above the curve (curve underprices the old-mid-age leg modestly).
#
# Mix: ages 6, 8, 9, 12, 17 (in-window) covers both anchor regions. The TNK
# Q1 2026 (avg age 18) and NAT Jan 2026 (avg age 21.5) PACKAGE disposals are
# included for documentation only — both ages fall OUTSIDE the [3,17] mid-age
# window and so are silently excluded by the solver.
#
# Sources: TNK Q1/Q2 2026 earnings disclosures, NAT Q1 2026 ER + press, broker
# S&P columns (Splash247, TradeWinds, Hellenic Shipping News). Mid-age prints
# from trade press are best-available representative levels — the public S&P
# market for mid-life Suezmaxes is thin, so individual prints are bracketed
# by the broker market summaries rather than vessel-named filings.
class: Suezmax
