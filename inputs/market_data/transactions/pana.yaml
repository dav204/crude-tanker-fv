# Pana secondhand sale prints — METHODOLOGY.md sections 3.1, 9.9, 11.7
# "Pana" class collapses Panamax + Post-Panamax + Kamsarmax per §11.7.1
# (SBLK class collapse). Used by the transaction-anchor solver to
# recalibrate 5yr and 10yr anchors. Newbuild + old-age legs untouched.
#
# SCOPE — thin sample (5 in-window prints) spanning the mid-age window
# at ages 9, 9, 11, 15, 17. The two 2016-built kamsarmaxes (2025-09-19 and
# 2025-10-06) MAY be the same vessel — Pareto's commentary did not
# disambiguate. Flagged but both kept (the solver weights by recency, so
# any double-counting is modest and the two prices ($27.5M vs $26.5M)
# bracket a reasonable range).
#
# CALIBRATION CHECK (existing curve at relevant ages, prior to fit):
#   age 9  curve ≈ $26M (interp 5↔10) vs prints $26.5-27.5M → curve ~OK
#   age 10 curve = $24.0M (existing) vs ~$25M implied at 10 → curve −4%
#   age 15 curve = $14.5M (interp 10↔25yr) vs Selina $11.8M → curve +20%
#   age 17 curve = $12.5M (interp 10↔25yr) vs Thenamaris $14.25M → curve −12%
# The age-15 Selina print is below curve (older vintage panamax, not
# kamsarmax — 76k dwt is the smaller subclass); the age-17 Thenamaris is
# above curve. Expected fit impact: modest DOWNWARD revision at age 10
# anchor (Pana sector trading weaker than crude/product market dynamics),
# with the 5yr unchanged or slightly upward given the 9yo cluster.
#
# CLASS-COLLAPSE NOTE: prints span Panamax (75-77k dwt) and Kamsarmax
# (82k dwt). Per Pareto commentary the two trade off the same generic
# curve with Kamsarmax modestly above (larger/newer). The 2025-06-17
# Selina print is for the smaller Panamax subclass — sits ~$3M below
# the Kamsarmax-implied curve at age 15. Kept as-is for v1.
#
# SOURCES: Pareto Shipping Daily archive — Thenamaris (kamsarmax 2008),
# Diana (Selina panamax 2010), broker S&P columns for 2016-built Japanese
# kamsarmax. Star Mariella (SBLK Q1 2026 6-K) excluded — see note below.
