# Supra-Ultra secondhand sale prints — METHODOLOGY.md sections 3.1, 9.9, 11.7
# "Supra-Ultra" class collapses Supramax + Ultramax per §11.7.1 (SBLK class
# collapse). Used by the transaction-anchor solver to recalibrate 5yr and
# 10yr anchors. Newbuild + old-age legs untouched.
#
# SCOPE — rich sample (15 in-window prints) spanning ages 4-17 with strong
# coverage at ages 9-16. Includes:
#   - SBLK Star Stonington (2012 Ultramax, $19.6M, age 14) — Q1 2026 6-K
#     disclosed individually (separate from the Scarlett+Mariella aggregate)
#   - Belships 4-vessel ultramax package ($84M en-bloc → $21M each, 2015-16
#     Chinese build) — 2025-08-05
#   - SBLK Star Goal/Sandpiper pair ($28.5M total → $14.25M each, 2010-11
#     supramax scrubber) — 2025-08-05
#   - CMB → HMM en-bloc 2x 2020-21 ultramaxes ($64M → $32M each) —
#     2025-09-19
#   - Plus 7+ individually-disclosed broker reports across ages 9-17
#
# CALIBRATION CHECK (existing curve at relevant ages, prior to fit):
#   age 5  curve = $33.0M (existing) vs CMB→HMM $32M → curve −3% (well-calibrated)
#   age 9  curve ≈ $28.5M (interp 5↔10) vs cluster $21-26.5M → curve +10-25%
#   age 10 curve = $25.0M (existing) vs $20-21M (Belships/Hantong) → curve +20-25%
#   age 14 curve ≈ $19M (interp 10↔25yr) vs $12.8-19.6M cluster → curve +5-30%
#   age 17 curve ≈ $14M (interp 10↔25yr) vs Thenamaris $12.25M → curve +14%
# Curve runs SIGNIFICANTLY HIGH at age 9-17 (Chinese-build Supra/Ultra
# trading well below curve). Expected fit impact: DOWNWARD recalibration
# of 5yr and 10yr anchors, with magnitude depending on the recency-weighted
# average of the cluster. The age-4 CMB→HMM $32M anchor protects the 5yr
# leg from over-correction.
#
# CLASS-COLLAPSE NOTE: prints span Supramax (50-58k dwt) and Ultramax
# (60-65k dwt) consistent with the SBLK §11.7.1 collapse. Ultramax
# commands a modest premium per Pareto commentary (e.g. 2025-01-14
# 2013 Japanese ultramax $19.5M vs 2011 Japanese supramax $15M — DWT
# and age contribute).
#
# SOURCES: Pareto Shipping Daily archive; SBLK Q1 2026 6-K (Stonington);
# Diana (DSI Drammen), Belships (4-ship package), SFL (Hudson), Thenamaris.
