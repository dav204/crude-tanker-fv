# Supra-Ultra secondhand sale prints — METHODOLOGY.md sections 3.1, 9.9, 11.7
# "Supra-Ultra" class collapses Supramax + Ultramax per §11.7.1 (SBLK class
# collapse). Used by the transaction-anchor solver to recalibrate 5yr and
# 10yr anchors. Newbuild + old-age legs untouched.
#
# As of 2026-06-27 the curve is **dwt-scaled** (METHODOLOGY §11.7.x): anchors at
# the 62k baseline, the fit NORMALIZES each print to 62k (price × 62000/dwt) before
# solving 5yr/10yr, and vessel_market_value scales each hull by its own dwt — so an
# Ultramax (~63k) marks ~1.02x and a Supramax (~56k) ~0.90x. Each print carries a
# `dwt:` field (Ultramax ~63k, Supramax ~56k; explicit where the notes give it).
#
# SCOPE — rich sample (22 in-window prints) spanning ages 4-17 with strong
# coverage at ages 9-16. Includes:
#   - SBLK Star Stonington (2012 Ultramax, $19.6M, age 14) — Q1 2026 6-K
#     disclosed individually (separate from the Scarlett+Mariella aggregate)
#   - Belships 4-vessel ultramax package ($84M en-bloc → $21M each, 2015-16
#     Chinese build) — 2025-08-05
#   - SBLK Star Goal/Sandpiper pair ($28.5M total → $14.25M each, 2010-11
#     supramax scrubber) — 2025-08-05
#   - CMB → HMM en-bloc 2x 2020-21 ultramaxes ($64M → $32M each) — 2025-09-19
#   - Plus 7+ individually-disclosed broker reports across ages 9-17
#
# CALIBRATION CHECK (dwt-normalized to 62k, prior to fit): the curve previously
# ran HIGH at ages 9-17 (Chinese-build Supra/Ultra trading below curve); the fit
# revises the 5yr/10yr anchors down. The age-4 CMB→HMM $32M (ultramax 63k) anchor
# protects the 5yr leg from over-correction.
#
# CLASS-COLLAPSE NOTE: prints span Supramax (50-58k dwt) and Ultramax (60-65k
# dwt); the dwt-scaling now captures the size premium that §11.7.1 deferred (e.g.
# 2025-01-14 2013 ultramax $19.5M @ 63k vs 2011 supramax $15M @ 56k — dwt + age).
#
# SOURCES: Pareto Shipping Daily archive; SBLK Q1 2026 6-K (Stonington);
# Diana (DSI Drammen), Belships (4-ship package), SFL (Hudson), Thenamaris.
