# Cape secondhand sale prints — METHODOLOGY.md sections 3.1, 9.9, 11.7
# "Cape" class collapses Capesize + Newcastlemax per §11.7.1 (SBLK class
# collapse). Used by the transaction-anchor solver (transactions.py) to
# recalibrate 5yr and 10yr anchors. Newbuild + old-age legs untouched.
#
# SOURCES: Pareto Shipping Daily archive (broker S&P column) for 2025-2026
# disclosed sales; CMB.TECH (Battersea/Belgravia), 2020 Bulkers (3-vessel
# package sold to unaffiliated third party), Norden (Nord Palladium),
# Bocimar (Mineral Hiroshige), Oldendorff (Luise Oldendorff), EPS (Mount
# Austin/Song), Enesel (Thalassini Agatha), Genco (Imabari Cape
# acquisition), 3x Mineral Imabari (Edo/Hokusai/Utamaro). Star Scarlett
# (SBLK Q1 2026 6-K) is documented out-of-fit because the SBLK
# disclosure aggregated Scarlett+Mariella at $46.4M without per-vessel
# split — usable as a sanity reference, not as a fit point.
#
# CALIBRATION CHECK (existing curve at relevant ages, prior to fit):
#   age 5  curve = $62.0M (existing) vs cluster of $69.7-76.25M prints → curve −10-19%
#   age 10 curve = $45.0M (existing) vs cluster of $51-55M Mineral/Oldendorff → curve −12-18%
#   age 15 curve = $? (interp 5↔10) ~$33M  vs cluster of $25-29M → curve +10-15%
# Curve runs CONSERVATIVE at age 5-10 (modern eco/scrubber nmaxes commanding
# premiums) and is ROUGHLY CALIBRATED at age 15-16 (scrubber Japanese
# capes for $24-29M). Expected fit impact: UPWARD recalibration of 5yr
# and 10yr anchors, with the 10yr clamp [$21M, $74.1M] likely binding
# the 5yr ceiling near NB×0.95 = $74.1M.
#
# CLASS-COLLAPSE NOTE: prints span Capesize (170-180k dwt) and Newcastlemax
# (200-210k dwt). Newcastlemax commands a modest premium per-tonne but
# Pareto's commentary explicitly treats them as a single market segment
# in S&P discussions (see e.g. 2026-04-21 GNK Imabari Cape vs the Mineral
# nmaxes — all priced off the same curve with a Japanese-yard premium).
# v1 keeps them unified per §11.7.1; if the empirical bifurcation widens,
# split out Newcastlemax as its own class later.
