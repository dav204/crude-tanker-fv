# Cape secondhand sale prints — METHODOLOGY.md sections 3.1, 9.9, 11.7
# "Cape" class spans Capesize (~170-182k dwt) + Newcastlemax (~207-210k dwt).
# As of 2026-06-27 the Cape curve is **dwt-scaled** (METHODOLOGY §11.7.x): the
# curve anchors are at the 180,000 dwt baseline, the fit below NORMALIZES every
# print to 180k (price × 180000/dwt) before solving the 5yr/10yr anchors, and
# vessel_market_value scales each hull back up by its own dwt. So a 210k
# Newcastlemax and a 180k Capesize differ by SIZE only (they trade at the same
# $/dwt — the clean Genco pair: 182k Cape $63.55M = $349/dwt vs 208k NMax
# $72.75M = $350/dwt). Each print therefore carries a `dwt:` field used by the
# normalization; missing dwt falls back to the baseline (no normalization).
#
# SOURCES: Pareto Shipping Daily archive (broker S&P column) for 2025-2026
# disclosed sales; CMB.TECH (Battersea/Belgravia), 2020 Bulkers (3-vessel
# package), Norden (Nord Palladium), Bocimar (Mineral Hiroshige), Oldendorff
# (Luise Oldendorff), EPS (Mount Austin/Song), Enesel (Thalassini Agatha), Genco
# (Imabari Cape + the Stars/Valkyrie/Courageous Q1 2026 10-Q Note 5), 3x Mineral
# Imabari (Edo/Hokusai/Utamaro). Star Scarlett (SBLK) documented out-of-fit (the
# Scarlett+Mariella aggregate had no per-vessel split — no back-solve).
#
# CALIBRATION CHECK (dwt-NORMALIZED to 180k, prior to fit):
#   the modern NMax prints ($69.7-76.25M @ 207-210k) normalize to ~$60-66M @ 180k,
#   converging with the 182k Capesize prints ($63.55-65M → ~$62-64M @ 180k) — i.e.
#   the same $/dwt. The fit lands the 5yr baseline near $63M (180k Capesize), and a
#   210k NMax then scales to ~$73M. (Pre-dwt-scaling the blended fit sat at ~$72M,
#   which over-valued standard Capesize and was ~right only for NMax.)
