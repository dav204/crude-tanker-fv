# Star Bulk Carriers cost structure — METHODOLOGY.md §4.4
# Source: Q1 2026 6-K income statement + ownership-days table (ex99-1.htm).
# All figures derived from Q1 2026 actuals; annualised (×4).
#
# Per-class opex calibration:
# Q1 2026 disclosed: Vessel operating expenses $61,786 ($k); ownership days
# 12,183. Fleet-wide daily opex = $61,786k / 12,183 = $5,071/day.
# By class (industry conventions; weighted to fleet-wide avg):
#   Cape:        higher opex (more crew, more maintenance on 180k+ dwt hulls)
#   Pana:        mid-tier
#   Supra-Ultra: lower opex (smaller crew, less consumables)
# Weighted check against fleet composition (31 Cape / 46 Pana / 58 Supra-Ultra):
#   (31×6300 + 46×4900 + 58×4500) / 135 = $5,043/day  ← within $30/day of disclosed
ticker: SBLK

opex_per_day:                 # daily operating cost per vessel, by class
  Cape: 6300
  Pana: 4900
  Supra-Ultra: 4500

# Annual G&A — Q1 2026: G&A $14,481 + Management fees $5,451 = $19,932 ($k)
# Q1 annualised: 19,932 × 4 = 79,728 ($k) ≈ $79.7M
# Note: SBLK uses an in-house technical/commercial management organisation
# (no external managers) — G&A line is the unified shoreside cost.
annual_G_and_A: 79728000

# Annual interest expense — Q1 2026: Interest and finance costs $12,893 ($k)
# Q1 annualised: 12,893 × 4 = 51,572 ($k) ≈ $51.6M
# Note: Q1 2025 was $19,275k (annualised $77.1M); Q1 2026 decreased materially
# due to debt prepayments + lower SOFR. Forward run-rate may bias slightly
# higher than Q1 alone as SOFR moves; methodology v1 uses Q1 annualised.
annual_interest_expense: 51572000

# Effective tax rate: 0.0 — SBLK is a Marshall Islands corporation; the
# Marshall Islands has no corporate income tax. SBLK is therefore in a
# 0% tax regime (consistent with the tonnage-tax-like treatment for Greek
# operators). Verify per the 2025 20-F tax note if precision matters.
effective_tax_rate: 0.0
