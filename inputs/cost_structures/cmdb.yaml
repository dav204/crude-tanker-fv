# Costamare Bulkers cost structure — METHODOLOGY §4.4
# Source: Q1 2026 6-K financials exhibit (filed 2026-05-13). Annualised ×4.
#
# Per-class opex calibration:
# Q1 2026: vessels' operating expenses $16.7M over 2,742 ownership days
# = $6,091/vessel/day fleet average (OWNED fleet only — the chartered-in
# CBI platform's cost is charter-hire expense, $46.0M in Q1, a P&L line
# not an owned-vessel cost). By class, weighted to the disclosed average
# (29 vessels: 6 Cape / 7 Pana / 16 Supra-Ultra):
#   (6×7600 + 7×6300 + 16×5450) / 29 = $6,100/day  ← within $10 of disclosed
ticker: CMDB

opex_per_day:                 # daily operating cost per vessel, by class
  Cape: 7600
  Pana: 6300
  Supra-Ultra: 5450

# Annual G&A — Q1 2026: G&A $2.3M + management/agency fees to related
# parties $5.4M + non-cash G&A (stock comp) $0.9M = $8.6M/qtr ×4 = $34.4M.
# NOTE the related-party management fee is the dominant shoreside cost —
# Costamare-affiliated managers run the ships (and the CBI platform).
# Heavy for a 29-ship owned fleet because it also carries the trading
# platform's overhead; kept all-in for v1 (the platform's revenue is in
# the P&L too). Flagged in the §15-candidate note on the balance sheet.
annual_G_and_A: 34400000

# Annual interest expense — Q1 2026 gross interest + finance costs $2.6M
# ×4 = $10.4M. (Interest income $1.6M/qtr nearly offsets — net-cash
# balance sheet; convention uses gross, matching SBLK/GNK.)
annual_interest_expense: 10400000

# Effective tax rate: 0.0 — Marshall Islands holding / Monaco operations;
# no income tax line in Q1 2026 statements.
effective_tax_rate: 0.0
