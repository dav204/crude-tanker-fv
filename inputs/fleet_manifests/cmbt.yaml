# CMB.TECH NV (CMBT, ex-Euronav) fleet manifest — METHODOLOGY §4.1, §11.9
# First crude + dry_bulk + containerships MULTI-SLEEVE hybrid (MULTI_SLEEVE_TICKERS).
# Sources (SEC EDGAR CIK 1604481): Q1-2026 6-K Ex-99.1 (filed 2026-05-19; fleet
# counts at 2026-03-31) + FY2025 20-F (filed 2026-04-21; per-vessel built years,
# "Our Fleet" table as of 2026-04-01). Full sourced detail in
# outputs/cmbt_onboarding/{01_crude_fleet,02_drybulk_fleet,03_container_chem_offshore}.md.
# Onboarded 2026-06-26.
#
# SCOPE = the 129 ON-CURVE vessels on the water at 2026-03-31:
#   - Crude sleeve (sectors.crude):       4 VLCC + 16 Suezmax = 20
#   - Dry bulk sleeve (sectors.dry_bulk): 75 Cape-class (38 NMax + 37 Capesize)
#                                         + 30 Pana-class (26 Kamsarmax + 4 Panamax) = 105
#   - Container sleeve (sectors.containerships): 4 Ctr-Large (6,000 TEU) = 4
# OFF-CURVE (held at the balance-sheet level, NOT in this manifest — §11.9):
#   - 2 FSO (service contracts) -> shuttle_contracted_book
#   - 8 Bochem chemical (25k stainless) -> working_capital_net at segment book
#   - 3 CSOV + 44 owned + 15 JV CTV (Windcat) -> working_capital_net at segment book
#   - 3 held-for-sale (Ilma, Ingrid VLCC + Sienna Suezmax) -> working_capital_net at agreed price
#   - the multi-segment newbuild book -> newbuild_advances_paid
#   See balance_sheets/cmbt_2026-Q1.yaml for each off-curve line + rationale.
#
# Class mapping: Newcastlemax + Capesize -> "Cape" value class; Kamsarmax +
# Panamax -> "Pana"; 6,000 TEU box -> "Ctr-Large". Dry bulk is grouped by
# built-year cohort (count) — valuation is by age, so a cohort is exact; the
# per-vessel rosters (names/yards) are in 02_drybulk_fleet.md.
# Ages = 2026.25 − built_year. eco = built ≥ 2015. Scrubber UNDISCLOSED in the
# SEC filings (default false). Yard-quality discount (§9.4) NOT applied in v1
# (the dry-bulk book is China-heavy; a per-yard pass is a Q3 refinement) — NAV
# is the "without yard discount" leg.

