# Ardmore Shipping (ASC / NYSE:ASC) fleet manifest — METHODOLOGY.md sections 4.1, 11.5
# Source: Ardmore Q1 2026 results (6-K filed 2026-05-07, ex-99.1 press release)
# cross-checked against the public fleet page (ardmoreshipping.com/our-fleet/).
# Balance sheet as of 2026-03-31.
#
# Scope = the 19 RETAINED OPERATING MRs as of 2026-03-31. Three fleet entries
# are deliberately NOT in this manifest and handled via the balance sheet:
#   - Ardmore Engineer (2014 MR): held for sale at an agreed $35.5M (delivery
#     ~Jun 2026) -> enters NAV via working_capital_net at the agreed sale price,
#     not the age curve.
#   - 4 × Handysize chemical (Chippewa / Chinook / Cheyenne / Cherokee — 25k
#     DWT Japan-built 2015) -> excluded from class-curve manifest and entered
#     in NAV via working_capital_net at ESTIMATED market value (see §11.5
#     methodology gap note; no Handysize class in the curve framework).
#   - 2 × Handysize product (Defender / Dauntless — 37k DWT Korea-built 2015)
#     -> excluded from class-curve manifest, entered via working_capital_net.
# Net effect: 19 vessels on-curve + 7 off-curve via working_capital_net.
#
# 2 × Handysize product/chemical NEWBUILDS (40,500 DWT each, late-2028 delivery,
# $44.9M each) are handled via newbuild_capex_commitments + newbuild_advances_paid.
#
# age = 2026 - year built. eco = built post-2014 (METHODOLOGY 3.1 definition).
# The 5 × 2013-built "Eco-Mod" MRs sit at eco: false — modest over-valuation
# vs the modern-spec MR curve (the MR curve is eco-inclusive); flagged in §6.
# scrubber: Ardmore runs ZERO scrubbers fleet-wide (their decarbonisation play
# is Eco-design + biofuel trials + carbon-capture pilot, not scrubber retrofit).
ticker: ASC
report_date: 2026-Q1
vessels:
  # ---- 2013 builds (age 13) — 5 Eco-Mod MRs (pre-2014: eco false per §3.1) ----
  - {id: Ardmore_Seavaliant,  class: MR, dwt: 49998, age: 13, scrubber: false, eco: false, charter_status: spot, count: 1}
  - {id: Ardmore_Seaventure,  class: MR, dwt: 49998, age: 13, scrubber: false, eco: false, charter_status: spot, count: 1}
  - {id: Ardmore_Endeavour,   class: MR, dwt: 49997, age: 13, scrubber: false, eco: false, charter_status: spot, count: 1}
