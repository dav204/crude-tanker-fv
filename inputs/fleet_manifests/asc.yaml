  # CHEMICAL Handies (Chippewa/Chinook/Cheyenne/Cherokee) remain OFF-curve in
  # working_capital_net — 25k chem is a smaller, lower-value hull a 38k product
  # curve would overvalue; now a narrower "chemical Handy" residual (LIMITATIONS §2).
  - {id: Ardmore_Defender,    class: Handysize, dwt: 37000, age: 11, scrubber: false, eco: true, charter_status: spot, count: 2}
