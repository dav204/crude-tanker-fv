# Ardmore Shipping (ASC / NYSE:ASC) fleet manifest — METHODOLOGY.md sections 4.1, 11.5
# Source: Ardmore Q1 2026 6-K (acc 0001104659-26-056715, asc-20260331x6k.htm) fleet table,
# "As of March 31, 2026, our fleet consisted of the following 25 owned vessels". Cross-footed
# vessel-by-vessel against that table. Reconciliation: decisions/asc_reconciliation_prereg_2026-07-01.md.
#
# The 25 owned vessels split: 18 operating MRs (~50k) + 2 product Handysize (37k) ON-CURVE here;
# and handled via the balance sheet (excluded from this manifest so marks don't double-count):
#   - Ardmore Engineer (2014 MR, 49,420): agreed sold $35.5M (delivery June 2026), classified
#     held-for-sale effective 3/31 -> NAV via the `held_for_sale` field at the agreed price.
#   - 4 × Handysize CHEMICAL (Chippewa/Chinook/Cheyenne/Cherokee — 25,217 DWT Japan-built 2015)
#     -> off-curve (§11.5: no clean 25k-stainless resale curve) via working_capital_net at a
#     CARRYING-VALUE FLOOR (cited to the 20-F market>carrying disclosure; see balance sheet).
# Net: 20 vessels on-curve (18 MR + 2 product Handy) + 5 off-curve via the balance sheet = 25.
#
# NOTE — the 2 × 40,500 DWT Handysize NEWBUILDS ($44.9M each, Wuhu, delivery "from late 2028")
# were ordered IN APRIL 2026 (6-K Note 8 subsequent event) — AFTER the 3/31 date, so they are
# EXCLUDED from this Q1 snapshot entirely. They enter the Q2 refresh (on-curve, §9.6).
#
# age = 2026 - year built. eco = built post-2014 (METHODOLOGY 3.1 definition).
# The 2013-built "Eco-Mod" MRs sit at eco: false — modest over-valuation vs the modern-spec MR
# curve (which is eco-inclusive); flagged in §6.
# scrubber: Ardmore runs ZERO scrubbers fleet-wide (Eco-design + biofuel/carbon-capture play,
# not scrubber retrofit; 20-F).
ticker: ASC
report_date: 2026-Q1
vessels:
  # ---- 2013 builds (age 13) — 5 Eco-Mod MRs (pre-2014: eco false per §3.1) ----
