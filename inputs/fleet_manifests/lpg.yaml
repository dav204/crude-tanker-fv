# Dorian LPG Ltd. fleet manifest — METHODOLOGY.md section 4.1 (WO3 Phase 4, onboarded 2026-07-10)
# Source of record: FY2026 10-K (year ended 2026-03-31; filed 2026-05-27,
# acc 0001596993-26-000025). Per-vessel identity/cbm/built/cost/carrying value from the
# Item 5 carrying-value table ("as of March 31, 2026 ... none of the vessels ... held for
# sale"); scrubber ("S") / ECO / dual-fuel ("DF") / employment flags from the Item 4
# fleet table ("Scrubber Equipped and/or Dual-Fuel", "ECO Vessel" columns).
#
# Scope = the 22 vessels OWNED or operated under bareboat/Japanese-financing arrangements
# at 2026-03-31 (carrying-value table total capacity 1,855,000 cbm ties). The six TIME
# CHARTERED-IN VLGCs (Future Diamond, HLS Citrine, HLS Diamond, Cristobal, Crystal
# Asteria, BW Tokyo) are NOT owned and are excluded — their capitalized operating-lease
# liabilities are subtracted in the balance sheet (CMDB/SBLK charter-in convention).
#
# SUBSEQUENT EVENTS AUDITED FIRST (Note 25): (1) Apr-20-2026 $16.5M prepayment of the
# 2023 A&R Debt Facility (Cobra tranche); (2) May-6-2026 sale of Cobra COMPLETED, net
# proceeds $81.9M; (3) May-7-2026 irregular dividend $1.00/sh ($42.8M). ALL post-quarter:
# the snapshot keeps Cobra in the operating fleet (not HFS at 3/31 per the filing) and
# keeps the debt/cash at 3/31 levels. The $81.9M filed print updates the §9.9 Cobra row
# in transactions/vlgc.yaml (pre-registered watch item).
#
# age = 2026 - year built (repo convention). dwt is NOT NAV-moving for VLGC (curve is
# flat, not dwt_scaled — §11.10); the issuer discloses capacity in cbm, so dwt carries a
# nominal 55,000 for the ~84k cbm hulls (Areion 93k cbm ~60,000). Capacity noted per hull.
# scrubber/eco premiums are ZERO for VLGC (§11.10 unsourced premiums stay 0), so neither
# flag is value-moving; both are still cited to the Item 4 fleet-table columns.
# Charter statuses: "Pool" = Helios Pool voyage employment -> spot exposure; "Pool-TCO" =
# time-chartered out through the pool -> time_charter (expirations are calendar quarters
# from the Item 4 table; per-vessel TCO rates not disclosed).
