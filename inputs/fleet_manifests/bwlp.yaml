# BW LPG Limited fleet manifest — METHODOLOGY.md section 4.1 (WO3 Phase 4, onboarded 2026-07-10)
# Sources of record: FY2025 20-F (filed 2026-03-31, acc 0001104659-26-037215) Item 4.B fleet
# tables (owned / chartered-in / India-leased / BW LPG India); Q1-2026 interim report
# (6-K filed 2026-06-03, acc 0001213900-26-064314) for the 3/31/2026 state: "As of 31 March
# 2026, BW LPG controls a fleet of 49 VLGCs, including eight ... owned and operated by
# BW LPG India"; Q1 cash-flow "Proceeds from sale of vessels: —" (no Q1 disposals).
#
# SUBSEQUENT EVENTS AUDITED FIRST (Q1 report "Highlights and subsequent events" + 6-Ks):
# (1) 30-May-2026 contract for EIGHT 90'cbm Panamax VLGC newbuildings, ~US$940M total,
#     deliveries early-2029 -> Q2-2030 (6-K acc 0001213900-26-063117). POST-quarter (the
#     ASC/HAFN/TRMD subsequent-event pattern, 4th instance): NOT in this snapshot — no
#     commitment, no advance, no hull at 3/31/2026. Wire on-curve §9.6 at the Q2 refresh.
# (2) 3-Jun-2026 exit of the 8.50% Confidence Petroleum India equity stake (6-K acc
#     0001213900-26-064435) — post-quarter; the stake stays at its 3/31 FVOCI/FVPL marks.
#
# SCOPE = 39 hulls economically owned at 2026-03-31:
#   - 28 parent-OWNED VLGCs (20-F "Owned" table, Total: 28 vessels);
#   - 3 lease-FINANCED bareboat hulls (BW Capella, BW Polaris, BW Kyoto — 20-F fn "(1)
#     Financed via lease financing agreements": the financing sits INSIDE borrowings
#     ("Lease financing arrangement" line, borrowings Note) — the Dorian-Japanese-financing
#     pattern; hulls belong in NAV, their debt is in total_debt, NOT lease_liabilities);
#   - 8 BW LPG INDIA-owned VLGCs (20-F India fleet table; BW LPG India Pte. Ltd. is a
#     CONSOLIDATED 52%-owned subsidiary — the 48% minority is deducted via the balance
#     sheet's NCI adjustment, see bwlp_2026-Q1.yaml preferred_equity note).
# EXCLUDED: the chartered-in book (11 per the 20-F chartered table [7 VLGC + LGCs Denver/
# Helsinki/Tokyo + MGC Oceanic Moon] + Doraji Gas / Oriental King / Berge Nantong / Berge
# Ningbo operating charters) — not owned; their capitalized leases are the balance sheet's
# "Right-of-use assets (vessels)" / lease liabilities, handled per the CMDB/SBLK convention.
#
# age = 2026 − year built. dwt NOT NAV-moving for VLGC (flat class, §11.10); nominal
# 55,000 for ~84k cbm hulls, 59,000 for the 91-93k cbm hulls; cbm cited per hull.
# scrubber = the 20-F propulsion column says "Scrubber"; LPG dual-fuel ("DF") and
# "Compliant fuel" hulls carry scrubber:false. Premiums are ZERO for VLGC (§11.10) —
# neither flag is value-moving. eco = built post-2014 (METHODOLOGY §3.1; no issuer column).
# charter_status: per-vessel employment is NOT disclosed; parent hulls carry spot (Q1 TC
# coverage was 53% of available days — captured in spot_coverage_pct, not per-vessel);
# India hulls carry time_charter (Q1 report: India income "mainly from fixed-rate time
# charters"). Rates/ends undisclosed per-vessel -> null.
