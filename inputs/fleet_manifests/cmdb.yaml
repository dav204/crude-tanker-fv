# Costamare Bulkers Holdings (NYSE:CMDB) fleet manifest — METHODOLOGY §4.1 + §11.7.1
# Source: FY2025 20-F (filed 2026-03-30, accession 0001140361-26-011994) per-vessel
# fleet table (as of 2026-03-16) + Q1 2026 6-K (filed 2026-05-13, accession
# 0001171843-26-003334) for quarter-end adjustments.
#
# Quarter-end convention (Mar-31 2026): 29 owned vessels.
#   - Miracle (2011 Capesize 180,643 dwt) EXCLUDED — sale concluded in Q1
#     (gain in Q1 income statement). Clara (Supramax) also sold in Q1,
#     pre-dates the 20-F table.
#   - Astros (ex. Koushun, 2018 Ultramax 60,297 dwt) EXCLUDED — only an
#     advance was paid in Q1; purchase concluded Q2 (in fleet at the Q2
#     refresh). Aggregate fleet thereafter: 30 per the May-13 PR.
#   - The 20-vessel CBI chartered-in trading platform (2 Cape + 18 Kamsarmax,
#     third-party owned; trading book majority transferred to Cargill) is
#     NOT in this manifest — not owned, no NAV claim. Its charter-hire cost
#     ($46.0M in Q1) and revenue live in the P&L, not the asset base.
#
# Class mapping per §11.7.1: Capesize → Cape; Kamsarmax → Pana;
# Ultramax + Supramax → Supra-Ultra. CMDB has NO Newcastlemax or Panamax(75k).
#
# Scrubbers: 20-F states 8 of the owned fleet are scrubber-fitted but does
# not identify which. ALL marked false here — understates NAV by ~8 × $1.5-2M
# ≈ $12-16M (~2% of fleet value, ~$0.55/sh). REVIEW if per-vessel scrubber
# detail surfaces. Eco per §3.1: built ≥ 2014 (7 of 29).
#
# Charter status: majority on INDEX-LINKED period charters (= spot economics,
# same convention as GNK's BCI-linked capes); several converted to fixed "for
# a certain period" (rates undisclosed). All marked spot — no disclosed rates
# to enter. spot_coverage reflects the index-linked share.
