# Teekay Tankers (TNK) fleet manifest — METHODOLOGY.md section 4.1
# Source: TNK Q1 2026 ER (fleet table as of 2026-05-13) + fleet page sample.
# Authoritative OWNED class totals (Q1 ER "About" + fleet table): 14 Suezmax,
# 18 Aframax/LR2, 1 VLCC = 33 owned (+3 chartered-in tankers + 2 STS/bunker,
# all EXCLUDED — operating leases, ROU asset ≈ lease liability, net ~0).
#
# The public fleet page renders only ~10 vessels (JS-paginated), so — as with FRO
# — this manifest is built as representative GROUPS (count = sister vessels) that
# match the report's authoritative class totals and the known age/yard mix from
# the fleet sample (Suezmax 2010-13 Samsung/Rongsheng; Aframax 2009-10 Hudong
# Zhonghua + 2016 acquisitions; VLCC 2013 Waigaoqiao/SWS; LR2 2012 Hyundai) and
# the Q1 fleet-renewal transactions. Ages/yards on the un-sampled hulls are
# APPROXIMATE — flagged; the headline NAV carries a wider band than usual here.
#
# LR2 modeled as Aframax-equivalent (crude/dirty proxy) for v1, consistent with
# FRO; TNK's "Aframax/LR2" trade both clean and dirty.
# SUBSEQUENT EVENTS (post 2026-03-31, NOT in this snapshot): 2 Korean Suezmax
# resale newbuilds agreed Apr'26 ($190M, deliver 2027); 2013 VLCC agreed-sold for
# $84.5M (closes Jun'26) — kept here at report-date market value (≈ sale price).
