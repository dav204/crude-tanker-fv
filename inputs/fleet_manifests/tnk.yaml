# Teekay Tankers (TNK) fleet manifest — METHODOLOGY.md section 4.1
# Source: TNK Q2 2026 ER 6-K (acc 0001419945-26-000054, filed 2026-07-29; fleet table
# dated 2026-07-28). REPORT-DAY REFRESH 2026-07-31, snapshot AS-OF 2026-06-30.
# Authoritative OWNED totals: 14 Suezmax + 18 Aframax/LR2 on the water = 32, PLUS
# 2 Suezmax newbuilds (2027 delivery, §9.6 on-curve) = 34 owned. The 1 VLCC is HELD
# FOR SALE at 6/30 → OFF-CURVE (in working_capital_net at the contracted $84.5M;
# sale CLOSED July 2026, $22.9M Q3 gain). 3 chartered-in tankers + 2 STS/bunker
# EXCLUDED (operating leases, ROU ≈ lease liability, net ~0).
# DATE-BASIS NOTE: the prior (Q1) manifest carried a 2026-05-13 fleet table on a
# 2026-03-31 balance sheet — the SB-class date mix. RESOLVED here: the 7/28 fleet
# table and the 6/30 balance sheet agree (no Suezmax transactions between 6/30 and
# 7/28), so this snapshot is internally date-consistent.
#
# The public fleet page renders only ~10 vessels (JS-paginated), so — as with FRO
# — this manifest is built as representative GROUPS (count = sister vessels) that
# match the report's authoritative class totals and the known age/yard mix from
# the fleet sample (Suezmax 2010-13 Samsung/Rongsheng; Aframax 2009-10 Hudong
# Zhonghua + 2016 acquisitions; VLCC 2013 Waigaoqiao/SWS; LR2 2012 Hyundai) and
# the Q1 fleet-renewal transactions. Ages/yards on the un-sampled hulls are
# APPROXIMATE — flagged; the headline NAV carries a wider band than usual here.
#
# LR2 modeled as Aframax-equivalent (crude/dirty proxy) for v1, consistent with
# FRO; TNK's "Aframax/LR2" trade both clean and dirty.
# SUBSEQUENT EVENTS (post 2026-06-30, NOT in this snapshot — audited first):
#   · VLCC sale CLOSED July 2026 ($84.5M, $22.9M Q3 gain) — the vessel IS in the 6/30
#     snapshot as held-for-sale (off-curve, in WC at the contracted price).
#   · The last 2 of the 3 Jan-2026 Aframaxes were REDELIVERED from bareboat-out in July
#     (one redelivered May, in-quarter) — ownership unchanged throughout; bareboat-out is
#     an income structure, not an ownership question, so all 3 stay on the curve.
#   · Q2 dividend $0.25/sh declared with the release (payable 8/21) — post-quarter.
#   · NO post-6/30 newbuild orders, purchases, or financings.
