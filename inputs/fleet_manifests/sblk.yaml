# Star Bulk Carriers (NASDAQ:SBLK) fleet manifest — METHODOLOGY.md §4.1 + §11.7.1
# Source: Q1 2026 6-K press release (ex99-1.htm, filed 2026-05-20, accession
# 0000950157-26-000639) + 2025 20-F (filed 2026-03-19, accession 0000950157-26-000397).
#
# Fleet shape (as of May 20 2026 fully-delivered basis): 141 vessels enumerated by
# Star Bulk's press release; this manifest captures 135 operating-fleet vessels
# (the operating-at-quarter-end set as Q1 2026 reporting). 8 newbuildings on order
# (all 82,000 dwt Kamsarmax, Qingdao + Hengli, Apr-Sep 2026 delivery) are NOT in
# this list — they're balance-sheet items per METHODOLOGY §3.1/§9.6 (delivered
# market value less remaining commitment), captured in inputs/balance_sheets/
# sblk_2026-Q1.yaml under newbuild_capex_commitments + newbuild_advances_paid.
#
# Class mapping per METHODOLOGY §11.7.1 (collapses Pareto's 6 sub-classes into 3):
#   Newcastlemax + Capesize           (≥170k dwt) → Cape
#   Post-Panamax + Kamsarmax          (75-170k)   → Pana
#   Ultramax + Supramax               (<75k)      → Supra-Ultra
#
# Eco definition per METHODOLOGY §3.1: year_built ≥ 2014.
# Scrubber per press release: 97% of fully-delivered basis (141 fleet) is fitted
# with EGCS — so ~4 vessels of 141 (≤3% of operating) are non-scrubber. Press
# release does NOT identify them per-vessel; 20-F vessel table does not break out
# scrubber column either. DEFAULT scrubber=true here; the ~4 non-scrubber vessels
# are likely the oldest Supra-Ultra pre-2014 builds. **REVIEW NEEDED**: refine by
# class-level scrubber-fitting disclosure when available. Impact on NAV from this
# approximation: ~$8-12M (4 vessels × ~$2.5M scrubber premium) on ~$2.5B NAV → <0.5%.
#
# Charter status: default 'spot' — SBLK is a spot-heavy operator (Q1 2026 disclosed
# spot exposure was the dominant share; no per-vessel TC disclosure in the Q1 6-K.
# **REVIEW NEEDED**: refine per-vessel TC vs spot from 20-F Item 4 (Property,
# Plant & Equipment) or the next 6-K with per-vessel charter table.
#
