# 2026 sale of 2 oldest hulls), plus public disclosures (Splash247 / Nasdaq).
# NAT's fleet pages render dynamically — per-vessel ages/yards constructed from
# known transaction history (2003-2017 builds, almost entirely Korean yards;
# Samsung / Hyundai / Sungdong are NAT's house yards).
#
# RECENT TRANSACTIONS (already reflected here):
#   + Mar/Apr 2025: acquired 2x 2016-built Sungdong Suezmaxes (modern, age 10)
#   - Jan 2026:    SOLD 2x oldest (2004 + 2005 built) for $50M total ($25M avg
#                  at age 21-22) -- great old-Suezmax DISPOSAL validation
#                  (my curve gives ~$28.6M avg at age 21.5 -> ~14% high; within
#                  the band but worth noting for later Suezmax recalibration).
#
# SUBSEQUENT EVENTS (NOT in the snapshot):
#   - 2 Suezmax newbuilds (S. Korean yard) firm-contracted Jan 2026, deliver 2028.
#     Each ~$85M -> ~$170M total commitment; modeled as newbuild_capex_commitments
#     in the balance sheet (small advance paid).
