# Genco Shipping & Trading (NYSE:GNK) fleet manifest — METHODOLOGY §4.1 + §11.7.1
# Source: Q1 2026 10-Q (filed 2026-05-06, accession 0001104659-26-056337):
# fleet note ("44 drybulk vessels ... 2 Newcastlemax, 17 Capesize, 15 Ultramax,
# 10 Supramax ... ~4,990,000 dwt ... average age ~12.7 years" at Mar 31 2026)
# + the per-vessel employment table at pages 33-34 (as of May 5, 2026).
#
# Quarter-end convention (CLAUDE.md: trust the report at quarter-end): manifest
# carries the Mar-31 fleet of 44, INCLUDING Genco Predator (2005 Supramax,
# held-for-sale at Mar-31, sale completed Apr 15 2026 at $10.6M less 3%
# commission). The held-for-sale carrying value ($8,585k) is EXCLUDED from
# working_capital_net in the balance sheet to avoid double-counting.
# The 2019-built Capesize agreed Apr 16 2026 ($65.0M, June 2026 delivery) is a
# SUBSEQUENT event — not in this manifest, no commitment existed at Mar-31.
#
# Class mapping per §11.7.1: Newcastlemax + Capesize → Cape;
# Ultramax + Supramax → Supra-Ultra. GNK has NO Pana-class exposure.
#
# Scrubber: all 19 Cape-class fitted (GNK 2019-20 major-bulk scrubber program;
# nmaxes + Courageous explicitly "scrubber-fitted" in Note 5). Minor bulk
# (Supra-Ultra): not scrubber-fitted.
# Eco per §3.1: year_built ≥ 2014.
# Per-vessel dwt approximated from class norms (10-Q gives aggregate 4.99M dwt
# only; sum below ≈ 4.96M). Valuation uses class + age; dwt is informational.
# Charter detail from the May-5 employment table: fixed TCs entered with rate +
# earliest expiration; index-linked (% of BCI) marked spot (spot economics).
