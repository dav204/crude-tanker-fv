# CAPT (Capital Tankers) fleet manifest — METHODOLOGY.md section 4.1
# Oslo-listed Mar-17-2026 (~75% Marinakis). 30 firm vessels at Q1-2026:
# 9 on-water at Mar-31 + 21 newbuildings delivering through mid-2028.
# Sources: Pareto initiation 2026-04-19 + quarterly review 2026-05-27
# (both archived in inputs/research_pareto_other/linked/) + Shipping Daily
# mentions (outputs/pareto_mentions_capt.md): Mar-16 "delivery of two
# suezmaxes and one aframax earlier this month"; Apr-15 "exit April with
# 11x vessels — 17x by Nov'26, 24x by YE'27, 30x by mid-28, ahead of
# schedule". Class table (review): VLCC 12x 310k / Suezmax 10x 156k /
# Aframax 4x 113k avg age 7.8 / LR2 4x 114k avg age 0.5.
#
# NEWBUILD CONVENTION (§3.1 / §9.6, FRO precedent): NBs carried at age-0
# DELIVERED market value in this manifest; the $1,880M remaining capex
# commitment (Q1'26) sits in the balance sheet. They earn in the strip
# via fleet_schedule, not the static counts. The 13 options at cost
# (11 VLCC + 2 Suez, lapse YE'26) are EXCLUDED from NAV entirely —
# Pareto adds ~$204M option value; we do not value optionality.
# All vessels scrubber-fitted and/or LNG dual-fuel ("future-proof");
# our curves carry no DF premium (Pareto adds $14-18M/vessel; their
# no-LNG NAV is NOK 138 vs headline 158 at initiation — see capt_log).
ticker: CAPT
report_date: 2026-Q1
vessels:
  # ---- VLCC: years_to_delivery (§9.6) from the Q1-release per-vessel dates,
  #      measured from the Mar-31-2026 snapshot. Aristotelis II delivered
  #      Feb-10-2026 (pre-snapshot → on the water, ytd 0); the rest deliver
  #      Apr'27 (Alexandros) → Jun'28 (Aktor). 7 in 2027 (avg ~1.25yr), 4 in 2028
  #      (Amyntas Jan / Arkesios Feb / Atromitos Apr / Aktor Jun → avg ~2.0yr).
  - {id: VLCC_deliv,   class: VLCC, dwt: 310000, age: 0, scrubber: true, eco: true, count: 1, years_to_delivery: 0.0}
  # Scrubber split (verified 2026-06-30 vs Pareto initiation 2026-04-20 per-vessel ledger +
  # Euronext Information Doc §7.3.2 + Q1 release): CAPT is 18/30 scrubber-fitted (~60%), NOT all.
  # Of the 11 VLCC NBs: 5 scrubber-fitted (Alterego/Alexandros/Apollonas + Arkesios/Aktor),
  # 6 LNG-dual-fuel WITHOUT scrubber. The LNG-only vessels carry NO fabricated scrubber premium.
  - {id: VLCC_nb_2027,     class: VLCC, dwt: 310000, age: 0, scrubber: true,  eco: true, count: 3, years_to_delivery: 1.25}   # scrubber-fitted
  - {id: VLCC_nb_2027_lng, class: VLCC, dwt: 310000, age: 0, scrubber: false, eco: true, count: 4, years_to_delivery: 1.25}   # LNG dual-fuel, no scrubber
  - {id: VLCC_nb_2028,     class: VLCC, dwt: 310000, age: 0, scrubber: true,  eco: true, count: 2, years_to_delivery: 2.0}    # scrubber-fitted
  - {id: VLCC_nb_2028_lng, class: VLCC, dwt: 310000, age: 0, scrubber: false, eco: true, count: 2, years_to_delivery: 2.0}    # LNG dual-fuel, no scrubber
  # ---- Suezmax: 2 delivered by Mar-31 (Alkinoos/Archigos Mar-5, on-water). The
  #      8 NB (Q1-release dates from Mar-31): 6 near-term — Ataraktos/Aristoklis
  #      Apr-14 (~0.05), Archelaos Jun-08 (0.19), Aristodimos Aug-21 (0.39),
  #      Ayrton Oct-08 (0.52), Amor Nov-18 (0.63), avg ~0.3 — and 2 in 2028
  #      (Akeraios Feb-16 / Alkaios Mar-09, ~1.9).
  - {id: SUEZ_2026,     class: Suezmax, dwt: 156000, age: 0, scrubber: true, eco: true, count: 2}
  - {id: SUEZ_nb_2026,  class: Suezmax, dwt: 156000, age: 0, scrubber: true, eco: true, count: 6, years_to_delivery: 0.3}
  - {id: SUEZ_nb_2028,  class: Suezmax, dwt: 156000, age: 0, scrubber: true, eco: true, count: 2, years_to_delivery: 1.9}
  # ---- Aframax: all 4 are 2018-2019 HD Hyundai Samho sisters, delivered (on the
  #      water), Dual-Fuel-LNG-capable but NOT scrubber-fitted. Sources: issuer Q1
  #      release sailing-fleet table p6 (Alimedon Jul-18 / Andreios Oct-18 / Areios
  #      Nov-18 / Ameinon Apr-19) + Pareto initiation per-vessel table (Scrubber=No
  #      all four). The p5 fleet note "five scrubber-fitted, four LNG dual-fuel" —
  #      the four DF-only are exactly these Aframax. Mean age 7.4 as of the
  #      Mar-31-2026 snapshot; the curve is linear over [5,10] so one count-4 cohort
  #      at 7.4 reproduces the exact aggregate. years_to_delivery 0 (all delivered).
  #      Corrected 2026-06-30: the prior 3x age-10 + 1x age-0 "fresh Mar-2026
  #      delivery" split was wrong — there is no 2026-built Aframax. (Pareto review
  #      class-table cited avg 7.8; the issuer per-vessel build dates give 7.4.)
  - {id: AFRA_2018, class: Aframax, dwt: 113000, age: 7.4, scrubber: false, eco: true, count: 4, years_to_delivery: 0.0}
  # ---- LR2 (crude-routed, same as FRO's LR2 book): class avg 0.5.
  - {id: LR2_2025,  class: LR2,     dwt: 114000, age: 1,  scrubber: true,  eco: true, count: 2}   # Aisopos, Aiolos — scrubber-fitted (ledger Yes)
  - {id: LR2_2026,  class: LR2,     dwt: 114000, age: 0,  scrubber: false, eco: true, count: 2}   # Androklos, Athinagoras — LNG-only, no scrubber (ledger No)

# All-spot (Q1 fleet-wide TCE $162k/day on spot voyages; Q2 fixtures are
# spot-period fixings, no disclosed TC book).
spot_coverage_pct:
  VLCC: 1.0
  Suezmax: 1.0
  Aframax: 1.0
  LR2: 1.0

# On-water count ramp for the strip (8 quarters, q3_2026 -> q2_2028),
# anchored to Pareto-confirmed waypoints: 11 end-Apr-26, 17 by Nov-26,
# 24 by YE-27, 30 by mid-28 ("one delivery every ~six weeks"). VLCC
# back-loaded (class avg own-years -1.3), Suezmax front-loaded (-0.3);
# the per-class split between the waypoints is our estimate.
fleet_schedule:
  VLCC:    [1, 3, 4, 5, 5, 6, 8, 10]
  Suezmax: [4, 6, 7, 8, 9, 10, 10, 10]
  Aframax: [4, 4, 4, 4, 4, 4, 4, 4]
  LR2:     [4, 4, 4, 4, 4, 4, 4, 4]

fleet_summary:
  VLCC_count: 12
  Suezmax_count: 10
  Aframax_count: 4
  LR2_count: 4
  on_water_at_quarter_end: 9
  newbuilds_committed: 21      # $1,880M remaining commitment (Q1'26)
  options_excluded: 13         # 11 VLCC + 2 Suez at cost, lapse YE'26 — NOT in NAV
  avg_age: 0.0
