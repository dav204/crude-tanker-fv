# CAPT (Capital Tankers) fleet manifest — METHODOLOGY.md section 4.1
# Q2-2026 REFRESH 2026-09-01 (issuer Q2 results release, BS 2026-06-30; per-vessel
# sailing + under-construction + CAPEX tables pp.6-9 — the first FULL per-vessel
# delivery schedule; the Q1 Pareto-waypoint ramp is retired). 33 firm vessels:
# 15 VLCC / 10 Suezmax / 4 Aframax / 4 LR2 = 13 ON-WATER at 6/30 + 20 newbuildings.
# Q2 deliveries (7, all named+dated): Ataraktos + Aristoklis (Suez, Apr-14),
# Ameinon (Apr-8) + Areios (Apr-15) + Andreios (Apr-16) (Aframax — MOA hulls, no
# debt at 6/30), Androklos (LR2, May-21), Archelaos (Suez, Jun-8). SUBSEQUENT
# (out of this snapshot): Athinagoras (LR2, 8/06) + Aristodimos (Suez, 8/13).
# THE JUNE-15 ACQUISITION (prereg ambiguity RESOLVED): three NEW Hengli VLCC
# shipbuilding contracts from Capital Maritime (Aspidoforos / Armonikos /
# Aftarkis, deliveries Oct-27-2027, $85.4M remaining each) — NB rows below,
# scrubber=false UNVERIFIED-conservative (no equipment disclosure for the trio;
# newbuild_specs.yaml updated same commit).
#
# NEWBUILD CONVENTION (§3.1/§9.6, FRO precedent): NBs at age-0 DELIVERED market;
# the $1,806.6M remaining commitment (6/30 schedule) sits in the balance sheet;
# they earn in the strip via fleet_schedule. The 13 options (11 VLCC + 2 Suez,
# exercisable at contract price to 12/31/2026; issuer appraisals 8/18: $253.7M
# in the money) stay EXCLUDED from NAV — we do not value optionality (the
# k_broker spread driver, now issuer-quantified).
# Scrubber ledger cross-foot (release p.2): 9 of the 15 SAILING are scrubber-
# fitted = Aristotelis II + 6 Suez (incl. subsequent Aristodimos) + Aisopos +
# Aiolos — ties the rows below exactly (8 on-water at 6/30 + Aristodimos).
