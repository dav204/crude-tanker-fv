# DHT Holdings fleet manifest — METHODOLOGY.md section 4.1
# Source: https://www.dhtankers.com/fleetlist/ cross-checked against the
# Q1 2026 results (press release, May 5 2026; balance sheet as of 2026-03-31).
#
# Scope = the 22 RETAINED OPERATING VLCCs as of 2026-03-31. Two website fleet
# entries are deliberately excluded here and handled via the balance sheet:
#   - DHT Impala (2026 newbuild): still under construction at 2026-03-31
#     (delivered June 2026) -> enters NAV via newbuild capex/advances lines.
#   - DHT Bauhinia (2007): held for sale at an agreed $51.5M (delivery Jun/Jul
#     2026) -> entered in NAV via working_capital_net at its sale price, not
#     the age curve (the curve over-values a 19yo VLCC vs. the agreed price).
#
# age = 2026 - year built. eco = built post-2014 (METHODOLOGY 3.1 definition).
# scrubber: DHT's fleet is 100% scrubber-fitted (confirmed) -> all true.
