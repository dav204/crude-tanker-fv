# Frontline plc fleet manifest — METHODOLOGY.md section 4.1
# Source: FRO Q1 2026 results (fleet as of 2026-03-31: 33 VLCC + 21 Suezmax +
# 18 LR2 = 72 vessels, ALL ECO, 46 scrubber-fitted, avg age 7.5y) cross-checked
# against the fleet page. The website table is a later snapshot and disagreed
# with the report counts, so this manifest is built as representative GROUPS
# (count = sister vessels) matching the report's authoritative class counts and
# the known yard/age/scrubber mix. eco=true fleet-wide (per the report).
#
# LR2 sleeve is modeled as Aframax-equivalent (crude/dirty proxy) for v1.
# yard drives the yard-quality discount (see vessel_value_curves.yaml).
ticker: FRO
report_date: 2026-Q1
vessels:
  # ---- VLCC (33 on-water at 2026-03-31; the 9 Hemen newbuilds are in the
  #      balance-sheet newbuild lines, and ramp into the strip via fleet_schedule) ----
  - {id: VLCC_2016_kr, class: VLCC, dwt: 300000, age: 10, scrubber: true,  eco: true, yard: Hyundai,       count: 3}
  - {id: VLCC_2017_subic, class: VLCC, dwt: 300000, age: 9, scrubber: false, eco: true, yard: Hanjin Subic, count: 2}
  - {id: VLCC_2017_kr_ns, class: VLCC, dwt: 300000, age: 9, scrubber: false, eco: true, yard: Hyundai,      count: 3}
  - {id: VLCC_2017_kr_s,  class: VLCC, dwt: 300000, age: 9, scrubber: true,  eco: true, yard: Hyundai,      count: 3}
  - {id: VLCC_2018_kr,    class: VLCC, dwt: 300000, age: 8, scrubber: true,  eco: true, yard: DSME,         count: 2}
  - {id: VLCC_2019_kr,    class: VLCC, dwt: 300000, age: 7, scrubber: true,  eco: true, yard: HHI,
     charter_status: time_charter, charter_rate: 85000, count: 5}
  - {id: VLCC_2020_kr,    class: VLCC, dwt: 300000, age: 6, scrubber: true,  eco: true, yard: HSHI,         count: 2}
  - {id: VLCC_2021_kr,    class: VLCC, dwt: 300000, age: 5, scrubber: true,  eco: true, yard: Daewoo,       count: 4}
  - {id: VLCC_2022_kr,    class: VLCC, dwt: 300000, age: 4, scrubber: true,  eco: true, yard: HHI,          count: 4}
  - {id: VLCC_2023_kr,    class: VLCC, dwt: 300000, age: 3, scrubber: true,  eco: true, yard: HSHI,         count: 5}
  # ---- 9 Hemen VLCC newbuilds (under construction at 2026-03-31), valued at
  #      DELIVERED market value (age 0) less the remaining commitment handled in
  #      the balance sheet. Resolves open decision 9.6 toward market for material
  #      orderbooks: at cost they would understate NAV by the embedded value of
  #      these cheaply-contracted ships in a hot market (~$5.7/sh). Hengli/Dalian
  #      = modern top-tier Chinese (5% yard discount). They earn in the strip via
  #      the fleet_schedule ramp, not from the static manifest count.
  # years_to_delivery (§9.6) from the Mar-31 snapshot: the 9 Hemen NBs deliver
  # Apr'26 → Q1'27 (per the fleet_schedule note) — all near-term, so the PV
  # discount is small (~2-6%). Hengli earlier (avg ~0.35yr), Dalian later (~0.6).
  - {id: VLCC_nb_hengli,  class: VLCC, dwt: 306000, age: 0, scrubber: true,  eco: true, yard: Hengli,       count: 6, years_to_delivery: 0.35}
  - {id: VLCC_nb_dalian,  class: VLCC, dwt: 300000, age: 0, scrubber: true,  eco: true, yard: Dalian,       count: 3, years_to_delivery: 0.6}
  # ---- Suezmax (21 at 2026-03-31; 2 oldest Chinese sold April 2026 -> strip uses 19) ----
  - {id: SMX_2019_kr,     class: Suezmax, dwt: 157000, age: 7,  scrubber: true,  eco: true, yard: HSHI,
     charter_status: time_charter, charter_rate: 60000, count: 11}
  - {id: SMX_2016_nt,     class: Suezmax, dwt: 157000, age: 9,  scrubber: false, eco: true, yard: New Times, count: 8}
  - {id: SMX_2015_rs,     class: Suezmax, dwt: 157000, age: 11, scrubber: true,  eco: true, yard: Rongsheng, count: 1}
  - {id: SMX_2014_nt,     class: Suezmax, dwt: 157000, age: 12, scrubber: false, eco: true, yard: New Times, count: 1}
  # ---- LR2 / Aframax (18, all Chinese-built; modeled as Aframax) ----
  - {id: LR2_2021_sws,    class: LR2, dwt: 110000, age: 5,  scrubber: true,  eco: true, yard: SWS,
     charter_status: time_charter, charter_rate: 55000, count: 4}
  - {id: LR2_2017_nt,     class: LR2, dwt: 110000, age: 8,  scrubber: false, eco: true, yard: New Times, count: 8}
  - {id: LR2_2016_cosco,  class: LR2, dwt: 110000, age: 10, scrubber: false, eco: true, yard: Cosco,     count: 4}
  - {id: LR2_2016_lx,     class: LR2, dwt: 110000, age: 10, scrubber: false, eco: true, yard: Longxue,   count: 2}
spot_coverage_pct:
  VLCC: 0.70      # ~30% on >12mo TC coverage (Q1 call)
  Suezmax: 0.90
  LR2: 0.90
# Earning fleet over the 8-quarter strip (Q3'26..Q2'28). VLCC ramps as the 9
# Hemen newbuilds deliver (Apr'26: +1, May: +1, late-Jun: +2, Q3: +2, Q4: +2,
# Q1'27: +1 -> 42); Suezmax drops to 19 (2 sold Apr'26); LR2 flat at 18.
# NAV stays anchored to the 2026-03-31 counts (33/21/18); the newbuild balance-
# sheet lines handle the cash side.
fleet_schedule:
  VLCC:    [38, 40, 41.5, 42, 42, 42, 42, 42]
  Suezmax: [19, 19, 19, 19, 19, 19, 19, 19]
  LR2:     [18, 18, 18, 18, 18, 18, 18, 18]
fleet_summary:
  VLCC_count: 33
  Suezmax_count: 21
  LR2_count: 18
  vlcc_newbuilds_committed: 9     # Hemen, $925M remaining commitment
  avg_age: 7.5
