# (acc 0001193125-26-330964, release 7/29, filed 8/4): fleet-update sections + the
# under-construction census ("seven latest-generation LNG/Cs, four MG/Cs and two HMG/Cs
# and one LNGB/V (50%)" as of the 7/29 release; at 6/30 add back Aridaios -> 5 MG/C).
# Q2 DELIVERIES into the water: LNG/C Archimidis 6/2 + Agamemnon 6/17 (JOLCO-financed),
# HMG/C Amadeus 4/30, MG/C Aristogenis 6/4 (45,000 CBM dual-fuel). POST-6/30 (stay NB
# rows): MG/C Aridaios 7/23, LNG/C Alcaios I ~7/31 (18-mo index-linked TC secured).
# CENSUS CORRECTION vs the Q1 manifest: the gas program carries FOUR HMG/Cs total
# (Active, Amadeus + TWO still under construction per the release census) — Q1's
# "8 gas NBs = 2 LCO2 + 6 MGC" undercounted by one HMG/C hull; corrected here on the
# issuer census, flagged for the next full reconciliation.
# Amore Mio I: 49% JV divestment AGREED (closes Q1-2027, $230M to the JV; 10-yr BGN
# TC + 2×3yr options commences at acquisition) — still 100% consolidated at 6/30.
# The LNGB/V (50% JV, CIMC SOE, $82.8M, del. Q3-2028) is NOT a manifest row (no
# bunkering class/curve) while its $41.4M commitment share IS on the balance sheet —
# deliberate conservative omission ~−0.7% NAV, disclosed both sides of the pair.
# Group-B structural convention: under-construction hulls at delivered market value
# (no §9.6 PV path), commitments net on the balance sheet.
# Ages = 2026.5 − built (fractional; uniform shift from the Q1 integer basis is part
# of this snapshot advance, report_date bumped WITH it).
