# Safe Bulkers Inc. (NYSE: SB) fleet manifest — METHODOLOGY §4.1, §11.7
# Source: Q1-2026 6-K (SEC CIK 1434754, acc 0001317861-26-000033) balance-sheet date 2026-03-31
# + FY2025 20-F (acc 0001628280-26-014408). 4th dry-bulk validator. Onboarded 2026-06-27.
# DATE-CONSISTENCY CORRECTION 2026-07-01: the whole manifest is now the 2026-03-31 snapshot (was
# mixing the 2026-06-12 fleet status with the 3/31 balance sheet). See sb_reconciliation_prereg_2026-07-01.md.
#
# SCOPE at 2026-03-31 = 44 OWNED on-curve operating vessels + 1 held-for-sale (Michalis H, 2012
# Capesize) OFF-curve at the $30.2M assets-held-for-sale carrying value in working_capital_net
# (DHT-Bauhinia convention). 6-K line 398: "As of March 31, 2026 … 45 vessels, one of which was
# held for sale, and an orderbook of eight newbuilds." The 1 chartered-in Panamax (Arethousa) is
# EXCLUDED (not owned). 7 "bareboat leaseback" vessels are OWNED (finance leases — hull on the
# books, liability in total_debt; ECO convention).
#   - Katerina (delivered April 2026) is a NEWBUILD at 3/31 (in the 8-NB orderbook), NOT operating.
#   - Xenia (2006 PPMX) + Pedhoulas Commander (2008 Kamsarmax) are OPERATING at 3/31 (their sales
#     were only agreed May 2026, subsequent — 6-K line 295).
#
# SCRUBBERS = the 20-F ACTUAL set (acc 0001628280-26-014408): "Scrubbers on 21 of our vessels,
# incl. all Capesize" → 20 operating at 3/31 (Michalis H, a scrubber Cape, is HFS). All 7 operating
# Capes + 13 non-Cape (12 Post-Panamax + 1 Kamsarmax=Pedhoulas Rose), identified by the 20-F fleet
# table footnote (15)/(16) "Scrubber benefit" (matches the disclosed aggregate exactly). Corrects
# the prior blanket scrubber default (all 16 PPMX + 6 wrong Kamsarmax) — the peer-borrowed-flag bug.
#
# CLASS MAPPING (§11.7.1): Panamax + Kamsarmax (75-84k) → "Pana" (dwt-scaled off 82k); Capesize →
# "Cape"; Post-Panamax (85-95.8k) → own "Post-Panamax" class (§11.7.10), FLAT curve.
# Ages = 2026.25 − built. eco = built ≥ 2015.

