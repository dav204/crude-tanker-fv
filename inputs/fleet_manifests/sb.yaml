# Safe Bulkers Inc. (NYSE: SB) fleet manifest — METHODOLOGY §4.1, §11.7
# Source: Q1-2026 6-K (SEC CIK 1434754, filed 2026-06-17; fleet status 2026-06-12,
# balance-sheet date 2026-03-31) + FY2025 20-F. 4th dry-bulk validator.
# Onboarded 2026-06-27.
#
# SCOPE = the 43 OWNED on-curve vessels (45 owned − 2 held-for-sale). The 2 HFS
# (Pedhoulas Commander 2008 Kamsarmax + Xenia 2006 Post-Panamax) are OFF-curve at
# the $30.2M assets-held-for-sale carrying value in working_capital_net (DHT-Bauhinia
# convention). The 1 chartered-in Panamax (Arethousa) is EXCLUDED (not owned).
# 7 "bareboat leaseback" vessels are OWNED (finance leases — vessel on the books,
# liability in total_debt; ECO convention, do NOT also drop the hull).
#
# CLASS MAPPING (§11.7.1 collapse): Panamax + Kamsarmax + Post-Panamax → "Pana";
# Capesize → "Cape". dwt is LOAD-BEARING (the dry-bulk curves are dwt-scaled, §11.7.10):
# value scales by dwt/baseline. ⚠ SB has 6 large Post-Panamax at 92-95.8k (Andreas K,
# Agios Spyridonas, Venus Heritage/History/Horizon/Harmony) that scale ~1.12-1.17× off
# the 82k Pana baseline — the documented §11.7.10 Post-Panamax over-valuation risk; SB
# exercises it more than any name. Flagged in decisions/sb_log.md; refine via a
# Post-Panamax sub-class if it proves material at reconcile.
# Ages = 2026.25 − built. eco = built ≥ 2015.

