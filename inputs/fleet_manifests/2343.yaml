# page. RESIDUAL RISK (documented): offsetting intra-H1-26 add+disposal pairs cannot be
# excluded from public sources — re-verify the set at the Interim (F-1 re-test window).
# Subsequent-events note audited FIRST (AR Note 27, p.118): Caravel shareholder agreement
# 16-Feb-2026 only — NO fleet/balance-sheet events.
#
# SCRUBBERS: AR2025 p.26 discloses an AGGREGATE — "Scrubbers fitted to our 35 core
# Supramax vessels" — but NO per-vessel identification exists anywhere public (fleet page
# has no scrubber column; sole AR mention). Per the cross-foot rule the flags below are
# ALL false (conservative; the CAPT blanket-flag bug in reverse is not licensed) and the
# name sits in OPERATING_SCRUBBER_QUEUE with count 35. NAV understated ~$52.5M
# (35 x $1.5M Supra-Ultra premium) = ~2.5% of NAV — inside the 10% materiality gate.
# Resolve via IR query or the Interim's ESG tables.
