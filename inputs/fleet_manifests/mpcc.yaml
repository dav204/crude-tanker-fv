# $53.5M, gain $30.4M, Note 6 — per-vessel split not repeated in the report;
# the 6/25-release prices stay in the log) -> rows removed. Ages +0.5 at the
# quarter bump; AS Selina re-aged 14.5 (2012-BUILT per report p.8 + deck p.4
# — the 18.5+bump cohort estimate was wrong; resolves the prereg §S&P anomaly:
# Selina is YOUNGER than Angelina, so $24.3M vs $16.8M is curve-consistent,
# not inverted) and AS Angelina 19.5 (2007-built, p.8; deck confirms 2,000 grd).
# Deck p.26-28 fleet-employment table read at this refresh: NO built years for
# the on-water fleet (only sold vessels + the acquisition) — the cohort-age
# refinement stays open by SOURCE limitation, not by omission. The four
# acquired Ctr-Large hulls are NAMED (AS Emilie/Elise/Eve/Estelle, 7,000 gls
# eco, $44,300/day to a top-tier liner, takeover Nov-2026) — still NO rows
# per Fork A.
#
# AGES otherwise COHORT ESTIMATES (deck discloses built years only for sold
# vessels): S-class 1,700s ~2007-08; C-class 2,800s ~2006-08; P-class 2,500s
# ~2005-09; N-class 3,500s ~2009-10; 3,800 Express ~2009-11; 5,500s 2024-built;
# NCL 1,300s 2025-built. AS Anne (eco 2,200) is the widest estimate. Full
# per-hull built-year refinement STILL OPEN — the Q2 report carries no fleet
# table; rides the next deck with built years.
#
# NEWBUILDS (CAPT §3.1 convention): 15 OWNED hulls on-curve at age 0.0 with
# their contracted charters; remaining commitments ($631.7M at 6/30, Note 7)
# subtract on the balance sheet -> net = delivered-market-less-commitment. The
# 2 Uthaldan JV 4,500s (AS Maike, AS Marthe) are EXCLUDED both sides (no JV
# asset rows, no JV commitments; JV share $23.1M, Note 5). years_to_delivery
# re-based to the 6/30 snapshot (-0.25 at the bump). AS Friederike DELIVERED
# Aug-2026 (final installment $21.5M, Note 14 — subsequent event): stays an NB
# row at this snapshot, enters on-water at the Q3 refresh.
# FORK A (owner 2026-08-13): the four acquired 7,000-TEU Ctr-Large hulls
# ($343.4M, deliveries latest Nov-2026) carry NO rows — GSL Group-B
# advances-only registry; zero advances paid at 6/30.
# Index-linked charters carry the deck's CURRENT fixture as charter_rate.
