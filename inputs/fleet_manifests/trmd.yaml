  mr_resale_newbuilds: 2          # Dehradun/Dapitan, on the §9.6 curve, Q2-2026 delivery
  newbuild_orders_q1: 2           # the 2 MR resales (the 6 MR resales are a subsequent event — post-quarter)
  operating_scrubber_count: 85    # all 22 LR2 + all 63 MR (FY2025 20-F: 85 fitted Dec-2025); 10 LR1s none
  avg_age_LR2_approx: 10.5
