# TORM plc (TRMD / NASDAQ:TRMD, also XCSE:TRMD A) fleet manifest — METHODOLOGY §4.1, §11.5
# Source: TORM Q1 2026 6-K (EDGAR acc 0000919574-26-003082, filed 2026-05-14); scrubber counts +
# fleet detail cross-checked to the FY2025 20-F (acc 0001628280-26-011954). Balance sheet date: 2026-03-31.
# Full reconciliation: decisions/trmd_reconciliation_prereg_2026-07-01.md.
#
# Scope = the 95 in-water product tankers operating at 2026-03-31:
#   - 22 LR2 (valued via LR2/Aframax-equivalent curve)
#   - 10 LR1 (Torm calls these "Handysize-LR1"; valued via LR1 curve)
#   - 63 MR  (valued via MR curve)
# PLUS 6 MR newbuild-resales on the §9.6 curve (below), deliveries Q1-2027 through 2028.
# Q2-2026 refresh (2026-08-29, 6-K acc 0001628280-26-058979 filed 8/26): fleet 95->97
# (Dehradun/Dapitan delivered); ages +0.5 per the refresh convention.
#
# Off-manifest (subsequent events, excluded from the 3/31 snapshot):
#   - 6 × MR NEWBUILDINGS ordered post-Q2 (+2 options), deliveries 2029 (options 2030) — Q2 6-K
#     subsequent-events note; enters at the H2 snapshot with its own commitment schedule
#   - $217M financing secured post-Q2 for ten vessels (subsequent event, no 6/30 debt effect)
#   - the Q3-2026 sale-leaseback purchase-option repurchases (vessels already owned in-snapshot)
# In Q1 2026 TORM took delivery of 2× 2016-built LR2 + 1× 2018-built MR (Helga/Hedwig/Fortune) and
# delivered out the 2008-built LR2 TORM Maren; those are reflected in the counts below.
#
# SCRUBBERS (corrected 2026-07-02 vs the estimated 57/70/30% — owner fork #3): the FY2025 20-F discloses
# "we successfully installed scrubbers on 85 of our vessels" (Dec-2025). 22 LR2 + 63 MR = exactly 85, so the
# whole MODERN fleet is scrubber-fitted and the 10 vintage LR1s (2012-13, age 13-14) run compliant fuel — the
# per-class split is inferred to match the disclosed aggregate (only the total 85 is disclosed).
# OPERATING_SCRUBBER_VERIFIED{TRMD:85}. The 2 MR resales are booked scrubber=FALSE (no NB-specific statement).
#
# age = 2026 - year built. eco = built post-2014 (METHODOLOGY §3.1). Pre-2014 LR1/MR cohort sits at eco:false
# on the eco-inclusive curve — small over-valuation flagged in §6 TRMD entry (same gap as ASC/STNG).
