# TORM plc (TRMD / NASDAQ:TRMD, also XCSE:TRMD A) fleet manifest — METHODOLOGY §4.1, §11.5
# Source: TORM Q1 2026 6-K (EDGAR acc 0000919574-26-003082, filed 2026-05-14); scrubber counts +
# fleet detail cross-checked to the FY2025 20-F (acc 0001628280-26-011954). Balance sheet date: 2026-03-31.
# Full reconciliation: decisions/trmd_reconciliation_prereg_2026-07-01.md.
#
# Scope = the 95 in-water product tankers operating at 2026-03-31:
#   - 22 LR2 (valued via LR2/Aframax-equivalent curve)
#   - 10 LR1 (Torm calls these "Handysize-LR1"; valued via LR1 curve)
#   - 63 MR  (valued via MR curve)
# PLUS 2 MR resales on the §9.6 curve (below) delivering Q2-2026.
#
# Off-manifest (subsequent events, excluded from the 3/31 snapshot):
#   - 6 × MR resales bought "after the end of the quarter" (Note 11), delivering 2027-2028
#   - the Q3-2026 sale-leaseback purchase-option repurchases (vessels already owned in-snapshot)
# In Q1 2026 TORM took delivery of 2× 2016-built LR2 + 1× 2018-built MR (Helga/Hedwig/Fortune) and
# delivered out the 2008-built LR2 TORM Maren; those are reflected in the counts below.
#
# SCRUBBERS (corrected 2026-07-02 vs the estimated 57/70/30% — owner fork #3): the FY2025 20-F discloses
# "we successfully installed scrubbers on 85 of our vessels" (Dec-2025). 22 LR2 + 63 MR = exactly 85, so the
# whole MODERN fleet is scrubber-fitted and the 10 vintage LR1s (2012-13, age 13-14) run compliant fuel — the
# per-class split is inferred to match the disclosed aggregate (only the total 85 is disclosed).
# OPERATING_SCRUBBER_VERIFIED{TRMD:85}. The 2 MR resales are booked scrubber=FALSE (no NB-specific statement).
#
# age = 2026 - year built. eco = built post-2014 (METHODOLOGY §3.1). Pre-2014 LR1/MR cohort sits at eco:false
# on the eco-inclusive curve — small over-valuation flagged in §6 TRMD entry (same gap as ASC/STNG).
ticker: TRMD
report_date: 2026-Q1
vessels:
  # ============================================================
  # LR2 fleet — 22 vessels; avg age 10.5. All eco; ALL scrubber-fitted.
  # ============================================================
  # ---- 2016 builds (age 10) — 2 LR2 acquired in Q1 2026, scrubber-fitted ----
  - {id: TRMD_LR2_2016, class: LR2, dwt: 110000, age: 10, scrubber: true, eco: true, charter_status: spot, count: 2}
  # ---- 2015 builds (age 11) — 8 LR2; all scrubber ----
  - {id: TRMD_LR2_2015, class: LR2, dwt: 110000, age: 11, scrubber: true, eco: true, charter_status: spot, count: 8}
  # ---- 2014 builds (age 12) — 8 LR2; all scrubber ----
  - {id: TRMD_LR2_2014, class: LR2, dwt: 110000, age: 12, scrubber: true, eco: true, charter_status: spot, count: 8}
  # ---- 2017 builds (age 9) — 4 LR2; all scrubber ----
  - {id: TRMD_LR2_2017, class: LR2, dwt: 110000, age: 9,  scrubber: true, eco: true, charter_status: spot, count: 4}

  # ============================================================
  # LR1 fleet — 10 vessels ("Handysize-LR1"); avg age ~13. NON-scrubber (vintage;
  # the disclosed 85 scrubber = all LR2+MR — LR1s run compliant fuel).
  # ============================================================
  # ---- 2013 builds (age 13) — 6 LR1; eco false ----
  - {id: TRMD_LR1_2013, class: LR1, dwt: 75000, age: 13, scrubber: false, eco: false, charter_status: spot, count: 6}
  # ---- 2012 builds (age 14) — 4 LR1; eco false ----
  - {id: TRMD_LR1_2012, class: LR1, dwt: 75000, age: 14, scrubber: false, eco: false, charter_status: spot, count: 4}

  # ============================================================
  # MR fleet — 63 vessels; avg age 11.5. ALL scrubber-fitted (modern fleet).
  # 2013 cohort eco false per §3.1.
  # ============================================================
  # ---- 2018 builds (age 8) — 1 MR; Q1 2026 acquisition ----
  - {id: TRMD_MR_2018, class: MR, dwt: 50000, age: 8, scrubber: true, eco: true, charter_status: spot, count: 1}
  # ---- 2016 builds (age 10) — 20 MR; all scrubber ----
  - {id: TRMD_MR_2016, class: MR, dwt: 50000, age: 10, scrubber: true, eco: true, charter_status: spot, count: 20}
  # ---- 2015 builds (age 11) — 22 MR; all scrubber ----
  - {id: TRMD_MR_2015, class: MR, dwt: 50000, age: 11, scrubber: true, eco: true, charter_status: spot, count: 22}
  # ---- 2013 builds (age 13) — 20 MR; eco false per §3.1; all scrubber ----
  - {id: TRMD_MR_2013, class: MR, dwt: 50000, age: 13, scrubber: true, eco: false, charter_status: spot, count: 20}

  # ---- 2 MR RESALES on the §9.6 curve (owner decision 2026-07-02): TORM Dehradun / TORM Dapitan,
  #      2015-built (age 11), agreed in Q1 2026, delivery Q2 2026 (~0.12 yr). Valued at the age-11 MR
  #      delivered-market mark PV-discounted 1.11^(-0.12), LESS the $31.2M remaining commitment (balance
  #      sheet); advances → 0 there. scrubber=FALSE: the Q1 6-K makes NO scrubber statement about these
  #      resales (the disclosed 85 is the EXISTING fleet; defaulting the premium = the SB peer-trap).
  #      See newbuild_specs.yaml. ----
  - {id: TRMD_MR_resale_2015, class: MR, dwt: 50000, age: 11, scrubber: false, eco: true, charter_status: spot, count: 2, years_to_delivery: 0.12}

