# Hafnia Limited (HAFN / NYSE:HAFN, OSL:HAFNI via Norwegian deposit receipts)
# fleet manifest — METHODOLOGY §4.1, §11.5
# Source: Hafnia Q1 2026 6-K (filed 2026-05-27); cross-checked against IR
# investor presentation + earnings call transcript. Balance sheet 2026-03-31.
#
# Scope (109 OWNED vessels on-curve, by class):
#   - 10 LR2  (~110k DWT, valued via LR2/Aframax-equivalent curve)
#   - 25 LR1  (~75k DWT, valued via LR1 curve)  — 4 pending sale into Q2 2026
#   - 49 MR   (~50k DWT, valued via MR curve)   — incl. 13 IMO II
#
# Off-curve (entered via balance_sheet working_capital_net):
#   - 22 Handysize  (~37k DWT) — Hafnia is WINDING DOWN the Handy pool;
#     4 hulls pending Q2 sale, broader segment exit planned over time.
#     Same §11.5 framework gap as ASC's 6 hulls and STNG's 14 Handymax —
#     no Handysize class in vessel_value_curves.yaml.
#
# Chartered-in vessels (NOT on-curve manifest; captured via lease_liabilities):
#   - 4 LR1 (2 bareboat + 2 time-charter-in)
#   - 7 MR  (time-charter-in)
#   - 1 Handy (bareboat)
#
# Newbuild orderbook: 8 firm + 2 optional MR at Hyundai Heavy Industries (~$405M firm, delivery
#   Q3-2028→Q2-2029). SIGNED 3 APRIL 2026 — a SUBSEQUENT EVENT (6-K Note 7), so EXCLUDED from the
#   2026-Q1 (3/31) snapshot entirely (newbuild_capex_commitments = 0). To be wired on-curve in Q2 (§9.6).
#
# Per-vessel detail is in the Hafnia Q1 2026 investor presentation PDF
# (s201.q4cdn.com/891122012/...). Aggregated here by class × build-year
# × scrubber/eco status using `count: N` rows. Distribution approximates
# Hafnia's disclosed avg fleet age of 9.6 yrs and the ~80% eco / ~70%
# scrubber sector reads. Refresh per-vessel when the Q1 PDF fleet table
# is pulled.
#
# age = 2026 - year built. eco = built post-2014 (METHODOLOGY §3.1).
ticker: HAFN
report_date: 2026-Q1
vessels:
  # ============================================================
  # LR2 fleet — 10 vessels; segment winding down per management.
  # Mix of mid-2010s and earlier vintages. ~50% scrubber (Hafnia
  # has been less scrubber-aggressive than STNG on LR2 cohort).
  # ============================================================
  - {id: HAFN_LR2_2015, class: LR2, dwt: 110000, age: 11, scrubber: true,  eco: true,  charter_status: spot, count: 4}
  - {id: HAFN_LR2_2014, class: LR2, dwt: 110000, age: 12, scrubber: true,  eco: true,  charter_status: spot, count: 3}
  - {id: HAFN_LR2_2013, class: LR2, dwt: 110000, age: 13, scrubber: false, eco: false, charter_status: spot, count: 3}

  # ============================================================
  # LR1 fleet — 25 OWNED vessels (4 pending sale Q2 2026: 2008-2010
  # builds — Shinano / Yangtze / Seine / Zambesi). Q1 LR1 TCE
  # $38,194/day OUTPERFORMED LR2 ($35,316) due to coated-LR2 dirty-
  # switching dynamic (§14.6.1 framework gap — same mechanism that
  # applies to STNG's LR2 fleet, but here it shows up as LR1 strength
  # because the LR1 clean market tightened when LR2s defected dirty).
  # ============================================================
  # Pending-sale cohort (4× 2008-2010) — included here at on-curve
  # value until delivery completes; framework will catch the
  # adjustment via the working_capital_net pending-sale line on the
  # balance sheet at next refresh.
  - {id: HAFN_LR1_2009_HFS, class: LR1, dwt: 75000, age: 17, scrubber: false, eco: false, charter_status: spot, count: 4}
  # Continuing LR1 cohort
  - {id: HAFN_LR1_2014, class: LR1, dwt: 75000, age: 12, scrubber: true,  eco: true,  charter_status: spot, count: 8}
  - {id: HAFN_LR1_2013, class: LR1, dwt: 75000, age: 13, scrubber: false, eco: false, charter_status: spot, count: 8}
  - {id: HAFN_LR1_2012, class: LR1, dwt: 75000, age: 14, scrubber: false, eco: false, charter_status: spot, count: 5}

  # ============================================================
  # MR fleet — 49 OWNED vessels; 13 IMO II-capable (those are
  # valued the same as standard MRs at the curve — IMO II is an
  # operating-flexibility flag, not a curve discount).
  # 8 firm + 2 option NBs (delivery 2028-2029) in newbuild_capex.
  # 7 MR chartered-in (operating leases via IFRS 16 lease_liabilities).
  # 2 pending sale Q2 2026 (2012-2013 builds Crux + Leo).
  # ============================================================
  - {id: HAFN_MR_HFS,  class: MR, dwt: 50000, age: 13, scrubber: false, eco: false, charter_status: spot, count: 2}
  - {id: HAFN_MR_2017, class: MR, dwt: 50000, age: 9,  scrubber: true,  eco: true,  charter_status: spot, count: 14}
  - {id: HAFN_MR_2015, class: MR, dwt: 50000, age: 11, scrubber: true,  eco: true,  charter_status: spot, count: 12}
  - {id: HAFN_MR_2014, class: MR, dwt: 50000, age: 12, scrubber: true,  eco: true,  charter_status: spot, count: 11}
  - {id: HAFN_MR_2013, class: MR, dwt: 50000, age: 13, scrubber: false, eco: false, charter_status: spot, count: 10}

  # ============================================================
  # Handysize fleet — 22 owned (clean-product ~37k DWT). ON-CURVE as of
  # 2026-06-05 (Handysize class added to vessel_value_curves.yaml; §11.5 gap
  # retired for clean-product Handies). Hafnia is winding down the segment, so
  # the cohort skews OLD — modelled at age 18 (≈2008 builds), which the
  # Handysize curve values at ~$14.5M/vessel (~$320M aggregate), reproducing
  # the prior off-curve estimate (22 × ~$15M = $330M) without the 10% wind-down
  # liquidity haircut the off-curve sleeve carried (the framework has no
  # on-curve liquidity-discount mechanism — net effect ~+$0.04/sh, §6 note).
  # No per-vessel Handy ages were disclosed; age 18 is the value-pinned cohort
  # estimate. Refresh with the per-vessel build years from the Q1 IR deck.
  - {id: HAFN_Handy_2008, class: Handysize, dwt: 37000, age: 18, scrubber: false, eco: false, charter_status: spot, count: 22}

# Charter coverage (Q2 2026 expected days, 13 May 2026 disclosure):
#   Fleet-wide: 73% covered @ $46,600/day weighted
# Modelled here as all spot — Hafnia operates through its own product-
# tanker POOL (the world's largest), so "spot" earnings are pool-derived
# (net pool admin fees, bunker volatility). This is methodologically
# distinct from STNG's direct-spot but functionally captures the same
# rate level; modelled identically since the framework's spot/12M TC
# rate inputs are sector-level anyway. Flagged in §6 HAFN entry.
spot_coverage_pct:
  LR2: 1.00
  LR1: 1.00
  MR:  1.00
  Handysize: 1.00
fleet_summary:
  LR2_count: 10
  LR1_count: 25
  MR_count: 49
  Handysize_count: 22            # ON-CURVE as of 2026-06-05 (was off-curve via working_capital_net)
  on_curve_total: 106            # 10 LR2 + 25 LR1 + 49 MR + 22 Handysize on the curve
  owned_total: 106               # all 106 owned now on-curve (Handysize gap retired)
  chartered_in_count: 12          # 4 LR1 (2 BB + 2 TC) + 7 MR TC + 1 Handy BB — IFRS 16 lease_liabilities
  newbuild_orders: 8              # 8 firm MR + 2 option (option not in fleet count)
  avg_age_LR2_approx: 11.9
  avg_age_LR1_approx: 13.3
  avg_age_MR_approx: 10.7
  avg_age_owned: 9.6              # per Hafnia disclosure (averages across all owned)
  pool_operated: true             # Hafnia runs the world's largest product tanker pool
