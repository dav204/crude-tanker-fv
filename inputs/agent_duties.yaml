# Recurring AGENT/HUMAN duties — the ones with no plist and no heartbeat.
#
# WHY THIS FILE EXISTS (2026-08-13): the sentinel could only ever see two kinds
# of liveness — a committed plist's heartbeat (check 6) and a staged artifact's
# freshness (check 8). A duty that lives as a slash command, a checklist line, or
# a habit was invisible to BOTH, so its death was undetectable by construction.
#
# That is not hypothetical. `/news-pull` — the agent web-sweep that reads company
# news the scanners cannot — ran twice (2026-06-10, 2026-06-21) and then stopped.
# Its automation was deferred by the owner on 2026-06-14 during the crude-edge
# FREEZE; the freeze lifted 6/21 and the deferral was never re-docketed. Meanwhile
# the MECHANICAL job sharing its name (news_pull_cron.sh) kept reporting
# outcome=ok every Saturday, so the dashboard showed "news-pull: healthy" while
# the half that catches corporate actions had been dead seven weeks. A BRUT
# demerger sat unread for five of them.
#
# A duty listed here flags AGENT-TASK-DUE when its artifact goes stale. This is
# the WEAK form of the fix — a nag. The STRONG form is to schedule the duty so it
# has a heartbeat like any other job; `scheduled: false` marks the ones still
# owed that treatment, so the gap between "reminded" and "automated" is itself
# visible rather than forgotten.

duties:
  - name: news_pull_digest
    artifact_glob: "news_digest_*.md"     # under outputs/
    cadence_days: 7
    scheduled: true                       # SCHEDULED 2026-08-13 — Claude scheduled-task
                                          # `crude-fv-weekly-news-pull`, Sat 09:03 local
                                          # (after the 08:00 mechanical chain, so the
                                          # archive is fresh). This CLOSES the agent-half
                                          # orchestration deferred 2026-06-14 under the
                                          # crude-edge freeze and never re-docketed when
                                          # the freeze lifted 6/21 — an 8-week hole.
                                          # The digest's age (checked here) IS the
                                          # heartbeat: if the task dies, 8c flags it.
    command: "/news-pull"
    why: >
      Reads COMPANY news (demergers, financings, deliveries, CEO changes, stance
      changes) with agent judgment — trade press, broker stance, aggregator context —
      which no scanner can do. The mechanical scanners read only what is already in
      the Pareto archive, so they cannot see an event the archive missed.
      ROSTER CORRECTION 2026-08-16: this note previously named "BRUT, MPCC, ODL" as
      the Oslo/Euronext names. ODL is Odfjell Drilling — a portfolio-governance
      HOLDING, not a producer-repo name; it is absent from inputs/watchlist.yaml and
      was never sweepable. The actual non-US-listed roster is BRUT, MPCC, CAPT,
      BWLP (.OL) and 2343 (.HK). The 2026-08-13 digest flagged the error; the
      2026-08-16 digest confirmed it against the watchlist.
      NO LONGER THE ONLY CHANNEL 2026-08-16: `crude_tanker_fv.newsweb_poll` now
      polls the Oslo/Euronext issuer feeds hourly (BRUT/MPCC/CAPT/BWLP), so a
      missed issuer release no longer depends on this duty running. That is the
      STRUCTURAL fix; this duty remains the judgment layer on top of it, and its
      digest is still the heartbeat 8c watches.

  - name: governance_weekly_monitor
    artifact_path: ../portfolio-governance/monitor/log.md   # newest ISO date in the log
    cadence_days: 8                       # Friday 17:00 ET desktop task; 8 = one slipped day
    scheduled: true                       # Claude scheduled-task `portfolio-weekly-monitor`
    command: "(desktop scheduled task portfolio-weekly-monitor, Fri 17:00 ET — consumer repo)"
    why: >
      REGISTERED 2026-09-02 (autopilot §2): the consumer's Friday tripwire monitor reads
      this repo's book_scorecard.json + RATIFY_LOG.md and is the only thing that turns a
      producer read into a sizing decision. Its 2026-08-21 silence (the outage week) was
      invisible here because its log lives in the other repo. Its age now rides this
      sentinel like any duty; the governance repo's own dead-man ping stays primary.

  - name: trigger_check_draft
    artifact_glob: ["decisions/trigger_check_*.draft.md", "decisions/*_check_*.md"]   # repo-root globs (the "/"); the draft
                                          # and the record it becomes both carry the due date in the name
    cadence_days: 8                       # Thursday 09:00 app task (crude-fv-trigger-check-draft); 8 = one slipped day
    scheduled: true                       # Claude scheduled-task crude-fv-trigger-check-draft, installed 2026-09-18 (Thu 09:09 local)
    command: "/record-trigger-check after the Thursday draft, or in a chat: run the check"
  - name: weekly_report
    artifact_glob: "weekly_report_*.md"   # under outputs/
    cadence_days: 8                       # Saturday, on the back of the 08:15 sentinel run
    scheduled: true                       # scripts/sentinel_cron.sh, Saturday branch (no new plist)
    command: "python -m crude_tanker_fv.weekly_report --send"
    why: >
      ADDED 2026-09-02: the owner-facing surface that replaces reading a ~30-flag daily digest —
      what moved in the book, what needs a word, whether the machine is alive, what lands in the
      next fortnight. It rides the sentinel wrapper rather than its own launchd job precisely so
      it needs no install. Its age IS its heartbeat: if the Saturday branch stops firing, this
      duty flags AGENT-TASK-DUE — the /news-pull lesson (a duty nobody could see die ran twice
      and stopped for eight weeks while its mechanical namesake reported green).
