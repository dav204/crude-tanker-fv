      # (2026-2028 orderbook + warm-winter / Chinese-slowdown shocks; the cycle
      # eventually clears as old tonnage retires and demand resumes growth).
      # Structural reset is a SECULAR demand-decline narrative: energy transition
      # accelerates, LNG demand peaks before 2030, oversupply persists STRUCTURALLY
      # beyond the cyclical glut, fleet faces accelerated retirement pressure,
      # terminal carrier values reset lower because the residual operating /
      # FSRU-conversion runway is shorter than the curve assumes.
      #
      # Forward shape: front quarters resemble glut_intensifies (near-term
      # cyclical weakness — energy transition does not bite immediately) but the
      # back half is structurally worse (no late-cycle relief because demand
      # itself is declining). 12M base ~$45k/day vs current ~$98.5k 12M TC
