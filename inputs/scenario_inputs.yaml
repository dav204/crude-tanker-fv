  # DRY BULK SECTOR — formalised 2026-06-09 (METHODOLOGY §11.7)
  # Four-scenario Bulk Set A: china_acceleration / moderate_growth /
  # china_property_drag / coordinated_slowdown. Mids v2-calibrated against
  # the Jun-9 2026 FFA forward curve (Cape PW within 5% of FFA; Pana Cal27
  # essentially exact; Supra-Ultra Cal27 within ~10%, FFA inside band).
  # ===========================================================================
  dry_bulk:

    # -----------------------------------------------------------------------
    # Per-class route conventions — anchored to Baltic Exchange composites.
    # Pareto Shipping Daily reports a single $/day per class derived from
    # these indices (which combine multiple sub-routes per class).
    # -----------------------------------------------------------------------
    class_routes:
      cape:
        primary_route: BCI 5TC
        description: Capesize 5-route TC average (Baltic)
        basin_exposure: Iron ore (China demand-driven; Brazil/Australia loading)
      pana:
        primary_route: BPI 5TC
        description: Panamax 5-route TC average
        basin_exposure: Coal + grain (China + EU + India demand)
      supra_ultra:
        primary_route: BSI 10TC
        description: >
          Supramax/Ultramax 10-route TC average. Pareto reclassified the
          benchmark from Supramax to Ultramax in Sep 2025; we treat as one
          class per METHODOLOGY §11.7.
        basin_exposure: Minor bulk (bauxite, fertilisers, scrap, cement)

    # -----------------------------------------------------------------------
    # Confidence levels — FFA market liquidity drops sharply past Cal27.
