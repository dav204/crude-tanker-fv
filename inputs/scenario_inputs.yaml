# OPEN DATA GAPS (acknowledged; flagged for v5 refinement)
# =============================================================================
data_gaps:
  crude:
    - post_MoU_broker_FFA_quotes:
        status: not yet publicly available
        action: request from Haavaldsen at Pareto; cross-check FIS or Marex weekly
    - cross_route_aframax_peak_prints:
        status: TD7/TD19 weekly prints from Wk 7-11 not extracted
        action: Baltic Exchange direct
    - current_floating_storage:
        status: Windward data 60 days stale
        action: Vortexa or Kpler crude floating storage tracker
    - cal_2028_market_quotes:
        status: no liquid quote across any class
        action: derive from orderbook delivery schedule + scrapping assumptions
                (currently extrapolated from Cal-27 shape)
  lng:
    - lng_scenario_weights:
        status: HISTORY — v1 crude-inherited placeholder → Set B v2 lock (2026-06-01) →
                v3 lock (2026-06-09 morning) → Jun-9-2026 POINT-IN-TIME v4
                {tight_resurgence 0.25, moderate_tightening 0.25, glut_base 0.38,
                glut_intensifies 0.12, structural_reset 0.00}. v4 is NOT a permanent
                lock; revisit when the US response to the Jun-8 helicopter downing
                resolves. Full rationale in METHODOLOGY §11.3 v4.
        action: revisit if (a) LNG cycle structure shifts materially, (b) better
                data emerges on energy-transition timing, or (c) the structural
                overlay (qualitative -5 to -15% on FV per individual view of
                transition window) consistently disagrees with realised prices.
    - structural_reset_tail:
        status: 5th scenario CURATED and AVAILABLE in inputs/scenario_inputs.yaml
                (sectors.lng.scenarios.structural_reset; weight 0.0). Includes a
                -10% vessel_scale_multiplier for accelerated-retirement haircut.
                Not parametrically weighted because the energy-transition timing
                and magnitude are too judgmental to assign a meaningful prob mass.
        action: keep as a sensitivity / scenario-override tool, NOT a default
                weighted input. Investors apply -5 to -15% overlay on the
                production FV based on their own transition-timing view.
    - lng_ffa_curve_quality:
        status: LNG forward curve liquidity is much thinner than crude;
                ffa_forward_curve.yaml entries for LNGC are largely TC-implied.
        action: Affinity / Fearnleys weekly + Spark TC curves as anchors.
