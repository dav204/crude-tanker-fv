      # structural_decline — the product energy-transition TAIL.
      #
      # Curated and AVAILABLE; weight 0.00. Captures secular product-demand
      # decline drivers that don't fit the cyclical glut narrative:
      #   - EV gasoline demand peak (now < 2030 in optimistic transition view)
      #   - Jet fuel: efficiency + SAF substitution slows growth materially
      #   - Refinery rationalisation: 2026-2030 sees 2-3 mb/d capacity closures
      #     in OECD, structurally lowering product transport volumes
      #   - Marine fuel: ammonia / methanol bunkering displaces some marine
      #     gasoil + VLSFO demand
      #
      # Includes vessel_scale_multiplier 0.90 — accelerated-retirement haircut
      # on product carrier values, analogous to LNG structural_reset. Front
      # quarters resemble demand_softening (near-term cyclical weakness); the
      # back half is structurally worse (no late-cycle relief because demand
      # itself is declining).
      #
      # Weight 0.00 because the timing/magnitude of structural product demand
      # peak within the 2028-2035 window is too judgmental to assign a
      # meaningful parametric weight. Apply as a qualitative overlay (-5 to
      # -15% on the product FV) per individual transition-timing view.
      # ---------------------------------------------------------------------
      structural_decline:
