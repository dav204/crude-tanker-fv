    # =======================================================================
    # CRUDE — CYCLE WEIGHTING ANCHORS
    # 10-year historical TCE means by class, used to compute cycle position
    # ratio = (forward 12M base) / (10yr mean). Threshold bands per
    # METHODOLOGY.md section 2.3.
    # =======================================================================
    # anchor_basis (B5/§10): all crude anchors are TC-anchored 10-year means.
    # The basis does not numerically compose with dry-bulk (22-month archive
    # median) or containership (FY calendar average) anchors — see METHODOLOGY §10.
