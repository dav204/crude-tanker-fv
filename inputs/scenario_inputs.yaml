# =============================================================================
# scenario_inputs.yaml
# Sector-layered scenario framework (METHODOLOGY.md §11).
# Build date: 2026-05-29 (LNG sector split out 2026-06-01)
# Source: tanker_tce_grid_v4 (Pareto + VIE + Windward + Baltic Wk17 + Breakwave)
# =============================================================================
# Top-level shape:
#
#   sectors:
#     crude:                  # three-phase MoU framework (TCE/USD/day)
#       scenarios:  {escalation, pre_mou_baseline, mou_base, mou_bear}
#       cycle_anchors:  per-class 10yr means
#     lng:                    # LNG carrier cycle (TCE/USD/day, 174k cbm modern)
#       scenarios:  {tight_resurgence, moderate_tightening, glut_base,
#                    glut_intensifies}
#       cycle_anchors:  {lng}
#
# Each scenario carries a probability `weight` and a per-class 8-quarter forward
# curve as `[low, base, high]` cells in $/day TCE-equivalent. Quarters are
# calendar quarters; the first quarter (Q3 2026) is the forward strip's front
# quarter as of the 2026-05-29 build.
#
# Pipeline resolves a ticker's sector from inputs/watchlist.yaml (default
# `crude` if absent) and calls load_scenarios(sector=...) to get that sector's
# {scenarios, cycle_anchors} sub-doc.
# =============================================================================

metadata:
  build_date: 2026-05-29
  framework_version: v5
  framework_description: >
    Sector-layered scenarios. Crude: three-phase MoU rate path (Phase 1 backlog
    clearance, Phase 2 normalization, Phase 3 structural). LNG: glut-cycle (174k
    cbm modern LNGC) — orderbook deliveries 2026-2028 pressure rates;
    seasonality dominates in the base case; tight-resurgence/structural-reset
    are the tail scenarios. The v1 limitation (LNG curves carried under crude
    scenario names) is removed — see METHODOLOGY §11.
  rate_units: USD_per_day_TCE
  primary_sources:
    crude:
      - Pareto Securities Shipping Daily (2026-05-29)
      - Value Investor's Edge Shipping Rate Tracker (2026-05-29)
      - Windward Maritime Intelligence (2026-03-30/31; floating storage 158.6mb)
      - Baltic Exchange weekly tanker roundups (Wk 4, 6, 7, 11, 17 of 2026)
      - Breakwave Advisors "Big Picture" (2026-01-20; pre-war Cal-26/Cal-27 FFA)
      - Frontline Q1 2026 earnings call (forward bookings, breakevens)
    lng:
      - Flex LNG Q1 2026 earnings & 12-month TC commentary
      - Affinity LNG / Fearnleys weekly LNG carrier rate reports
      - Clarksons modern 174k cbm LNGC 10yr mean (2016-2025, incl. 2022-23 spike)

# =============================================================================
# SECTORS
# =============================================================================

sectors:

  # ===========================================================================
  # CRUDE TANKER SECTOR
  # Three-phase MoU framework — applies to VLCC / Suezmax / Aframax / LR2.
  # ===========================================================================
  crude:

    # -----------------------------------------------------------------------
    # Per-class route conventions used as primary anchor for each forward curve.
    # Other routes (TD22, TD23, TC5, TC15, etc.) inform but don't define the curve.
    # -----------------------------------------------------------------------
    class_routes:
      vlcc:
        primary_route: TD3C
        description: MEG → China, 270kt cargo
        basin_exposure: MEG-loading (Phase 1 spike sensitive)
      suezmax:
        primary_route: TD20
        description: WAF → UKC, 130kt cargo
        basin_exposure: Atlantic (already discounted in May correction)
      aframax_dirty:
        primary_route: TD7
        description: Cross-UKC, 80kt cargo
        basin_exposure: Atlantic
      lr2_clean:
        primary_route: TC1
        description: MEG → Japan, 75kt cargo
        basin_exposure: MEG-loading (Phase 1 spike sensitive)

    # -----------------------------------------------------------------------
    # Confidence levels per class & tenor — used by FV engine to widen the
    # sensitivity grid where data is thin.
    # -----------------------------------------------------------------------
    confidence:
      vlcc:
        front_4q: high       # direct Baltic prints + Pareto + VIE
        cal_2027: medium     # Braemar mean-of-range + structural derivation
        cal_2028: very_low   # no liquid quote
      suezmax:
        front_4q: high
        cal_2027: medium
        cal_2028: very_low
      aframax_dirty:
        front_4q: medium     # derived; cross-route prints sparse
        cal_2027: low
        cal_2028: very_low
      lr2_clean:
        front_4q: medium     # MEG-loading inferred; TC1/TC15 anchors
        cal_2027: low
        cal_2028: very_low

    scenarios:

      # ---------------------------------------------------------------------
      # Scenario 0: ESCALATION (war intensifies beyond current; the genuine upside tail)
      # Added 2026-05-29 (see framework_breakers). MEG-loading routes (TD3C, TC1)
      # sustain $400k+; Cal-26 blended $200k+. The "true tail" the prior set lacked.
      # ---------------------------------------------------------------------
