  # ===========================================================================
  # LPG / VLGC — LPG Set A (US-export-arb) — WO3 Phase 1 (2026-07-08).
  # Methodology: decisions/lpg_methodology_2026-07-07.md (ALL FORKS RATIFIED
  # 2026-07-07); METHODOLOGY §11.10. Charter authority
  # fd0277f — B-4 carried verbatim: the allocation is NOT a supply call on
  # VLGCs; market cells adverse (~30% orderbook, avg age 11.7y, no scrappage
  # lever). The engine reads the sector honestly.
  #
  # v1 scope: VLGC only (Fork 1) — both validators (Dorian LPG, BW LPG) are
  # pure-VLGC. NVGS/GASS census-noted, not onboarded; no MGC in this sector
  # (the existing sectors.lng MGC class stays where it is).
  #
  # Scenario axis (Fork 3): US-export ton-mile growth × China-PDH absorption,
  # with the ~30% orderbook as the supply overhang every scenario carries.
  # NOT a dry-bulk China clone. Weights are EVIDENCE-FIRST, overhang-tilted
  # (ratified 2026-07-07): the bull leg needs a China PDH demand sink that the
  # evidence says is soft (~70% utilization), while the bear leg (orderbook
  # delivering 2026-28 into soft PDH margins) is the best-evidenced cell —
  # so overhang is co-weighted WITH base, not subordinate to it.
  #
  # Rate levels grounded in the Phase-0 evidence table: current realized TCE
  # ~$60-64k/day (Dorian Q1-2026 $63,615, WAR-ELEVATED by the Hormuz spike;
  # BLPG1 spot prints are crisis-distorted and NOT used); 1-yr TC ~$60k
  # (BW Pampero, Aug-2026) with the multi-year term structure BACKWARDATED
  # (3-5yr fixtures low-$40ks); 10-yr through-cycle realized mean ~$40k;
  # trough FY17-19 ~$22k. The probability-weighted front quarter sits ≈$60k
  # (current realized); the weighted end-strip sits BELOW the $40k mean —
  # the overhang tilt, priced not asserted.
  # ===========================================================================
  lpg:

    g: 0.01   # justified-P/NAV growth (METHODOLOGY §17) — conservative, matches
              # dry_bulk; the ~30% orderbook grows the fleet, not per-share NAV.

    scenarios:

      # ---------------------------------------------------------------------
      # arb_wide (w=0.15) — bull
      # ---------------------------------------------------------------------
      arb_wide:
        weight: 0.15
        description: >
          US export capacity (Enterprise end-2026, ET Nederland H1-2027, Targa
          Q3-2027) ramps into FIRM Asian PDH pull; ton-miles + episodic Panama
          premium outrun the orderbook deliveries. Rates hold well above mean
          through the strip (~1.3-1.75x anchor) — the 2023-24 realized band
          ($50-66k) sustained. Requires the China PDH demand sink to firm from
          ~70% utilization, which current evidence does NOT show — hence 0.15.
        vlgc:
          q3_2026: [59500, 70000, 80500]
          q4_2026: [57800, 68000, 78200]
          q1_2027: [52700, 62000, 71300]
          q2_2027: [49300, 58000, 66700]
          q3_2027: [46750, 55000, 63250]
          q4_2027: [47600, 56000, 64400]
          q1_2028: [44200, 52000, 59800]
          q2_2028: [42500, 50000, 57500]

      # ---------------------------------------------------------------------
      # absorption_base (w=0.35) — base
      # ---------------------------------------------------------------------
      absorption_base:
        weight: 0.35
        description: >
          US export growth roughly matches fleet growth; China PDH stays ~70%
          utilized. The Hormuz war premium decays and rates glide from current
          realized ~$62k toward the $40k through-cycle mean by end-strip —
          classic mean reversion, ending AT the anchor (not above it: the
          orderbook denies a scarcity premium at the horizon).
        vlgc:
          q3_2026: [52700, 62000, 71300]
          q4_2026: [46750, 55000, 63250]
          q1_2027: [40800, 48000, 55200]
          q2_2027: [38250, 45000, 51750]
          q3_2027: [36550, 43000, 49450]
          q4_2027: [35700, 42000, 48300]
          q1_2028: [34850, 41000, 47150]
          q2_2028: [34000, 40000, 46000]

      # ---------------------------------------------------------------------
      # overhang (w=0.35) — bear, co-weighted with base (ratified)
      # ---------------------------------------------------------------------
      overhang:
        weight: 0.35
        description: >
          The ~30% orderbook delivers 2026-28 into soft PDH margins; the war
          premium unwinds fast and rates fall THROUGH the mean to ~0.7x anchor
          by end-strip ($28k — above the FY17-19 trough, below the mean). The
          single best-evidenced leg (orderbook is contracted, PDH softness is
          observed) — weighted equal to base, NOT subordinate.
        vlgc:
          q3_2026: [49300, 58000, 66700]
          q4_2026: [39100, 46000, 52900]
          q1_2027: [32300, 38000, 43700]
          q2_2027: [28900, 34000, 39100]
          q3_2027: [27200, 32000, 36800]
          q4_2027: [25500, 30000, 34500]
          q1_2028: [24650, 29000, 33350]
          q2_2028: [23800, 28000, 32200]

      # ---------------------------------------------------------------------
      # arb_collapse (w=0.15) — tail
      # ---------------------------------------------------------------------
      arb_collapse:
        weight: 0.15
        description: >
          The US-Asia arb closes (tariff/price shock) while Panama normalizes
          (LoTSA 2.0 auction premium unwinds) — ton-mile give-back on top of
          the orderbook. Rates retrace to the FY17-19 trough band (~$20-22k)
          and sit there; floor is well above VLGC opex but ~0.5x anchor.
        vlgc:
          q3_2026: [42500, 50000, 57500]
          q4_2026: [30600, 36000, 41400]
          q1_2027: [23800, 28000, 32200]
          q2_2027: [20400, 24000, 27600]
          q3_2027: [18700, 22000, 25300]
          q4_2027: [17850, 21000, 24150]
          q1_2028: [17000, 20000, 23000]
          q2_2028: [17000, 20000, 23000]

    # =======================================================================
    # LPG — CYCLE ANCHOR (ratified 2026-07-07, owner)
    # ~$40,000/day 10-yr THROUGH-CYCLE VLGC REALIZED TCE. The realized-TCE
    # basis is the CORRECT anchor for an 85-99%-spot validator pair (Dorian /
    # BW LPG) — not a compromise. The clean 1-yr TC (~$60k BW Pampero) is a
    # documented CROSS-CHECK, not the anchor. Cycle multiples are computed
    # realized-vs-realized — never a TC numerator over this denominator.
    #
    # anchor_basis (B5/§10) = realized_tce_10yr_mean: a FOURTH basis that does
    # NOT numerically compose with tc_10yr_mean (crude/product/lng),
    # archive_22mo_median (dry_bulk), or fy_calendar_avg (containerships).
    #
    # TRAILING average — it DRIFTS (Dorian recomputes it yearly for
    # impairment). as_of 2026-07-07; annual re-derivation off Dorian's + BW
    # LPG's latest 10-K/20-F under the `lpg_anchor_annual_review` trigger
    # (inputs/reweight_triggers.yaml, due 2027-06-30).
    # =======================================================================
    cycle_anchors:
      vlgc:
        ten_year_mean: 40000
        as_of: 2026-07-07
        source: >
          Dorian LPG 10-K realized fleet TCE series FY2016-2025 (trailing-10yr
          mean $39,414; FY17-26 $39,129; 11-yr $40,579), triangulated vs BW LPG
          realized subset ($41,128) and Clarksons 2024 ~$42k "in line with
          long-run averages". decisions/lpg_methodology_2026-07-07.md.
        anchor_basis: realized_tce_10yr_mean


# =============================================================================
# TRIGGERS TO WATCH (CRUDE)
# Observable signals that recalibrate crude scenario weights between runs.
# =============================================================================
triggers_to_watch:
  - name: MoU signing event
    current_status: announced_unsigned
    binary: true
    if_signs: shift weight toward mou_base + mou_bear; pre_mou_baseline → 0.10
    if_no_sign_in_14d: shift weight toward pre_mou_baseline → 0.50

  - name: MR Product Avg floor
    current_value_per_day: 23800
    direction_last_week: down_52pct
    bullish_signal: stabilizes or recovers to $30k within 5 trading days
    bearish_signal: continues falling below $20k
    interpretation: >
      The MR product market is the leading indicator for the broader complex.
      Recovery → Phase 1 conviction strengthens, lift mou_base weight.
      Continued decline → equity market may already be in Phase 2; lift mou_bear.

  - name: Iran export volume (first 2 weeks post-MoU sign)
    bullish_signal: ramps above 2.0 mb/d
    bearish_signal: stays below 1.0 mb/d
    interpretation: >
      Above 2.0 mb/d implies aggressive surge → Phase 1 spike intensifies and
      extends; could push VLCC TD3C to $500k+. Below 1.0 mb/d implies Iran can't
      ramp → Phase 1 collapses → mou_bear scenario.

  - name: Floating storage (current vs Windward 158.6mb anchor)
    source_to_check: Vortexa or Kpler crude floating storage report
    current_anchor_age_days: 60
    interpretation: >
      Windward data is 2 months stale. Current floating storage > 200mb tightens
      Phase 1 duration estimate (longer backlog clearance, more sustained spike).
      < 100mb means storage has already been worked off; Phase 1 weaker.

  - name: TD3C VLCC spot
    current_value: 388300
    direction_last_week: down_17pct
    interpretation: >
      Sub-$300k while MoU still unsigned → backlog clearance already starting
      in anticipation. Sustained > $400k → Phase 1 mechanic still loaded.

# =============================================================================
# OUTPUT REQUIREMENTS
# What the FV engine should produce after consuming this file.
# (Sector-agnostic — the scenario column names vary per sector but the schema
# is the same.)
# =============================================================================
output_requirements:
  per_name_report:
    - probability_weighted_FV: weighted average across the sector's scenarios
    - per_scenario_FV: standalone FV under each scenario
    - per_scenario_NAV_share: NAV is mostly scenario-invariant in T+0; flag if vessel-value reset materially in a scenario
    - per_scenario_dividend_strip_NPV: this is what diverges most across scenarios
    - per_scenario_implied_breakeven_TCE: what flat rate ties FV to current price
    - upside_to_best_scenario: FV(best) − current_price
    - downside_to_worst_scenario: FV(worst) − current_price
    - expected_value_vs_current: weighted_FV − current_price (the decision signal)

  watchlist_rollup:
    columns:
      - ticker
      - sector                    # crude or lng (sector-layer, METHODOLOGY §11)
      - current_price
      - per-scenario FV columns   # vary by sector
      - probability_weighted_FV
      - upside_pct
      - downside_pct
      - expected_value_pct
      - position_recommendation  # tool's view; analyst overrides
    sort: descending by expected_value_pct
    highlight: |
      Convention: expected_value_pct = (probability_weighted_FV / current_price - 1).
      FV above price (positive EV) = undervalued = BUY/LONG candidate.
      FV below price (negative EV) = overvalued = TRIM/SHORT candidate.
      Names where expected_value_pct exceeds +5% are buy/long candidates.
      Names where expected_value_pct is below -5% are trim/short candidates.
      Cross-name relative value: rank from most overvalued (lowest EV) to most
      undervalued (highest EV) WITHIN sector — cross-sector pair trades are
      flagged as mixed-cycle and require separate judgement.

# =============================================================================
# WHAT WOULD BREAK THE FRAMEWORK (CRUDE)
# Conditions that would invalidate the three-phase decomposition entirely
# and require a model rebuild rather than a recalibration.
# =============================================================================
framework_breakers:
  - condition: MoU collapses and conflict escalates beyond pre-MoU levels
    response: Add a fourth "escalation" scenario; pre_mou_baseline becomes lower bound
  - condition: Permanent comprehensive Iran settlement (sanctions fully lifted)
    response: Phase 3 structural haircut deepens significantly; sanctioned fleet
              gets fully cleared; add Cal-28+ persistent supply overhang scenario
  - condition: Major non-Iran tanker disruption (Russia escalation, Suez closure)
    response: All three scenarios shift up by varying degrees; pre-MoU baseline
              re-anchors at war premium plus new disruption premium
  - condition: Global recession with oil demand collapse
    response: Demand side dominates supply side; all scenarios shift down ~20-30%
              regardless of Iran path
  - condition: Ethanol-as-marine-fuel adoption materially diverts US/Brazil corn
              from export availability to bunker production (structural grain
              tonne-mile loss; MB Dry Bulk Weekly 24/2026, RFA 5%-share estimate
              ~38Mt corn)
    response: Dry-bulk SCENARIO-CURVE input, not a §14 overlay (sector-structural,
              not war-independent macro recession — owner routing 2026-06-12).
              Shade Pana/Supra demand legs in the dry-bulk tree; revisit Bulk
              Set A weights if projected volumes start landing in USDA export
              data. Most exposed SBLK (46 Pana) / CMDB; least GNK (zero Pana)

