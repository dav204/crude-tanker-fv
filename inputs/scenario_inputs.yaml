  # ===========================================================================
  # LNG CARRIER SECTOR
  # Glut-cycle scenarios for modern 174k cbm LNGCs. Driven by the 2024-2028
  # newbuild orderbook (~330+ vessels delivering) running into a flat-to-soft
  # LNG demand profile, with Asian winter / EU storage seasonality dominating
  # the base case. Tight-resurgence is the upside tail; structural_reset is the
  # secular-decline tail (defined but inactive, weight 0.0 — see below).
  #
  # LNG weights — Jun-9-2026 POINT-IN-TIME (v4 — METHODOLOGY §11.3 v4):
  #   tight_resurgence    0.25   (raised from v3 0.15 — Hormuz risk to Qatar LNG)
  #   moderate_tightening 0.25   (held flat from v3)
  #   glut_base           0.38   (trimmed from v3 0.45)
  #   glut_intensifies    0.12   (trimmed from v3 0.15)
  #   structural_reset    0.00   (curated; weight 0; qualitative overlay only)
  # Version-tagged Jun-9: this is a POINT-IN-TIME set, not a permanent lock.
  # Revisit when the US response to the Jun-8 helicopter downing resolves.
  # Full weight history in METHODOLOGY §11.3 (v1 → v2 Set B → v3 → Jun-9 v4).
  # ===========================================================================
  lng:

    g: 0.02   # justified-P/NAV growth (METHODOLOGY §17); higher than tankers — LNG demand secular.

    framework_description: >
      LNG carrier cycle scenarios. Modern 174k cbm two-stroke LNGC is the
      reference vessel (FLNG fleet, Cool Co fleet, Awilco etc.). Rates expressed
      in $/day TCE-equivalent for a 12-month TC. The four scenarios trace the
      orderbook-vs-demand tension: tight resurgence (winter cold + ME LNG
      disruption pulls rates into a near-term spike), moderate tightening
      (modest winter strength), glut base (orderbook deliveries through 2027
      keep rates flat; seasonal winter lifts), glut intensifies (more NB orders
      pulled forward + warm winters + Chinese import slowdown).

    scenarios:

      # ---------------------------------------------------------------------
      # tight_resurgence — the LNG upside tail.
