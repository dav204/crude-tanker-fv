      # accelerates, LNG demand peaks before 2030, oversupply persists STRUCTURALLY
      # beyond the cyclical glut, fleet faces accelerated retirement pressure,
      # terminal carrier values reset lower because the residual operating /
      # FSRU-conversion runway is shorter than the curve assumes.
