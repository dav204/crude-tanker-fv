          q3_2026: [350000, 420000, 500000]
          q4_2026: [320000, 380000, 450000]
          q1_2027: [250000, 300000, 360000]
          q2_2027: [205000, 250000, 300000]
          q3_2027: [190000, 230000, 278000]
          q4_2027: [198000, 240000, 290000]
          q1_2028: [172000, 210000, 252000]
          q2_2028: [152000, 185000, 222000]
        suezmax:
          q3_2026: [140000, 170000, 205000]
          q4_2026: [132000, 160000, 192000]
          q1_2027: [115000, 140000, 168000]
          q2_2027: [103000, 125000, 150000]
          q3_2027: [99000, 120000, 144000]
          q4_2027: [107000, 130000, 156000]
          q1_2028: [95000, 115000, 138000]
          q2_2028: [87000, 105000, 126000]
        aframax_dirty:
          q3_2026: [95000, 115000, 138000]
          q4_2026: [91000, 110000, 132000]
          q1_2027: [81000, 98000, 118000]
          q2_2027: [73000, 88000, 106000]
          q3_2027: [70000, 85000, 102000]
          q4_2027: [76000, 92000, 110000]
          q1_2028: [66000, 80000, 96000]
          q2_2028: [61000, 74000, 89000]
        lr2_clean:
          q3_2026: [190000, 230000, 276000]
          q4_2026: [174000, 210000, 252000]
          q1_2027: [145000, 175000, 210000]
          q2_2027: [124000, 150000, 180000]
          q3_2027: [120000, 145000, 174000]
          q4_2027: [128000, 155000, 186000]
          q1_2028: [112000, 135000, 162000]
          q2_2028: [99000, 120000, 144000]
        # MR forwards moved to sectors.product.scenarios.refinery_squeeze.mr
        # (2026-06-01). Product is now its own sector; the v2 INSW shortcut
        # under sectors.crude is formally retired. See METHODOLOGY §11.5.

      # ---------------------------------------------------------------------
      # Scenario A: PRE-MOU BASELINE (war continues at CURRENT intensity; no MoU)
      # Revised 2026-05-29: the prior curve ($83k 12M VLCC) sat BELOW YTD ($152k),
      # so it was a "war freezes and normalizes" case mislabeled as the bull. Now a
      # genuine war-continues path: VLCC sustained ~$155-200k, normalizing gradually.
      # ---------------------------------------------------------------------
      pre_mou_baseline:
        # Weight 0.45 (Jun-9-2026 POINT-IN-TIME; was 0.15 v1). Now the BASE CASE: war
        # continues, rates bleed lower on demand destruction. mou_base no longer central.
        weight: 0.45
        description: >
          War continues at current intensity (MoU fails to sign / Iran reneges /
          implementation collapses). The Strait-of-Hormuz disruption persists, so
          MEG-loading routes stay elevated near the current forward (~$155-200k VLCC)
          and normalize only gradually. NOT a collapse.
        triggers_into_this_scenario:
          - Trump refuses to sign within 14 days of MoU announcement
          - Iran continues SoH harassment despite MoU
          - Israeli or third-party strike resets the conflict
        vlcc:
          # Jun-9-2026 timing view (NOT a settled level) — was [170000, 200000, 235000].
          # At current $388k spot, the prior Q3 band implied a near-instant crash to
          # the first month of Q3 < $130k, which is physically improbable. Lift Q3
          # only; Q4 trough unchanged, so the crash lands inside Q3 instead of opening
          # below spot. Refresh against the next Pareto daily.
          q3_2026: [198000, 233000, 274000]
          q4_2026: [160000, 190000, 225000]
          q1_2027: [148000, 175000, 205000]
          q2_2027: [135000, 160000, 188000]
          q3_2027: [130000, 155000, 182000]
          q4_2027: [140000, 165000, 195000]
          q1_2028: [125000, 150000, 178000]
          q2_2028: [118000, 140000, 165000]
        suezmax:
          q3_2026: [92000, 110000, 130000]
          q4_2026: [88000, 105000, 124000]
          q1_2027: [82000, 98000, 116000]
          q2_2027: [75000, 90000, 106000]
          q3_2027: [74000, 88000, 104000]
          q4_2027: [80000, 95000, 112000]
          q1_2028: [71000, 85000, 100000]
          q2_2028: [67000, 80000, 94000]
        aframax_dirty:
          q3_2026: [63000, 75000, 88000]
          q4_2026: [60000, 72000, 85000]
          q1_2027: [57000, 68000, 80000]
          q2_2027: [53000, 63000, 74000]
          q3_2027: [52000, 62000, 73000]
          q4_2027: [57000, 68000, 80000]
          q1_2028: [50000, 60000, 71000]
          q2_2028: [47000, 56000, 66000]
        lr2_clean:
          q3_2026: [100000, 120000, 142000]
          q4_2026: [96000, 115000, 136000]
          q1_2027: [88000, 105000, 124000]
          q2_2027: [80000, 95000, 112000]
          q3_2027: [77000, 92000, 108000]
          q4_2027: [84000, 100000, 118000]
          q1_2028: [75000, 90000, 106000]
          q2_2028: [69000, 82000, 97000]
        # MR forwards moved to sectors.product.scenarios.moderate_correction.mr
        # (2026-06-01). See METHODOLOGY §11.5.

      # ---------------------------------------------------------------------
      # Scenario B: MOU BASE CASE (signs and three-phase plays out as modeled)
      # Phase 1 backlog spike → Phase 2 normalization → Phase 3 structural
      # ---------------------------------------------------------------------
      mou_base:
        # Weight 0.18 (Jun-9-2026 POINT-IN-TIME; was 0.50 v1). Reweighted DOWN — earns
        # mass back only on PHYSICAL Hormuz reopening (verified transit + mine-clearing),
        # NEVER on a deal announcement alone (announcement-gated changes destroyed the
        # May-29 weight set within 10 days — see Appendix A panel).
        weight: 0.18
        description: >
          MoU signs, three-phase path materializes: ~30 days of Phase 1 backlog
          clearance (MEG-loading routes spike on fixture scramble) followed by
          Phase 2 normalization (-30 to -45% MEG, -10 to -20% Atlantic) then
          Phase 3 structural (-15 to -25% on Cal-27 strip).
        phase_tags:
          q3_2026: P1_P2_blend     # ~30d P1 + ~60d P2 within quarter
          q4_2026: P2_dominant     # normalization, with winter seasonal
          q1_2027: P3_structural
          q2_2027: P3_structural
          q3_2027: P3_structural
          q4_2027: P3_structural   # Q4 seasonal lift
          q1_2028: P3_structural
          q2_2028: P3_structural
        vlcc:
          q3_2026: [120000, 175000, 220000]  # P1 spike risk; base above midpoint
          q4_2026: [48000, 60000, 72000]     # P2 -30 to -45% MEG haircut
          q1_2027: [45000, 56500, 68000]     # P3 -25% structural
          q2_2027: [38000, 48000, 58000]
          q3_2027: [40000, 49000, 58000]
          q4_2027: [48000, 58000, 68000]     # winter seasonal
          q1_2028: [44000, 54000, 64000]     # extrapolated; continued orderbook
          q2_2028: [36000, 45000, 54000]     # extrapolated
        suezmax:
          q3_2026: [55000, 67500, 80000]     # P1 neutral; already discounted
          q4_2026: [42000, 52000, 62000]     # P2 -10 to -20% Atlantic haircut
          q1_2027: [32000, 40000, 48000]     # P3 structural
          q2_2027: [26000, 32000, 38000]
          q3_2027: [28000, 34000, 40000]
          q4_2027: [32000, 40000, 48000]     # winter seasonal
          q1_2028: [30000, 37000, 44000]     # extrapolated
          q2_2028: [24000, 30000, 36000]     # extrapolated
        aframax_dirty:
          q3_2026: [42000, 52000, 62000]     # minor P2 drift
          q4_2026: [34000, 41000, 48000]     # P2 normalization
          q1_2027: [26000, 33000, 40000]     # P3 structural
          q2_2027: [22000, 28000, 34000]
          q3_2027: [22000, 28000, 34000]
          q4_2027: [26000, 33000, 40000]
          q1_2028: [24000, 31000, 38000]     # extrapolated
          q2_2028: [20000, 26000, 32000]     # extrapolated
        lr2_clean:
          q3_2026: [65000, 95000, 120000]    # MEG-loading P1 spike, like VLCC
          q4_2026: [28000, 35000, 42000]     # P2 -30% MEG haircut
          q1_2027: [26000, 34000, 42000]     # P3 structural
          q2_2027: [22000, 29000, 36000]
          q3_2027: [22000, 29000, 36000]
          q4_2027: [26000, 33000, 40000]
          q1_2028: [24000, 31000, 38000]     # extrapolated
          q2_2028: [20000, 26000, 32000]     # extrapolated
        # MR forwards moved to sectors.product.scenarios.glut_base.mr
        # (2026-06-01). See METHODOLOGY §11.5.

      # ---------------------------------------------------------------------
      # Scenario C: MOU BEAR (signs, but Iran fails to ramp; no Phase 1 spike)
      # Phase 2 onset immediate. May 29 equity sell-off was correct.
      # ---------------------------------------------------------------------
      mou_bear:
        # Weight 0.12 (Jun-9-2026 POINT-IN-TIME; was 0.25 v1). mou_bear was the implicit
        # bear under a deal-delivers regime; loses mass in parallel with mou_base.
        weight: 0.12
        description: >
          MoU signs but Iran fails to ramp exports (sanctions infrastructure too
          degraded, buyers reluctant, or political pushback). No Phase 1 backlog
          spike. Phase 2 onset immediate. Phase 3 slightly worse due to more
          aggressive enforcement of sanctioned-fleet retirement.
        triggers_into_this_scenario:
          - Iran exports remain <1 mb/d in first 2 weeks post-MoU sign
          - MR Product Avg continues falling below $20k floor
          - Floating storage clears via discount sales rather than fixture surge
        phase_tags:
          q3_2026: P2_dominant     # P1 collapses; P2 begins immediately
          q4_2026: P2_dominant
          q1_2027: P3_structural
          q2_2027: P3_structural
          q3_2027: P3_structural
          q4_2027: P3_structural
          q1_2028: P3_structural
          q2_2028: P3_structural
        vlcc:
          # Jun-9-2026 timing view (NOT a settled level) — was [60000, 80000, 100000].
          # Same rationale as pre_mou_baseline VLCC q3_2026: lift the opening band so
          # Q3 doesn't open below current $388k spot. Q4 unchanged.
          q3_2026: [89000, 119000, 149000]   # no P1 spike; immediate P2 onset
          q4_2026: [42000, 53000, 64000]    # deeper P2 haircut
          q1_2027: [38000, 48000, 58000]    # deeper P3 structural
          q2_2027: [32000, 41000, 50000]
          q3_2027: [34000, 43000, 52000]
          q4_2027: [42000, 51000, 60000]
          q1_2028: [38000, 47000, 56000]    # extrapolated
          q2_2028: [30000, 39000, 48000]    # extrapolated
        suezmax:
          q3_2026: [45000, 55000, 65000]    # below pre-MoU; immediate drift down
          q4_2026: [38000, 46000, 54000]
          q1_2027: [28000, 35000, 42000]
          q2_2027: [22000, 28000, 34000]
          q3_2027: [24000, 30000, 36000]
          q4_2027: [28000, 35000, 42000]
          q1_2028: [26000, 32000, 38000]    # extrapolated
          q2_2028: [22000, 27000, 32000]    # extrapolated
        aframax_dirty:
          q3_2026: [36000, 44000, 52000]    # below pre-MoU
          q4_2026: [30000, 36000, 42000]
          q1_2027: [22000, 28000, 34000]
          q2_2027: [20000, 25000, 30000]
          q3_2027: [20000, 25000, 30000]
          q4_2027: [22000, 28000, 34000]
          q1_2028: [22000, 27000, 32000]    # extrapolated
          q2_2028: [18000, 23000, 28000]    # extrapolated
        lr2_clean:
          q3_2026: [38000, 48000, 58000]    # no MEG-loading P1 spike
          q4_2026: [24000, 30000, 36000]
          q1_2027: [22000, 28000, 34000]
          q2_2027: [20000, 25000, 30000]
          q3_2027: [20000, 25000, 30000]
          q4_2027: [22000, 28000, 34000]
          q1_2028: [20000, 26000, 32000]    # extrapolated
          q2_2028: [18000, 22000, 26000]    # extrapolated
        # MR forwards moved to sectors.product.scenarios.demand_softening.mr
        # (2026-06-01). See METHODOLOGY §11.5.

    # =======================================================================
    # CRUDE — CYCLE WEIGHTING ANCHORS
    # 10-year historical TCE means by class, used to compute cycle position
    # ratio = (forward 12M base) / (10yr mean). Threshold bands per
    # METHODOLOGY.md section 2.3.
    # =======================================================================
    cycle_anchors:
      vlcc:
        ten_year_mean: 40000
        source: Baltic TD3C historical 2016-2025
      suezmax:
        ten_year_mean: 27747
        source: Baltic TD20 historical
      aframax_dirty:
        ten_year_mean: 36483
        source: Baltic TD25 historical (Wk40 2025 reference)
      lr2_clean:
        ten_year_mean: 27000
        source: Baltic TC1 historical, approximate
      # MR cycle anchor moved to sectors.product.cycle_anchors.mr (2026-06-01).
      # The crude sector no longer routes any product-class scenarios; clean-trade
      # MR / LR1 / LR2 live entirely under sectors.product. See METHODOLOGY §11.5.

  # ===========================================================================
  # LNG CARRIER SECTOR
  # Glut-cycle scenarios for modern 174k cbm LNGCs. Driven by the 2024-2028
  # newbuild orderbook (~330+ vessels delivering) running into a flat-to-soft
  # LNG demand profile, with Asian winter / EU storage seasonality dominating
  # the base case. Tight-resurgence is the upside tail; structural_reset is the
  # secular-decline tail (defined but inactive, weight 0.0 — see below).
  #
  # LNG weights — Jun-9-2026 POINT-IN-TIME (v4 — METHODOLOGY §11.3 v4):
  #   tight_resurgence    0.25   (raised from v3 0.15 — Hormuz risk to Qatar LNG)
  #   moderate_tightening 0.25   (held flat from v3)
  #   glut_base           0.38   (trimmed from v3 0.45)
  #   glut_intensifies    0.12   (trimmed from v3 0.15)
  #   structural_reset    0.00   (curated; weight 0; qualitative overlay only)
  # Version-tagged Jun-9: this is a POINT-IN-TIME set, not a permanent lock.
  # Revisit when the US response to the Jun-8 helicopter downing resolves.
  # Full weight history in METHODOLOGY §11.3 (v1 → v2 Set B → v3 → Jun-9 v4).
  # ===========================================================================
  lng:

    framework_description: >
      LNG carrier cycle scenarios. Modern 174k cbm two-stroke LNGC is the
      reference vessel (FLNG fleet, Cool Co fleet, Awilco etc.). Rates expressed
      in $/day TCE-equivalent for a 12-month TC. The four scenarios trace the
      orderbook-vs-demand tension: tight resurgence (winter cold + ME LNG
      disruption pulls rates into a near-term spike), moderate tightening
      (modest winter strength), glut base (orderbook deliveries through 2027
      keep rates flat; seasonal winter lifts), glut intensifies (more NB orders
      pulled forward + warm winters + Chinese import slowdown).

    scenarios:

      # ---------------------------------------------------------------------
      # tight_resurgence — the LNG upside tail.
      # ME LNG disruption (Qatar/UAE incident, Hormuz spillover) + cold Asian
      # winter + EU storage refill scramble. Modern 174k LNGC TC into the
      # $150-220k zone near-term, normalising to $90-130k by 2027-28.
      # Weight 0.15 (Set B-revised v3 lock, METHODOLOGY §11.3 v3): raised
      # from the Set B 0.10 to reflect the Ras Laffan + winter setup —
      # Trains 4 & 6 offline 12.8 mtpa partially offsets the 2026 ramp.
      # ---------------------------------------------------------------------
      tight_resurgence:
        # Weight 0.25 (Jun-9-2026 POINT-IN-TIME; was 0.15 v3). Raised — Qatar LNG
        # transits Hormuz, a contested strait is a direct tight_resurgence trigger.
        weight: 0.25
        description: >
          ME LNG disruption + cold winter + EU storage refill scramble pulls
          174k modern LNGC TC into the $150-220k zone near-term; normalises to
          $90-130k by 2027-28. The genuine LNG upside tail; orderbook drag is
          temporarily overwhelmed.
        lng:
          q3_2026: [70000, 90000, 115000]
          q4_2026: [170000, 210000, 260000]
          q1_2027: [150000, 185000, 225000]
          q2_2027: [85000, 105000, 130000]
          q3_2027: [90000, 110000, 135000]
          q4_2027: [150000, 180000, 215000]
          q1_2028: [140000, 170000, 205000]
          q2_2028: [78000, 95000, 115000]
        # MGC tight_resurgence: LPG export tightness + NH3 fuel-demand surge +
        # multi-gas trade pull. Less peak than LNG (MGCs are smaller, less
        # ME-supply-sensitive). 12M base ~$45k vs current ~$28k 12M TC.
        mgc:
          q3_2026: [30000, 38000, 47000]
          q4_2026: [40000, 52000, 65000]
          q1_2027: [38000, 48000, 60000]
          q2_2027: [30000, 38000, 47000]
          q3_2027: [32000, 40000, 50000]
          q4_2027: [40000, 52000, 65000]
          q1_2028: [38000, 48000, 60000]
          q2_2028: [30000, 38000, 47000]

      # ---------------------------------------------------------------------
      # moderate_tightening — modest winter strength + some ME tightening,
      # no spike. Modern 174k LNGC TC $55-110k seasonally.
      # Weight 0.25 (Set B-revised v3 lock, METHODOLOGY §11.3 v3): raised
      # from Set B 0.15 to reflect the 2026 supply environment where the
      # Cheniere Stage 3 ramp is partially absorbed by Ras Laffan damage;
      # current spot $67.5k (+391% YoY) is empirically tight-pricing.
      # ---------------------------------------------------------------------
      moderate_tightening:
        # Weight 0.25 (Jun-9-2026 POINT-IN-TIME; held flat from v3). Iran/Hormuz
        # tightening pressure offsets the secular glut bias.
        weight: 0.25
        description: >
          Modest winter strength + some ME tightening, no spike. Modern 174k
          LNGC TC $55-110k seasonally. The LNG analogue of the crude pre-MoU
          baseline: today's mildly constructive environment persists.
        lng:
          q3_2026: [42000, 55000, 70000]
          q4_2026: [85000, 100000, 120000]
          q1_2027: [80000, 95000, 115000]
          q2_2027: [54000, 65000, 80000]
          q3_2027: [58000, 70000, 85000]
          q4_2027: [85000, 100000, 120000]
          q1_2028: [80000, 95000, 115000]
          q2_2028: [54000, 65000, 80000]
        # MGC moderate_tightening: modest winter LPG demand + LCO2 trade traction
        # but no spike. 12M base ~$32k.
        mgc:
          q3_2026: [25000, 30000, 37000]
          q4_2026: [32000, 38000, 46000]
          q1_2027: [30000, 36000, 43000]
          q2_2027: [25000, 30000, 36000]
          q3_2027: [25000, 30000, 36000]
