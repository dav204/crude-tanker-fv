        # Weight 0.25 (Jun-9-2026 POINT-IN-TIME; was 0.10 v1). Reweighted UP after the
        # April/May MoU/ceasefire path failed to physically reopen Hormuz; Jun-8 US
        # helicopter downed near the strait + ceasefire faltering. The 0.25/0.45 esc/pre
        # split hinges on the pending US response — revisit when it resolves. See
        # METHODOLOGY §11.x crude weight history + Appendix A.
        weight: 0.25
        description: >
          Conflict escalates beyond current intensity (third-party strike, wider
          MEG closure, no MoU). MEG-loading VLCC/LR2 sustain $400k+ near-term;
          Atlantic (Suezmax/Aframax) firms on rerouting. Cal-26 blended $200k+,
          Cal-27 well above mid-cycle.
